# build: every pull request and every push to main builds the docs site (site/, `npm run build`), so a page that
# cannot render (a missing frontmatter fence, a broken MDX expression) fails here instead of in the deploy.
# This repository is public: it runs on GitHub's hosted runners only, never on managed or self-hosted ones.
name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
