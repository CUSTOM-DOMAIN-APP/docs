  # ------------------------------------------------------------------ Monitor
  /monitor:check:
    post:
      operationId: checkRecords
      summary: Check declared baseline records against live public DNS
      tags: [Monitor]
      description: >-
        Resolves each baseline record and reports whether it is still present.
        This is what the SDK's `checkRecords` rides on. Read-only; performs no
        writes.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, baseline]
              properties:
                domain: { type: string }
                baseline:
                  type: array
                  items:
                    type: object
                    properties:
                      subdomain: { type: string }
                      type: { type: string }
                      values:
                        type: array
                        items: { type: string }
      responses:
        '200':
          description: Drift report
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Webhooks
  /webhooks:
    post:
      operationId: createWebhook
      summary: Register a webhook endpoint (secret returned once)
      tags: [Webhooks]
      description: >-
        Registers an HTTPS receiver under the calling application. The `secret`
        (`whsec_…`) is returned ONCE — store it to verify signatures. An empty
        `events` array subscribes to all events; `"*"` also matches all.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  description: >-
                    Event types to subscribe to; empty subscribes to all events,
                    and `"*"` also matches all. `connection.records.updated` /
                    `connection.reapply.failed` / `connection.disconnected` cover
                    the managed (async one-click) re-apply and disconnect
                    lifecycle.
                  items:
                    type: string
                    enum:
                      - '*'
                      - domain.added
                      - domain.flow.completed
                      - domain.propagation.timeout
                      - domain.record_missing
                      - domain.record_restored
                      - domain.purchased
                      - purchase.error
                      - purchase.confirmation.expired
                      - domain.transfer.in.initiated
                      - domain.transfer.in.completed
                      - domain.transfer.out.initiated
                      - domain.transfer.out.completed
                      - secure_status
                      - power_status
                      - connection.created
                      - connection.applied
                      - connection.live
                      - connection.failed
                      - connection.records.updated
                      - connection.reapply.failed
                      - connection.disconnected
      responses:
        '201':
          description: Created (secret returned once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      tags: [Webhooks]
      description: >-
        With an `sk_` API key: endpoints across all the tenant's apps. With a
        widget JWT: the calling app's endpoints. Secrets are omitted.
      security:
        - apiKey: []
        - widgetJWT: []
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      security:
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: Recent webhook delivery attempts for the caller's tenant
