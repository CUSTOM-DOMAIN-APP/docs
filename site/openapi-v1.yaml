# CustomDomain™ public API contract (/v1).
#
# This vendored spec is the SINGLE SOURCE OF TRUTH for the Fumadocs API
# reference: every page under src/content/docs/api-reference/** is generated
# from THIS file by `npm run gen:api` (scripts/gen-api-docs.ts). It mirrors the
# routes the control-plane actually registers (services/control-plane/internal/
# api/api.go) and the machine-readable document served at GET /v1/openapi.json.
#
# Versioning: URI major (/v1), additive-only within a version.
openapi: 3.1.0
info:
  title: CustomDomain™ Control-Plane API
  version: "1.0"
  description: >-
    APIs for connecting your customers' domains to your product:
    Connect (DNS) · Secure (SSL) · Sell (domain resale) · Monitor (DNS drift),
    plus tenancy, members, billing, and webhooks.


    Four credential types authenticate the surface. A **management key** gates
    operator/provisioning routes. A tenant **API key** (`cd_live_…` / `cd_test_…`)
    is the long-lived server-to-server credential; keys created before the switch
    to `cd_` start with `sk_live_…` / `sk_test_…` and are still accepted. A
    short-lived **widget JWT**, minted server-side via `POST /v1/tokens`,
    authorizes the browser widget and is scoped to one application (and
    optionally one domain). A delegated **agent token**, a 15 minute JWT from the
    OAuth endpoints under the Agents tag, lets an AI assistant act for one
    application within the scopes a person approved in the console; each route
    that accepts it lists the scopes it needs.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://api.customdomain.ai/v1
    description: Hosted control-plane
  - url: http://localhost:8080/v1
    description: Local control-plane
security:
  - apiKey: []
tags:
  - name: Tenancy
    description: 'Operator provisioning: tenants and one-call signup.'
  - name: Applications
    description: Applications and their long-lived API keys.
  - name: Members
    description: 'Multi-user tenancy: invites, roles, and membership.'
  - name: Tokens
    description: Minting short-lived widget JWTs for the browser.
  - name: Domains
    description: Read-only domain / DNS-provider feature detection.
  - name: Connections
    description: The connect pipeline for one customer domain, across all four rails.
  - name: Managed DNS
    description: CustomDomain™ hosts a domain's whole zone after the user points its nameservers at us once, and writes every record from then on.
  - name: Secure
    description: 'Edge-managed TLS certificates (SSL) for connected domains: issue, renew, import, deprovision.'
  - name: Power
    description: 'The edge reverse-proxy for a connection: origin, apex↔www redirect, and root-path serving.'
  - name: Sharing
    description: Forward-to-a-colleague share links that resume a connect flow from a server-side prefill.
  - name: Providers
    description: The DNS-provider capability catalog and parity census.
  - name: Templates
    description: One-click setup service templates and apply-URL building.
  - name: Registrar
    description: Domain search, quote, and purchase (Sell).
  - name: Monitor
    description: Checking declared records against live public DNS (drift).
  - name: Webhooks
    description: Registering receivers and inspecting delivery attempts.
  - name: Billing
    description: Plans, metered usage, the subscription (trial, grace, invoices), checkout, and the billing portal.
  - name: Enterprise
    description: RBAC reference matrix and the audit log.
  - name: Meta
    description: Public service discovery and capability advertisement.
  - name: Analytics
    description: The tenant's connect funnel, connection outcomes, and the traffic its domains receive at the edge.
  - name: Provider accounts
    description: >-
      DNS provider and registrar keys a workspace connects once, with one time
      or continuous access, for some or all of the account's domains.
  - name: Cloud browser
    description: >-
      Sign in to a DNS provider that offers no sign in of its own, inside a temporary
      browser, with the customer present. The customer types their own password into
      the provider's real page; CustomDomain™ never receives it. Our software then
      reads the provider's DNS page for one domain, shows the exact changes, and makes
      them only after the customer approves. Off unless the deployment turns it on.
  - name: Agents
    description: >-
      AI assistants acting for a workspace. An agent registers, a person approves
      what it may do in the console, and it works with a short lived token until
      the grant is revoked. The hosted MCP server accepts these tokens. The
      authorization server metadata (RFC 8414) and the signing keys (RFC 7517)
      are served on the API origin at `/.well-known/oauth-authorization-server`
      and `/.well-known/jwks.json`.

paths:
  # ------------------------------------------------------------------ Tenancy
  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      tags: [Tenancy]
      description: Operator provisioning endpoint. Requires the management key in production.
      security:
        - managementKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant
      tags: [Tenancy]
      security:
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTenant
      summary: Rename your workspace
      tags: [Tenancy]
      description: The caller's own tenant only (admin and above); any other id is a `404`.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants:provision:
    post:
      operationId: provisionTenant
      summary: One-call signup provisioning (tenant + owner + app + API key)
      tags: [Tenancy]
      description: >-
        Atomically creates a tenant, its first owner member, a default
        application, and a long-lived API key. `api_key` and `client_secret` are
        returned ONCE. Guarded by the dedicated provision secret (the
        `X-Provision-Secret` header or a Bearer token) so the customer console's
        server can hold this narrow secret instead of the operator management key.
        It also mints the workspace default key (see
        `POST /tenants/{tenant_id}/default-key`) and returns it ONCE as
        `default_api_key` with its id; both fields are absent if it could not be
        made, and the default key route makes it later.
      security:
        - provisionSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_name]
              properties:
                tenant_name: { type: string }
                app_name: { type: string }
                owner_email: { type: string }
                environment: { $ref: '#/components/schemas/Environment' }
      responses:
        '201':
          description: Provisioned (api_key + client_secret shown once)
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, application_id, api_key, client_secret]
                properties:
                  tenant_id: { type: string }
                  application_id: { type: string }
                  api_key: { type: string, description: 'cd_live_… or cd_test_…; shown once' }
                  client_secret: { type: string, description: mints widget JWTs; shown once }
                  default_api_key: { type: string, description: 'The workspace default key, cd_live_… or cd_test_…; shown once. Absent when it could not be made.' }
                  default_api_key_id: { type: string, description: 'The default key''s id; present with default_api_key.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/default-key:
    post:
      operationId: ensureDefaultApiKey
      summary: Ensure the workspace default key exists (secret returned only when created)
      tags: [Tenancy]
      description: >-
        The workspace default key is an ordinary API key (full workspace access,
        `cd_live_…` in production) flagged `is_default`, at most one active per
        workspace, whose secret the customer console keeps sealed so the
        workspace's owner or an admin can view it more than once. Server to
        server, guarded by the provision secret like `tenants:provision`; a
        missing and a wrong secret get the same `401`. With no active default key
        this creates one and answers `201` with the full secret ONCE in
        `api_key`. With one, it answers `200` with its id and prefix and no
        secret (a caller that lost its copy rotates instead). Not subject to the
        billing activation gate: the key adds no capability the workspace's
        console key does not already hold.
      security:
        - provisionSecret: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: An active default key exists; no secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultApiKey' }
        '201':
          description: Created; api_key is the full secret, shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultApiKey' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/default-key:rotate:
    post:
      operationId: rotateDefaultApiKey
      summary: Rotate the workspace default key (new secret returned once)
      tags: [Tenancy]
      description: >-
        Mints a new default key and revokes the old active one in one
        transaction: the old key stops authenticating at once, and there is never
        a moment with two active default keys or none. The workspace's other keys
        are untouched. With no active default key it simply creates one. Same
        provision secret guard as `POST /tenants/{tenant_id}/default-key`.
      security:
        - provisionSecret: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rotated; api_key is the new full secret, shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultApiKey' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------- Applications
  /applications:
    post:
      operationId: createApplication
      summary: Create an application (client_secret returned once)
      tags: [Applications]
      description: >-
        Accepts the management key (the body `tenant_id` selects the tenant) or a
        tenant-scoped API key (the app is always created in the key's own
        tenant; any body `tenant_id` is ignored).


        Send `"sandbox": true` to make a **test mode** application: a place to
        run the widget, the API and webhooks end to end before you have a real
        customer domain. It connects only reserved `.test` names (the first
        label picks the outcome: `conflict.acme.test` stays pending with
        `domain_already_connected`, `timeout.acme.test` fails after about a
        minute with `propagation_timeout`, any other name goes live after
        about 15 seconds), uses the manual rail only, and counts for nothing:
        no free domain, no quota, no billing, no metering and no reporting.
        Webhook events from it carry `"sandbox": true`. A workspace can hold up
        to 3 test mode applications, each up to 100 connections (`sandbox_limit`).
        A test mode application is always a development application, so leave
        `environment` out. A live application never connects a `.test` name
        (`sandbox_domain_reserved`), and a test mode one never connects a real
        name (`sandbox_domain_required`).
      security:
        - managementKey: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name]
              properties:
                tenant_id: { type: string }
                name: { type: string }
                environment: { $ref: '#/components/schemas/Environment' }
                sandbox:
                  type: boolean
                  description: >-
                    Create a test mode application (see above). Fixed for the
                    life of the application.
      responses:
        '201':
          description: Created (client_secret present only here)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Application' }
                  - type: object
                    properties:
                      client_secret: { type: string, description: mints widget JWTs; shown once }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/BillingRequired' }
    get:
      operationId: listApplications
      summary: List applications
      tags: [Applications]
      description: >-
        With an API key: the caller's own tenant's apps. A **test mode** key
        lists only its own application, which is how a server learns which
        application a key belongs to. With the management key: `?tenant_id=`
        selects the tenant.
      security:
        - apiKey: []
        - managementKey: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
          description: Required only when listing with the management key.
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: object
                required: [applications, count]
                properties:
                  applications:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /applications/{id}:
    get:
      operationId: getApplication
      summary: Get an application
      tags: [Applications]
      security:
        - managementKey: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateApplication
      summary: Rename an application
      tags: [Applications]
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteApplication
      summary: Delete an application
      tags: [Applications]
      description: >-
        Deletes one of your applications together with what belongs only to
        it: its API keys stop working, and its webhook endpoints, share links
        and settings are removed. Needs an admin or owner key (it revokes keys).
        Another tenant's application is a 404.


        Refused with `409` when deleting would break something that works,
        each with the reason in `details`: `default_application` (your
        workspace's default application, the oldest one: the signup key and
        your team's access belong to it, so it also keeps your last
        application), `application_key_in_use` (the key making the request
        belongs to this application) and `application_has_domains` (it still
        has domains, in any state; disconnect them first with
        `DELETE /connections/{id}`).
      security:
        - apiKey: []
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /applications/{id}/keys:
    post:
      operationId: createApiKey
      summary: Issue an API key for an application (key returned once)
      tags: [Applications]
      security:
        - apiKey: []
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                environment: { $ref: '#/components/schemas/Environment' }
      responses:
        '201':
          description: Created; the full secret is present only in this response
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiKey' }
                  - type: object
                    properties:
                      key: { type: string, description: 'cd_live_… or cd_test_…; shown once, stored hashed' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/BillingRequired' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      operationId: listApiKeys
      summary: List an application's API keys (secrets omitted)
      tags: [Applications]
      security:
        - apiKey: []
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Keys (metadata only; the secret is never returned again)
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /applications/{id}/keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags: [Applications]
      security:
        - apiKey: []
        - managementKey: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Members
  /members:
    post:
      operationId: inviteMember
      summary: Invite a member to the caller's tenant
      tags: [Members]
      description: >-
        Creates a pending member and its single-use invite link. The response
        carries `invite_token`; send the invitee a link built from it. The link
        works for 7 days, after which the member is reported as `expired` until
        an admin resends or revokes it. The inviter's email is taken from the
        credential that sends the invite, never from the body. Requires admin
        or owner (`member:manage`); a caller cannot invite a role above their
        own, and `owner` is reached only by promoting an existing member.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { $ref: '#/components/schemas/Role' }
                inviter_name:
                  type: string
                  description: Display name of the person sending the invite, shown to the invitee. Optional; at most 80 characters.
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      operationId: listMembers
      summary: List the caller tenant's members
      tags: [Members]
      description: >-
        Every member and pending invite of the caller's tenant, each with its
        `status`: `active` once accepted, `pending` while its invite link
        works, `expired` once the link has lapsed. Invite tokens never appear
        here.
      security:
        - apiKey: []
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
  /members:preview:
    post:
      operationId: previewInvite
      summary: Preview an invite by its token, without accepting it
      tags: [Members]
      description: >-
        What an invite link is for: the invited email, the workspace, the role,
        who sent it, and whether it still works. Nothing is accepted or spent.
        Public: the token is the capability, exactly as for `members:accept`,
        and it travels in the body so it never lands in an access log. A link
        that stopped working says why (`accepted`, `expired`, `revoked`, or
        `replaced` by a newer invite to the same address); a token that was
        never issued is a 404. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The invite token from the invite link. }
      responses:
        '200':
          description: The invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /members:accept:
    post:
      operationId: acceptMember
      summary: Accept an invite (single-use token)
      tags: [Members]
      description: >-
        Accepts the invite and returns the member with a member-scoped API key
        for the inviter's tenant. The token is the capability, so no API key is
        needed; when `email` is supplied it must match the invited email. The
        token is spent on success. A pending invite whose link has lapsed is
        refused with 410 `invite_expired`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                email: { type: string, description: "When supplied, must match the invited email." }
                user_id: { type: string, description: 'The accepting user''s id in the calling application, recorded as `invited_by`.' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Member' }
                  - type: object
                    required: [application_id, api_key]
                    properties:
                      application_id: { type: string, description: The inviter tenant's default application. }
                      api_key: { type: string, description: 'Member-scoped API key for the inviter''s tenant; shown once.' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /members/{id}:
    patch:
      operationId: updateMemberRole
      summary: Change a member's role (owner-protected)
      tags: [Members]
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      summary: Remove a member or revoke a pending invite (owner-protected)
      tags: [Members]
      description: >-
        Removing a member revokes their member-scoped API key at once. Revoking
        a pending invite stops its link working; a preview of that link then
        reports `revoked`.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /members/{id}/invite:
    get:
      operationId: getMemberInvite
      summary: Get a pending member's current invite token
      tags: [Members]
      description: >-
        Returns the pending member with its current `invite_token`, so an admin
        can copy the link again. Reading it changes nothing: the link already
        sent keeps working. Requires admin or owner (`member:manage`). A member
        who already joined has no invite: 404.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The pending member and its invite token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /members/{id}/invite:resend:
    post:
      operationId: resendMemberInvite
      summary: Re-issue a pending invite with a fresh link
      tags: [Members]
      description: >-
        Gives a pending (or expired) invite a new token that works for another
        7 days and returns it as `invite_token`; send the invitee a link built
        from it. The previous link stops working at once, and a preview of it
        reports `replaced`. Requires admin or owner (`member:manage`). A member
        who already joined is a 409.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inviter_name:
                  type: string
                  description: Display name of the person resending, shown to the invitee. Optional; at most 80 characters.
      responses:
        '200':
          description: Re-issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------- Tokens
  /tokens:
    post:
      operationId: createWidgetToken
      summary: Exchange application credentials for a short-lived widget JWT
      tags: [Tokens]
      description: >-
        Server-side only. Trade an application's `client_secret` for a
        short-lived widget JWT the browser can use on the Connect endpoints.
        Never ship the `client_secret` or an API key to the browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id, client_secret]
              properties:
                application_id: { type: string }
                client_secret: { type: string }
                domain:
                  type: string
                  description: Optional. Binds the token to a single hostname.
                domains:
                  type: array
                  items: { type: string }
                  description: >-
                    Optional. A list of hostnames the token may act on, so a
                    multi-domain flow needs one token instead of one per domain.
                    Each entry is normalized and duplicates and blanks are
                    dropped. Additive to `domain`; omit both for a token that
                    is not bound to a hostname.
                end_user_ref:
                  type: string
                  maxLength: 256
                  description: >-
                    Optional. Binds the token to one end user: your own id for
                    them. A connection created with the token is stamped with
                    it (a different `end_user_ref` in the create body is
                    refused), and an end user's token removes a domain, or reads
                    its monitoring, services and timeline, only when it is
                    bound to the domain and minted with the connection's own
                    `end_user_ref`.
                scope:
                  type: string
                  enum: [connect, app]
                  default: connect
                  description: >-
                    `connect` (the default) is an END USER's token for the
                    widget: it runs the connect flow for a domain (check,
                    create, read its own connection, verify, one-click and
                    OAuth starts, sharing, telemetry, diagnose) and nothing
                    else, because it lives in that end user's browser. `app` lets
                    your server act as the whole application (list every
                    connection, manage webhooks, configure SSL and Power, bulk
                    create, purchases). Never hand an `app` token to a browser.
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type, expires_in]
                properties:
                  token: { type: string, description: the widget JWT (Bearer) }
                  token_type: { type: string, examples: [Bearer] }
                  expires_in: { type: integer, description: lifetime in seconds (default 900) }
                  scope: { type: string, enum: [connect, app], description: the scope the token was minted with }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429':
          description: >-
            `rate_limited`: too many token requests, either from this address
            or for this `application_id`. Retry shortly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ Domains
  /public/domain-connect-check:
    get:
      operationId: publicDomainConnectCheck
      summary: Check one-click setup support for a domain (public)
      tags: [Domains]
      description: >-
        Unauthenticated helper behind the free Domain Connect support checker
        tool. Answers whether a domain's DNS provider supports one-click setup:
        it runs the same detection cascade as the widget (Domain Connect
        discovery probed ahead of NS-pattern matching) and cross-references the
        63-provider census. Results are cached for 24 hours per domain and the
        endpoint is rate-limited per IP; do not build product flows on it. Use
        the authenticated `domains:check`, which carries records-aware conflict
        and apex verdicts.
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
          description: Hostname to check, e.g. example.com
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema:
                type: object
                required: [domain, setup_type, one_click, domain_connect]
                properties:
                  domain: { type: string, description: canonicalized hostname }
                  setup_type: { type: string, enum: [automatic, manual] }
                  provider_id: { type: string, description: census id of the detected provider }
                  provider_name: { type: string }
                  rail:
                    type: string
                    enum: [oauth, api, dc, manual]
                    description: census routing for the detected provider
                  one_click:
                    type: boolean
                    description: >-
                      true when the user only approves: an OAuth-routed provider,
                      or a Domain Connect provider whose template check shows it
                      holds our template
                  domain_connect:
                    type: object
                    required: [supported, sync, async]
                    properties:
                      supported: { type: boolean, description: the provider can complete a one-click Domain Connect setup of our template here }
                      sync: { type: boolean }
                      async: { type: boolean }
                      provider: { type: string, description: provider name from DC discovery }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /domains:check:
    post:
      operationId: checkDomain
      summary: Detect where a domain's DNS lives and how it will be set up
      tags: [Domains]
      description: >-
        Read-only feature detection. Returns the provider, the chosen
        `setup_type`, whether automatic setup is possible, whether the
        OAuth-into-provider and one-click setup rails are available, capability
        flags (`ns_support`, `wildcard_support`, `cname_flattening`,
        `spf_override_support`, `caa_support`), social-login support, and any
        `record_conflicts` observed in public DNS. Unknown providers degrade to
        `setup_type: manual`.


        Apex pre-flight: `apex_supported` reports whether the provider can host
        a CNAME-like record at the zone root, and `apex_message` is returned
        when this particular target needs one the provider cannot host, so an
        apex connection that would be refused at apply time is refused here
        instead, before any connection is created.


        The answer is for one application (where its domains point:
        `target_mode` and the apex strategy). A widget JWT checks for its own
        application. An API key checks for `application_id`, which must be an
        application in the key's tenant (404 otherwise), or for the key's own
        application when it is omitted.


        A delegated agent token needs `domains:read` or `domains:connect` and
        checks for its own application; naming another application is a `403`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
        - agentToken: ['domains:connect']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                application_id:
                  type: string
                  description: >-
                    With an API key, the application to check for (defaults to
                    the key's own). A widget JWT may only omit it or send its own
                    application id (403 otherwise).
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainCheck' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- Connections
  /connections:
    post:
      operationId: createConnection
      summary: Create a domain connection (idempotent per app + domain)
      tags: [Connections]
      description: >-
        Starts connecting `domain` under the calling application and returns the
        connection plus its authoritative desired record set. Idempotent: if the
        app already has a non-failed connection for the domain, that existing
        connection is replayed with `200`.


        Callable from the widget (a widget JWT) or straight from your server
        with an API key, in which case the connection is created on the
        key's application, or on `application_id` when that names another
        application of the same tenant.


        A delegated agent token needs `domains:connect` and creates the
        connection on its own application.


        A workspace with no subscription yet connects its first ten domains, or
        the number an operator set, without one (`first_domain_free` and
        `free_domains` on the billing reads): a retry of the last of them is
        still replayed with `200`, and the next domain is refused with
        `402 billing_required` until the workspace starts its trial. A domain
        that is still waiting for its records can be removed with
        `DELETE /connections/{id}`, which frees its place at once.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:connect']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              description: >-
                The body is decoded with unknown fields REJECTED, so the
                properties below are exactly the accepted set: any other key is
                a `400`. Everything besides `domain` is optional.
              properties:
                domain: { type: string }
                application_url:
                  type: string
                  format: uri
                  description: >-
                    Origin the edge reverse-proxies this connection's traffic to
                    (Power). Validated on the way in: it must be an absolute
                    `http(s)` URL with a public host; private, loopback and
                    cloud-metadata targets are rejected with a `400`. Omit to
                    leave the edge on its own router.
                www_redirect: { type: boolean, default: false, description: Serve an apex↔www redirect for this connection. }
                override_spf:
                  type: boolean
                  default: false
                  description: >-
                    Replace an existing SPF record instead of merging into it.
                    Honoured only for providers whose connection check reports
                    `spf_override_support` as true; for every other provider
                    the existing record is merged, as when this is false.
                validate_dmarc:
                  type: boolean
                  default: false
                  description: >-
                    Accepted, stored with the connection and echoed back. It is
                    not acted on yet: DMARC is not checked during verification
                    today.
                validate_caa:
                  type: boolean
                  default: false
                  description: >-
                    Adds the two apex CAA records that authorize Let's Encrypt
                    (`issue` and `issuewild`) to the connection's desired
                    record set, skipping any already present. No separate CAA
                    check is run against the domain's existing records.
                monitor:
                  type: boolean
                  default: true
                  description: >-
                    Enrol the domain in drift monitoring: once the connection
                    goes live the control plane registers a drift watch and the
                    hourly sweeper re-checks the connection's DNS records,
                    emitting `domain.record_missing` / `domain.record_restored`
                    when they change. Unlike the four flags above this one
                    DEFAULTS TO TRUE: omitting it enrols the domain. That is
                    deliberate back-compat: the watch used to be registered
                    unconditionally, so every connection created before this
                    flag was honoured is monitored, and every existing
                    integrator omits the field. Send `false` to opt a connection
                    out; the value is echoed on the connection and is the only
                    thing that decides whether the watch is registered. The
                    plan's Monitor entitlement is not enforced today:
                    monitoring is registered for every connection that has this
                    on, regardless of plan.
                batch_id:
                  type: string
                  description: >-
                    Caller-supplied id correlating every domain connected in one
                    multi-domain session. Stamped on each connection and echoed
                    back; empty for a standalone connect. Set once at create.
                end_user_ref:
                  type: string
                  description: >-
                    The integrator's OWN identifier for the end user this connect
                    is attributed to, so the console can render "Connected by …"
                    and search by customer. Empty ⇒ a console/direct connect.
                    Set once at create and never mutated.
                application_id:
                  type: string
                  description: >-
                    API key callers only: create the connection on this
                    application of the key's tenant. A widget or agent token may
                    only name its own application (anything else is a `403`).
      responses:
        '201':
          description: Connection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '200':
          description: Existing connection replayed (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/BillingRequired' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      operationId: listConnections
      summary: List connections
      tags: [Connections]
      description: >-
        With an API key: every connection across the tenant's applications
        (optional `?app_id=` and `?status=` filters). With an `app`-scoped widget
        JWT or a delegated agent token: the calling application's connections
        (`app_id` is ignored; the scope is fixed to that application). A
        `connect`-scoped widget JWT (an end user's) is refused with `403`.


        **The response is paginated and always bounded.** `limit` defaults to 500
        and is clamped to 1000; `next_cursor` is present **only** when more rows
        remain. To read every connection, follow `next_cursor` until it is
        absent. Counting rows client-side is not required; see
        `GET /connections:count`.


        A `status` outside the enum is rejected with **400** (it used to reach
        the database and surface as a 500).


        A delegated agent token needs `domains:read`.
      security:
        - apiKey: []
        - widgetJWT: []
        - agentToken: ['domains:read']
      parameters:
        - { name: app_id, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConnectionStatus' }
        - name: limit
          in: query
          required: false
          description: Rows per page. Defaults to 500; values above 1000 are clamped to 1000.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque keyset cursor taken verbatim from a previous response's
            `next_cursor`. Omit for the first page.
          schema: { type: string }
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [connections, count]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
                  count:
                    type: integer
                    description: Rows in THIS page, not the tenant total.
                  next_cursor:
                    type: string
                    description: >-
                      Present only when further rows remain. Pass it back as
                      `?cursor=` to fetch the next page.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /connections:count:
    get:
      operationId: countConnections
      summary: Count the tenant's connections (no rows)
      tags: [Connections]
      description: >-
        The tenant's connection histogram, computed server-side in one grouped
        query. Use this instead of paging `GET /connections` when you only need
        totals (dashboards, quota meters, per-application domain counts). The
        numbers are exact regardless of how many connections the tenant has.


        `by_status` carries only statuses that actually occur: an absent key
        means **zero**, never "unknown". Optional `?app_id=` / `?status=` narrow
        the aggregate exactly as they narrow the list; a `status` outside the
        enum is rejected with **400**.


        API key only: this is a tenant-wide aggregate, so a per-application
        widget JWT cannot read it.
      security:
        - apiKey: []
      parameters:
        - { name: app_id, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConnectionStatus' }
      responses:
        '200':
          description: Connection counts
          content:
            application/json:
              schema:
                type: object
                required: [total, by_status, by_application]
                properties:
                  total: { type: integer }
                  by_status:
                    type: object
                    additionalProperties: { type: integer }
                  by_application:
                    type: array
                    items:
                      type: object
                      required: [application_id, total, by_status]
                      properties:
                        application_id: { type: string }
                        total: { type: integer }
                        by_status:
                          type: object
                          additionalProperties: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /connections/{id}:
    get:
      operationId: getConnection
      summary: Get a connection with its authoritative record set
      tags: [Connections]
      description: >-
        Returns the connection object and its records. The connection carries a
        `managed` boolean: `true` when it opted in to **managed
        mode** (the control plane holds a durable, encrypted async grant so it can
        re-apply / revert the template server-side without re-consent); `false`
        (omitted on the wire) for the default use-once connection.


        A delegated agent token needs `domains:read` and reads only connections
        of its own application; another application's connection answers `404`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: disconnectConnection
      summary: Remove a domain, removing or keeping the DNS records we added
      tags: [Connections]
      description: >-
        Removes the domain, and with `records` says what happens to the DNS
        records we added. `remove` deletes them and puts back what they
        replaced, when we know it; `keep` leaves them. What `remove` can do
        depends on how the domain was connected, and
        `GET /connections/{id}/removal` says so before you call this: with
        access we kept (our hosted zone, a kept sign-in, a continuous provider
        account, a kept Domain Connect authorization) it is automatic; with a
        one time sign-in or key it needs one more authorization, and this
        answers `409 reauthorization_required` with the plan (sign in again
        with `oauth:start` and `purpose: "remove"`, send a key to
        `POST /connections/{id}:disconnect`, or call this with
        `records=keep` and follow the manual steps); for Domain Connect
        one-click and manual setups the answer lists the exact manual steps.
        Records whose value changed since we wrote them, values that were
        already there before we wrote them, and records another connected
        domain still uses are never touched. With a key or a sign-in, the zone
        must show at least one of our records before any record is reported
        removed or gone; otherwise the answer lists the manual steps (the key
        may belong to another account).


        Whatever the choice, the domain stops being served the moment the
        removal starts (edges forget it within a minute), its certificate
        stops renewing and is deleted, its monitoring stops, and
        `connection.disconnected` carries a `removal` object with what
        happened to the records. `GET /connections/{id}/removal` answers the
        same outcome once the connection is gone. A second removal of the same
        domain while one runs answers `409 removal_in_progress`.


        Without `records` the call keeps its original contract: records are
        taken out only where it always took them out (a kept Domain Connect
        authorization, a kept sign-in, our hosted zone) and kept otherwise,
        including with a connected provider account or the Route 53 access
        role; the answer is `204` with no body. With `records` the answer is
        `200` with the outcome.


        An end user's widget token (scope `connect`) must be bound to the
        domain and, when the connection names an end user, minted with that
        `end_user_ref`; otherwise `403`.


        A delegated agent token needs `domains:disconnect`, a scope of its own
        because the removal takes the domain offline, and must send `confirm`
        naming the domain. Without it the answer is `400 confirmation_required`,
        and with another domain `409 confirmation_mismatch`; nothing is removed
        either way. Another application's connection answers `404`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:disconnect']
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: records
          in: query
          required: false
          schema: { type: string, enum: [remove, keep] }
          description: What to do with the DNS records we added.
        - name: confirm
          in: query
          required: false
          description: >-
            Required of a delegated agent token: the domain it is removing, as
            written on the connection (case, scheme, path and a trailing dot do
            not matter). Without it the answer is `400 confirmation_required`;
            with another domain, `409 confirmation_mismatch`. Nothing is removed
            either way. Other credentials ignore it.
          schema: { type: string, examples: [shop.acme.com] }
      responses:
        '200':
          description: Removed; what happened to the records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisconnectResult' }
        '204': { description: "Removed (no records choice given): records taken out only through a kept Domain Connect authorization, a kept sign-in or our hosted zone, kept otherwise" }
        '400':
          description: >-
            `confirmation_required`: a delegated agent token did not send
            `confirm`; `details` names the domain to send. `invalid_request`:
            `records` is neither `remove` nor `keep`. Nothing was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            `reauthorization_required`: removing the records needs one more
            sign-in or key; `plan` is the removal plan. `removal_in_progress`:
            another removal of the domain is running. `confirmation_mismatch`: a
            delegated agent token's `confirm` names another domain. Nothing was
            changed.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, enum: [reauthorization_required, removal_in_progress, confirmation_mismatch] }
                  title: { type: string }
                  details: { type: string }
                  plan: { $ref: '#/components/schemas/RemovalPlan' }
  /connections/{id}/removal:
    get:
      operationId: getRemovalPlan
      summary: What removing a domain would do with its DNS records
      tags: [Connections]
      description: >-
        Read-only. Lists the records we added, what each one did to its name
        when we wrote it (created, added to a shared set, replaced, merged) and
        what it held before when we know, what a removal would do with each,
        whether that can happen automatically, needs one more sign-in or key,
        or only by hand, and the exact manual steps. Show it before asking
        the person to confirm. While a removal runs, `removal_started_at` is
        set. Once the domain is removed, it answers `removed: true` with
        `result`, what the removal did, to the callers that could have removed
        it: read this, not the connection's `404`, to learn the outcome. An end
        user's widget token must be bound as for `DELETE /connections/{id}`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The removal plan, or the outcome of a finished removal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalPlan' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/certificate:
    get:
      operationId: getDomainCertificate
      summary: The domain's certificate, its renewal and its history
      tags: [Connections]
      description: >-
        The HTTPS certificate the edge holds for the domain, as the edge last
        reported it: status, issuer, when it was issued and last renewed, when
        it expires and the next renewal starts, the last error while renewing
        keeps failing, and the certificate history (issued, renewed, failed,
        expiring). An apex that redirects www also gets `www_certificate`.
        Every served domain has one, so this read is not behind the Secure
        plan feature (the `/ssl` management routes are). `status` is
        `not_reported` until the edge reports the certificate.


        A delegated agent token needs `domains:read`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The certificate
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, certificate, renewal, history]
                properties:
                  connection_id: { type: string }
                  certificate: { $ref: '#/components/schemas/CertificateView' }
                  www_certificate: { $ref: '#/components/schemas/CertificateView' }
                  renewal:
                    type: object
                    properties:
                      automatic: { type: boolean }
                      needs_dns_access:
                        type: boolean
                        description: Always false; the edge renews through the domain itself (TLS-ALPN-01 or HTTP-01).
                      retry_every: { type: string }
                      how: { type: string }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/DomainEvent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/services:
    get:
      operationId: getConnectionServices
      summary: The CustomDomain™ services the domain uses
      tags: [Connections]
      description: >-
        Every CustomDomain™ service with whether this domain uses it, computed
        from stored facts: DNS connect (with the rail that wrote the records
        and the access CustomDomain™ holds), managed DNS, edge serving, the
        HTTPS certificate, Power, monitoring, automatic repair, redirects,
        email records and CAA. `state` is `active`, `pending` (set up, not
        serving yet), `attention` (in use, and something needs a person),
        `paused` (automatic repair where CustomDomain™ holds the access but
        the deployment has not switched repair on, `MONITOR_AUTO_REPAIR`) or
        `inactive`.
        An end user's widget token (scope `connect`) reads this only when it
        is bound to the domain and minted with the connection's own
        `end_user_ref`; use an API key otherwise.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionServices' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/events:
    get:
      operationId: listConnectionEvents
      summary: The domain's timeline
      tags: [Connections]
      description: >-
        What happened to the domain, newest first: certificates issued,
        renewed, failing and expiring; drift found and what was done about
        it; access kept and revoked. `kind` narrows it to a prefix
        (`certificate.`, `drift.`, `access.`); `before` pages back with the
        previous page's `next_before`.
        An end user's widget token (scope `connect`) reads this only when it
        is bound to the domain and minted with the connection's own
        `end_user_ref`; use an API key otherwise.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The events
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, domain, events]
                properties:
                  connection_id: { type: string }
                  domain: { type: string }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/DomainEvent' }
                  next_before: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /services:summary:
    get:
      operationId: getServicesSummary
      summary: How many domains use each service, per application and workspace
      tags: [Connections]
      description: >-
        For the API key's workspace (or one application with `app_id`), the
        number of domains using each service, and the number needing
        attention, in total and per application, and which domains need
        attention and why.
      security:
        - apiKey: []
      parameters:
        - name: app_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema:
                type: object
                required: [catalog, workspace, applications, needs_attention, truncated]
                properties:
                  catalog:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                  workspace:
                    type: object
                    properties:
                      domains: { type: integer }
                      services: { type: object, additionalProperties: { type: integer } }
                      attention: { type: object, additionalProperties: { type: integer } }
                  applications:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id: { type: string }
                        name: { type: string }
                        domains: { type: integer }
                        services: { type: object, additionalProperties: { type: integer } }
                        attention: { type: object, additionalProperties: { type: integer } }
                  needs_attention:
                    type: array
                    description: "The domains behind the attention counts, by domain name: one item per service that needs someone, at most 50."
                    items:
                      type: object
                      required: [connection_id, application_id, domain, service, name, detail]
                      properties:
                        connection_id: { type: string }
                        application_id: { type: string }
                        domain: { type: string }
                        service: { type: string, description: "The service id, as in catalog." }
                        name: { type: string }
                        detail: { type: string, description: "What needs doing, for people." }
                  truncated: { type: boolean, description: True when the workspace has more domains than one summary counts (2000). }
        '401': { $ref: '#/components/responses/Error' }
  /connections/{id}/monitor:
    get:
      operationId: getConnectionMonitor
      summary: What the drift monitor last found for the domain, and what was done
      tags: [Monitor]
      description: >-
        Every live domain is checked against its records once an hour. This
        returns the last check (when, the result, the drifted records with
        expected and observed values), what was done about drift (put back
        automatically with the continuous access CustomDomain™ holds, or left
        for the tenant because the record was changed rather than removed,
        because there is no continuous access, or because automatic repair is
        not switched on), whether repairs are automatic for this domain and
        why, the records it is held to, and the drift history.
        An end user's widget token (scope `connect`) reads this only when it
        is bound to the domain and minted with the connection's own
        `end_user_ref`; use an API key otherwise.


        Automatic repair runs only where the deployment switched it on
        (`MONITOR_AUTO_REPAIR`; `repair.paused` is true otherwise). It puts
        back only the record sets that disappeared, from the records
        CustomDomain™ wrote (a kept Domain Connect authorization re-applies
        its template, the only write it allows), and only for drift that
        began after a clean check. A record missing since monitoring started
        is left for the tenant. Repairs are paced and capped per hourly pass
        and per provider account, and after 3 repairs of a domain within 24
        hours the monitor stops and reports `fix_failed`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The monitoring state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections:lookup:
    get:
      operationId: lookupConnection
      summary: Find your connection for a domain
      tags: [Connections]
      description: >-
        Returns the caller's connection for a domain, for an app that stored
        the domain but not the connection id (for example to open the removal
        flow). A connect-scoped widget token must be minted for that domain,
        and finds a connection that names an end user only when minted with
        the same `end_user_ref`; an app-scoped token finds any domain of its
        application, and an API key any domain of its tenant.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}:disconnect:
    post:
      operationId: disconnectConnectionWithChoice
      summary: Remove a domain, optionally authorizing the record removal once with a key
      tags: [Connections]
      description: >-
        The same removal as `DELETE /connections/{id}` with a body. Send
        `credential` (a DNS provider API key) to authorize removing the
        records once when we did not keep the access that added them; it is
        used for this removal and never stored. The zone must show at least one
        of our records with that key, or the outcome lists the manual steps
        (the key may belong to another account). Answers `200` with the
        outcome; an end user's widget token must be bound as for
        `DELETE /connections/{id}`.


        A delegated agent token needs `domains:disconnect` and must send
        `confirm`, as for `DELETE /connections/{id}`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:disconnect']
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: confirm
          in: query
          required: false
          description: >-
            Required of a delegated agent token: the domain it is removing, as
            written on the connection (case, scheme, path and a trailing dot do
            not matter). Without it the answer is `400 confirmation_required`;
            with another domain, `409 confirmation_mismatch`. Nothing is removed
            either way. Other credentials ignore it.
          schema: { type: string, examples: [shop.acme.com] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                records: { type: string, enum: [remove, keep] }
                provider: { type: string, description: DNS provider id; defaults to the connection's provider. }
                zone: { type: string, description: The DNS zone; found from the key when omitted. }
                credential:
                  type: object
                  properties:
                    token: { type: string, description: 'The provider API key, used once.' }
      responses:
        '200':
          description: Removed; what happened to the records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisconnectResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: "`reauthorization_required`, `removal_in_progress` or `confirmation_mismatch`, as for `DELETE /connections/{id}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [reauthorization_required, removal_in_progress, confirmation_mismatch] }
                  plan: { $ref: '#/components/schemas/RemovalPlan' }
  /connections/{id}/diagnose:
    get:
      operationId: diagnoseConnection
      summary: What public DNS shows for each record, and what is left to do
      tags: [Connections]
      description: >-
        Read-only, record-by-record check of a connection against live public
        DNS. For each record in the desired set it reports `found`, `missing`,
        `mismatch` (something else answers for the name; `observed` shows what,
        `observed_label` names a well-known service behind it) or
        `unverifiable`, plus the `name` to type in a DNS panel (`@` for the
        root) and `at_provider` when the domain's own nameservers already serve
        the value and only public caches lag. `issues` lists problems that block
        the connection even when a record looks right: `doubled_host` (the full
        hostname typed into the Name field), `cloudflare_proxied`,
        `aaaa_conflict`, `extra_a_records`, `conflicting_record` and
        `caa_blocks`. It never changes the connection; when `all_found` is true,
        call `:recheck` to verify and go live. Cached for about 5 seconds.


        A delegated agent token needs `domains:read`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDiagnosis' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/records:
    get:
      operationId: getConnectionRecords
      summary: Authoritative desired DNS record set for a connection
      tags: [Connections]
      description: >-
        The single source of truth the widget renders, the OAuth callback
        writes, and the propagation poller verifies. Before records are applied,
        the default edge record is synthesized server-side.


        A delegated agent token needs `domains:read` or `domains:connect`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
        - agentToken: ['domains:connect']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, records]
                properties:
                  connection_id: { type: string }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/DnsRecord' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: setConnectionRecords
      summary: Supply the connection's desired DNS record set
      tags: [Connections]
      description: >-
        Replaces the connection's desired record set with one the INTEGRATOR
        authored, for records that cannot be derived from the domain; the
        motivating case is Amazon SES email verification, whose three Easy-DKIM
        CNAMEs are minted per domain by SES. The supplied set then behaves
        exactly like ours: the OAuth rail writes it with the customer's provider
        credential, the widget renders it for manual setup, and the propagation
        poller verifies it before the connection goes live.


        Server-to-server only (API key): a widget JWT lives in a browser
        and may not choose the records we write into a customer's zone. Hosts are
        relative to the connection (`@`, `_dmarc`, `sel._domainkey`) and must
        resolve inside its zone. The Domain Connect rail refuses a connection
        carrying a supplied set, because that rail applies OUR published
        templates at the provider, so it cannot write records it did not author.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items: { $ref: '#/components/schemas/DnsRecord' }
      responses:
        '200':
          description: The connection's new desired record set
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, records_source, records]
                properties:
                  connection_id: { type: string }
                  records_source: { type: string, enum: [integrator] }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/DnsRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /connections/{id}/managed-dns:
    post:
      operationId: startManagedDNS
      summary: Start managed DNS for a connection's domain
      tags: [Managed DNS]
      description: >-
        Offers the connection's end user a one-time change instead of typing
        records: point the domain's nameservers at CustomDomain™, and we host
        the zone and write every record from then on.


        The first call creates a hosted zone for the connection's REGISTRABLE
        domain (acme.com, also for shop.acme.com), copies the records the
        domain already serves at common names (apex A/AAAA/MX/TXT/CAA, www,
        mail hosts, DMARC, common DKIM selectors, common SRV names, and every
        name the connection needs) so nothing breaks at the switch, adds the
        records CustomDomain™ needs for the connection, looks up the registrar,
        and answers 201 with the zone. Later calls answer 200 with the same
        zone; nothing is created twice. A second connection under the same
        registrable domain joins the existing zone. The zone becomes `active`
        once every nameserver the registry lists for the domain is ours; the
        connection then verifies and goes live on its own.


        Available only when `managed_dns.available` is true on
        `POST /v1/domains:check` (the deployment flag is on, and the domain's
        nameservers can be changed at a registrar). Authorized like the other
        connection routes: an API key within the tenant, or a widget token of
        the connection's own application (and domain, when the token is bound
        to one).
      security:
        - apiKey: []
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        description: No parameters. Send no body, or `{}`.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Managed DNS was already started; the zone as it stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDNSView' }
        '201':
          description: The zone was created and filled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDNSView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The domain's zone is already hosted for another account, or another change to it is in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            `managed_dns_unavailable` (this domain can't be hosted; `details`
            says why) or `managed_dns_limit` (the account's zone limit).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: >-
            `managed_dns_backend_error`: the DNS hosting service didn't respond.
            Nothing is lost; call again to finish.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: getManagedDNS
      summary: The connection's managed DNS zone
      tags: [Managed DNS]
      description: >-
        The hosted zone's status, the nameservers to set at the registrar,
        what the registry currently lists, the registrar, every record, and
        notes to show the user. Poll it while `status` is
        `awaiting_delegation`. 404 when managed DNS was never started for this
        connection.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The zone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDNSView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/managed-dns/records:
    post:
      operationId: addManagedDNSRecords
      summary: Import a zone file or add records to the managed zone
      tags: [Managed DNS]
      description: >-
        Send exactly one of `zone_file` (a BIND zone file, at most 256 KB) or
        `records` (at most 500). Records from a zone file are `imported`: for
        every name and type the file defines, they replace what discovery
        found. Listed records are `manual` and are added alongside what is
        there. Records CustomDomain™ needs for the connection always win: an
        imported record that collides with one is skipped with a note, and a
        listed one is refused with 409. Zone file lines that can't be hosted
        (SOA, the zone's own NS set, unsupported types, names outside the
        zone) are skipped, each with a warning naming its line. A zone holds
        at most 500 records.


        Once the zone is `active`, only an API key or an app-scoped widget
        token may change it; an end user's connect-scoped token may change the
        zone only during setup.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedDNSRecordsRequest' }
      responses:
        '200':
          description: The zone after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDNSView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422':
          description: >-
            `invalid_zone_file` (nothing in the file can be hosted) or
            `too_many_records` (the zone would pass 500 records).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/managed-dns/records/{record_id}:
    delete:
      operationId: deleteManagedDNSRecord
      summary: Remove one record from the managed zone
      tags: [Managed DNS]
      description: >-
        Removes a `discovered`, `imported` or `manual` record. A
        `customdomain` record is how CustomDomain™ serves the domain and is
        refused with 409; disconnecting the domain removes it. Once the zone is
        `active`, only an API key or an app-scoped widget token may remove
        records.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: record_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The zone after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDNSView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/grant:
    delete:
      operationId: disableManagedConnection
      summary: Turn managed mode OFF without disconnecting
      tags: [Connections]
      description: >-
        Drops the stored grant (async one-click, or a kept provider sign-in,
        which is also revoked at the provider where it allows it) and clears the
        connection's `managed` flag, leaving the connection and its applied
        records in place. The records the provider already wrote stay live; the
        control plane simply stops holding a credential to re-apply / revert
        them. This is **not**
        `DELETE /v1/connections/{id}` (which reverts the template at the provider
        and removes the whole connection). Idempotent: a connection that is already
        unmanaged returns `200`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Managed mode disabled (grant dropped, managed=false, connection kept)
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, managed]
                properties:
                  connection_id: { type: string }
                  managed: { type: boolean, enum: [false] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/apply:
    post:
      operationId: applyConnection
      summary: Write a connection's records through the customer's provider (BYO token, used once)
      tags: [Connections]
      description: >-
        **Rail B (API-token apply).** The scoped provider credential is used once
        to write the records and is never stored. The connection advances to
        `propagating`; the poller promotes it to `live` once the records appear
        in public DNS.


        A widget JWT applies to its own application's connections (a
        domain-bound token to its own domain only). An API key applies to a
        connection of any application in its tenant; a member's key needs a role
        that operates apps (not viewer).
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, records]
              properties:
                provider: { type: string, description: DNS provider id; defaults to the detected provider. }
                zone: { type: string, description: DNS zone the credential manages; defaults to the connection domain. }
                credential:
                  type: object
                  required: [token]
                  properties:
                    token: { type: string, description: "Scoped provider API token; used once, never persisted." }
                records:
                  type: array
                  items: { $ref: '#/components/schemas/WritableRecord' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/DnsRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}:reapply:
    post:
      operationId: reapplyConnection
      summary: Re-apply a managed connection's desired records (async one-click, no re-consent)
      tags: [Connections]
      description: >-
        **Managed mode only.** Recomputes the connection's authoritative desired
        record set and writes any drift through the provider's async one-click
        API using the stored, encrypted grant (the provider API base pinned at
        onboarding), or, for a connection managed through a provider sign-in,
        through the provider's DNS API with the kept credential (a refresh token
        is rotated first when the access token has expired); the end user does
        **not** re-consent. On success the connection is re-verified and
        `connection.records.updated` is emitted. A failure emits
        `connection.reapply.failed`; if the provider reports the grant was
        revoked (401 kill-switch, or a refused refresh token) the grant is
        cleared and the connection is flagged for re-consent (a sign-in grant
        leaves `error_code` `oauth_reconnect_needed`).


        A domain kept by a continuous provider account (and no kept grant) is
        re-applied with the account's key: the records
        CustomDomain™ wrote for the domain are written back and the receipt
        says `via: provider_account`. A domain whose records CustomDomain™
        did not write is refused with `409`, since re-applying would write
        records nobody put there. The same webhooks are sent.


        A delegated agent token needs `domains:connect`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:connect']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: >-
            Re-applied (records updated). NOTE: this is a re-apply RECEIPT, not a
            connection object; it carries `connection_id` rather than the
            connection's own `id`, and none of the other connection fields. Fetch
            `GET /connections/{id}` if you need the connection itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReapplyResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "The connection is not managed, has no stored grant, or the grant was revoked (re-consent required); or a provider account keeps it and CustomDomain™ did not write its records, or the account holds no usable key" }
        '422': { description: "The provider refused the provider account's key (`ProviderAuthenticationError`) or the write (`dns_write_failed`)" }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}:recheck:
    post:
      operationId: recheckConnection
      summary: Check a connection's DNS now, and report what public DNS answered
      tags: [Connections]
      description: >-
        Resolves every record the connection is verified against **in-request**,
        against live public DNS, and returns a per-record verdict. This is the
        verb behind a "check now" button, as opposed to `GET /connections/{id}`,
        which only reports what the background propagation poller last saw.


        It also advances the connection: a `pending` or `propagating` connection
        whose records are all visible is promoted to `live` here rather than on
        the poller's next pass, and a **`failed`** connection is re-entered into
        verification (`failed` → `pending`) with its lifecycle timeout clock
        re-based off the retry. Without that re-basing the retry would re-fail
        immediately, since the connection is `failed` precisely because it aged
        past that window. A `live` connection is reported on but never
        transitioned: `records_resolved: false` on a live connection is a drift
        signal.


        Idempotent and safe to call repeatedly.


        A delegated agent token needs `domains:connect`, because a recheck can
        move a connection forward.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:connect']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The connection after the check, plus what the check found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecheckResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "A failed connection cannot be retried because the same application already has another active connection for this domain; retry that one instead" }
  /connections/{id}/oauth:start:
    post:
      operationId: startConnectionOAuth
      summary: Begin the sign-in to the DNS provider for a connection
      tags: [Connections]
      description: >-
        **Rail C (flagship).** Returns the URL the widget opens in a popup, bound
        to an HMAC-signed single-use `state`. The provider redirects back to
        `/v1/connect/oauth/callback`, which writes the connection's records with
        what the provider handed over. `flow` says which sign-in runs:
        `oauth2` (authorization code with PKCE S256; for Google Cloud DNS,
        Sign in with Google Cloud, whose callback first finds the Google Cloud
        project that holds the domain's public zone; for Azure DNS, a Microsoft
        sign-in whose callback first finds the Azure subscription and resource
        group that hold it), `vercel_integration` (the
        CustomDomain™ integration's install page; the user picks the Vercel team
        that owns the domain), `porkbun_handoff` (Porkbun's PKCE API key
        handoff: the user approves a key named after the domain; no client
        registration is needed), `ovh_consent` (an OVHcloud consumer key
        limited to the domain's DNS zone, validated on OVHcloud's page for the
        chosen `region`) or `mcp_oauth` (OAuth through the provider's hosted
        MCP server, for Hostinger, Unstoppable Domains, XServer, Namecheap,
        Spaceship and Dynadot: the endpoints are discovered from the server's metadata,
        the client is one the control plane registered for itself, and the
        records are written through the server's DNS tools; offered only for
        the providers the deployment lists in `MCP_SIGNIN_PROVIDERS`). The credential is used for that write and dropped,
        unless the deployment keeps grants for this provider
        (`OAUTH_MANAGED_PROVIDERS` with `GRANT_ENCRYPTION_KEY`), in which case
        `managed` is true and it is stored encrypted for `:reapply`.


        A widget JWT starts the sign-in for its own application's connections
        (a domain-bound token for its own domain only); an API key for a
        connection of any application in its tenant, and a member's key needs a
        role that operates apps.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_origin]
              properties:
                provider: { type: string, description: DNS provider id; defaults to the detected provider. }
                return_origin:
                  type: string
                  description: Web origin the callback page may postMessage the outcome to; must be on the server's allowlist.
                region:
                  type: string
                  enum: [eu, ca, us]
                  description: >-
                    OVHcloud only: the API region the user's OVHcloud account
                    lives in (default `eu`). The domain check's `rails.oauth.regions`
                    lists the regions this deployment offers.
                purpose:
                  type: string
                  enum: [connect, remove]
                  default: connect
                  description: >-
                    `remove` signs in once more to remove the records we added
                    (and put back what they replaced) for a connection whose
                    access we did not keep, then disconnects the domain, as
                    `GET /connections/{id}/removal` offers when its
                    `record_removal` is `reauthorize`. The sign-in is used for
                    the removal and withdrawn; it is never kept. The callback's
                    message carries `purpose: "remove"` and the `records`
                    outcome, and `GET /connections/{id}/removal` answers it once
                    the domain is gone. An end user's widget token must be bound
                    as for `DELETE /connections/{id}`.
                access:
                  type: string
                  enum: [continuous, one_time]
                  description: >-
                    The person's choice for a connect. `continuous` keeps the
                    sign-in, encrypted, so we can put back records that
                    disappear and remove them when the domain is removed;
                    offered only where the deployment can keep this provider's
                    sign-in (`rails.oauth.managed` on the domain check).
                    `one_time` uses it for this write and drops it. Omitted,
                    the deployment's default applies (kept where it can be).
      responses:
        '200':
          description: The URL to open, and what it runs
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, provider, flow]
                properties:
                  authorize_url: { type: string, format: uri }
                  provider: { type: string }
                  flow:
                    type: string
                    enum: [oauth2, vercel_integration, porkbun_handoff, ovh_consent, mcp_oauth]
                  managed:
                    type: boolean
                    description: The connect will keep its credential (managed mode).
                  access:
                    type: string
                    enum: [continuous, one_time]
                    description: What will happen to the credential after the sign-in.
                  purpose:
                    type: string
                    enum: [remove]
                    description: Present for a removal sign-in.
                  callback_origin:
                    type: string
                    description: >-
                      Origin the result will be postMessaged from; check
                      `MessageEvent.origin` against it.
                  region:
                    type: string
                    description: OVHcloud only, the region the consent was requested in.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429':
          description: >-
            `provider_rate_limited`: the provider refused to start another
            sign-in from our servers for now (Porkbun allows 20 key requests
            an hour per IP address); `details` says when to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: "`provider_unavailable`: the provider did not start the sign-in (Porkbun key request, OVHcloud consumer key request)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/browser:start:
    post:
      operationId: startConnectionBrowser
      summary: Begin the cloud browser sign in for a connection
      tags: [Cloud browser]
      description: >-
        **Customer present only.** For a DNS provider with no sign in of its
        own, the customer signs in to the provider inside a temporary browser
        that a browser hosting company runs for a few minutes. They type their
        own username, password and any verification code into the provider's
        real sign in page, so CustomDomain™ never receives them, and nothing is
        stored. Our software then reads the provider's DNS page for this one
        domain, shows the customer the exact changes, and makes them only after
        the customer approves. It never creates an API key at the provider, and
        a session never runs without the customer present.


        Returns the address of the popup page that shows the browser. Its
        fragment carries a single use bootstrap code, which no server sees; the
        popup trades it at `POST /browser-sessions:redeem`. Only an end user's
        widget token (bound to the domain and to the end user) or the console
        may start one: an agent, the MCP server and a plain API key are refused
        with `browser_customer_present_only`. The request must carry an `Origin`
        header on the server's return origin allowlist. A browser sends one (the
        widget and the popup do), and the console's server must add it to the
        call it makes for a customer. A request with no `Origin` at all, such as
        a server to server call, is refused with `browser_customer_present_only`
        and a message that says the header is missing; an `Origin` that is not
        on the list is refused the same way.


        A record set an integrator supplied, and any type or value the
        provider's page cannot write, is refused before the customer signs in
        (`browser_unsupported_records`, with the types named). The rail is
        offered only for a provider that has no sign in of its own, and only
        while the deployment has it on (`rails.cloud_browser` on the domain
        check).
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, return_origin, consent_version]
              properties:
                provider: { type: string, description: "DNS provider id; defaults to the detected provider." }
                return_origin:
                  type: string
                  description: Web origin the popup posts its result to; must be on the server's allowlist.
                consent_version:
                  type: string
                  description: The id of the consent text the customer was shown, stored with the session.
                locale:
                  type: string
                  description: The language the popup reads in, a plain code such as `en`. Defaults to `en`.
      responses:
        '200':
          description: The session was created.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, open_url, vendor, expires_at]
                properties:
                  session_id: { type: string, description: 'The session id, `bs_` and 32 hex characters.' }
                  open_url:
                    type: string
                    format: uri
                    description: The popup page, with `#c=<bootstrap code>&l=<locale>` in its fragment.
                  vendor: { type: string, description: "The browser hosting company, shown to the customer." }
                  expires_at: { type: string, format: date-time, description: "The latest the session can end." }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: >-
            `browser_customer_present_only` (an agent, the MCP server, a plain API
            key, a request with no `Origin` header, or an `Origin` that is not on
            the return origin allowlist) or
            `browser_provider_not_allowed` (the rail is not offered for this
            provider or workspace, or the provider has a sign in of its own).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            `browser_session_active`: a secure sign in is already running for
            this domain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            `browser_unsupported_records`: the record set cannot be written
            through the provider's page. `types` names what is in the way.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      types: { type: array, items: { type: string } }
        '429':
          description: >-
            `browser_rate_limited`: too many starts for this domain or
            workspace. `Retry-After` says when the window turns.
          headers:
            Retry-After: { schema: { type: integer }, description: "Seconds until a new start is allowed." }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: >-
            `browser_unavailable` (not configured, switched off or paused),
            `browser_busy` (the browser vendor answered that it is busy right
            now; try again after `Retry-After`) or `browser_capacity` (the
            vendor is not answering, or a limit of sessions or monthly minutes
            is reached). Offer the manual steps.
          headers:
            Retry-After: { schema: { type: integer }, description: "Seconds to wait; present for `browser_busy` and for a vendor that is not answering." }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /browser-sessions:redeem:
    post:
      operationId: redeemBrowserSession
      summary: Trade the bootstrap code for the session token
      tags: [Cloud browser]
      description: >-
        The popup page calls this once, with the code from its address fragment.
        The code lives two minutes and works once; a second redemption answers
        `410 browser_link_used`. The `Origin` header must be on the server's
        return origin allowlist (a browser sends it; a request with none is
        refused with `browser_customer_present_only`). The token it returns
        lives in the popup's memory only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: The session token and the first view.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, token, view]
                properties:
                  session_id: { type: string }
                  token: { type: string, description: "The session token. A bearer: never log it or store it." }
                  view: { $ref: '#/components/schemas/BrowserSessionView' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '410':
          description: '`browser_link_used` (already redeemed) or `browser_expired` (the code ran out, or the session ended).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /browser-sessions/{sid}:
    get:
      operationId: getBrowserSession
      summary: Read a cloud browser session
      tags: [Cloud browser]
      description: >-
        The session view. Every call is the popup's heartbeat: a session that is
        not polled for 90 seconds before approval is ended and its browser
        released. The response is `Cache-Control: no-store`, because the view
        can carry the live view address, which anyone holding can drive.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserSessionId'
      responses:
        '200':
          description: The session as the popup may see it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSessionView' }
        '401':
          description: '`browser_expired`: the token is wrong, expired, or for another session.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /browser-sessions/{sid}:signed-in:
    post:
      operationId: signedInBrowserSession
      summary: The customer says they are signed in
      tags: [Cloud browser]
      description: >-
        Allowed only in `awaiting_sign_in`. The control plane attaches to the
        browser, opens the provider's DNS page, reads it (read only) and builds
        the plan. If the browser is still on the sign in page the state returns
        to `awaiting_sign_in` with the notice `not_signed_in`. Poll the view for
        the outcome.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserSessionId'
      responses:
        '202':
          description: Checking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [checking] }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: '`browser_wrong_state`: the session is not awaiting sign in.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`browser_expired`: the sign in window ran out.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /browser-sessions/{sid}:approve:
    post:
      operationId: approveBrowserSession
      summary: Approve the exact plan
      tags: [Cloud browser]
      description: >-
        Works once, only in `plan_ready`, only within the approval window (180
        seconds), and only with the exact current plan hash. A wrong hash
        writes nothing. If the records changed after the plan was made, the
        session returns to `checking` with a fresh plan and a new hash.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_hash]
              properties:
                plan_hash: { type: string, description: 'All 64 hex characters of the plan hash on screen.' }
      responses:
        '202':
          description: Applying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [applying] }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            `browser_plan_mismatch` (not the current plan) or
            `browser_wrong_state` (not in `plan_ready`, or already approved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`browser_expired`: the approval window ran out.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /browser-sessions/{sid}:cancel:
    post:
      operationId: cancelBrowserSession
      summary: End the session and release the browser
      tags: [Cloud browser]
      description: >-
        Idempotent: a session that is already over answers its own state. During
        `applying` it stops at the next change boundary, never inside a change.
        A `navigator.sendBeacon` cannot set headers, so this route (and only
        this one) also accepts the token in the body, as `{"token": "..."}`
        with a content type of `text/plain` or JSON.
      security:
        - browserSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/BrowserSessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: "The session token, when it cannot be sent as a header." }
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: The state the session is in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /browser-sessions/{sid}:finish-manual:
    post:
      operationId: finishManualBrowserSession
      summary: The customer finished by hand
      tags: [Cloud browser]
      description: >-
        Allowed only in `manual_assist`, where the script stopped and the
        customer adds the records themselves. The session ends and its browser
        is released; the connection stays `pending` and the propagation poller
        finishes it when the records appear.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserSessionId'
      responses:
        '200':
          description: Done by hand.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [done_manual] }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: '`browser_wrong_state`: the session is not in manual assist.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`browser_expired`: the session ran out of time.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connect/oauth/callback:
    get:
      operationId: oauthCallback
      summary: OAuth redirect target (public; authenticated by the signed state)
      tags: [Connections]
      description: >-
        The provider's browser redirect target, **not** a bearer-authenticated
        endpoint, and the Redirect URL of the CustomDomain™ Vercel integration.
        It consumes the signed single-use `state`, turns what the provider sent
        into a credential (exchanges the `code`; for Porkbun retrieves the
        approved key pair with the PKCE verifier; for OVHcloud uses the
        validated consumer key), writes the connection's records with it
        (dropped after, unless kept for managed mode), and returns an HTML page
        that postMessages `{ type: "customdomain:oauth", payload }` to the
        vetted return origin. `payload` carries `ok`, `managed`, and on failure
        a `code` and `message`: besides the provider's own `error` (for example
        `access_denied`) and `ProviderAuthenticationError`, `apply_failed`,
        `apex_not_supported`, `forwarding_not_supported`, the rail specific
        codes are `porkbun_api_access_disabled` (turn on API access for the
        domain at Porkbun), `vercel_team_scope` (install on the team that owns
        the domain), `ovh_zone_not_found` (pick the OVHcloud region the
        account lives in), `oauth_scope_not_granted` (a permission was left
        unticked on the provider's consent screen; sign in again and allow
        them all), for Google Cloud DNS `gcpdns_zone_not_found` (no public
        Cloud DNS zone for the domain in a Google Cloud project the account
        can edit), `gcpdns_zone_ambiguous` (more than one) and
        `gcpdns_search_incomplete` (the account can see more projects than
        the search reaches, so the one zone found is not written to), and for
        Azure DNS `azuredns_zone_not_found` (no public Azure DNS zone for the
        domain in a subscription the Microsoft account can list zones in),
        `azuredns_zone_ambiguous` (more than one), `azuredns_search_incomplete`
        (the account can see more subscriptions or zones than the search
        reaches, so the one zone found is not written to) and
        `azuredns_mfa_required` (Azure requires multifactor authentication for
        the change and the sign-in did not use it). With the not found and
        ambiguous codes, `payload.account` names the Google or Microsoft
        account that signed in, when the provider said which; the connection's
        stored `error_message` never does. After
        an `mcp_oauth` sign-in, `apply_failed` also
        reports a write refused before anything changed because a record the
        provider's DNS tools may not remove is in the way (a Namecheap URL
        redirect, a record a provider's product manages; the `message` names
        it and where to remove it), and `ProviderAuthenticationError` a DNS
        tool the user did not approve at the provider (sign in again and
        approve DNS access). A failure is also stored as the connection's
        `error_code`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: teamId, in: query, schema: { type: string }, description: "Vercel install flow: the team the integration was installed on." }
        - { name: configurationId, in: query, schema: { type: string }, description: "Vercel install flow: the installation id." }
        - { name: status, in: query, schema: { type: string, enum: [approved, denied] }, description: "Porkbun key handoff: the account holder's decision." }
        - { name: requestToken, in: query, schema: { type: string }, description: "Porkbun key handoff: echoed by Porkbun; must match the request the server started." }
      responses:
        '200':
          description: HTML finish page (postMessages the outcome to the vetted return origin)
        '400':
          description: Invalid, expired, or replayed state
  /connect/dc/callback:
    get:
      operationId: dcCallback
      summary: Async one-click setup redirect target (public; authenticated by the signed state)
      tags: [Connections]
      description: >-
        **Rail A (async one-click setup) redirect target**, distinct from
        `/connect/oauth/callback` (Mode C), which discards its one-time token. It
        consumes the signed single-use `state` (rail-bound to async), exchanges the
        code for a **durable async grant** at the provider API base pinned into the
        `state` at start (never re-derived from fresh discovery), applies the
        template, and persists the **encrypted** grant so the connection can be
        re-applied / reverted server-side. Records are applied with
        `data.via = async`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: HTML finish page (postMessages the outcome to the vetted return origin)
        '400':
          description: Invalid, expired, replayed, or wrong-rail state
  /connect/dc/return/{state}:
    get:
      operationId: dcSyncReturn
      summary: One-click sync return (public; authenticated by the signed state)
      tags: [Connections]
      description: >-
        Where the DNS provider sends the browser after the user approves or
        cancels a one-click sync apply. It is the `redirect_uri` the signed
        `apply_url` carries, **not** a bearer-authenticated endpoint. The signed
        single-use `state` rides in the path because some providers (Cloudflare)
        drop the separate `state` parameter. It records a provider-reported
        `error` on the connection, runs the propagation check at once, and
        returns the same HTML finish page as the OAuth callback, which
        postMessages `{ type: "customdomain:oauth", payload }` to the origin
        vetted at start. A clean return never marks the connection live by
        itself: only the records appearing in public DNS do.
      security: []
      parameters:
        - { name: state, in: path, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: OAuth 2.0 error code the provider reports (access_denied when the user cancels). }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '200':
          description: HTML finish page (postMessages the outcome to the vetted return origin)
        '400':
          description: Invalid, expired, replayed, or wrong-rail state
        '503':
          description: The return is not configured on this server
  /connect/dc/return:
    get:
      operationId: dcSyncReturnQuery
      summary: One-click sync return with the state as a query parameter
      tags: [Connections]
      description: >-
        The same return as `/connect/dc/return/{state}`, for a provider that
        hands the signed state back as `?state=`.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '200':
          description: HTML finish page (postMessages the outcome to the vetted return origin)
        '400':
          description: Invalid, expired, replayed, or wrong-rail state
        '503':
          description: The return is not configured on this server
  /connections/{id}/domainconnect:start:
    post:
      operationId: startDomainConnect
      summary: Build the one-click apply URL (sync) or start the managed async rail
      tags: [Connections]
      description: >-
        **Rail A (one-click sync-redirect) by default.** `service_id` may be
        omitted when a default/sole template is loaded; the response carries the
        provider-hosted `apply_url`, the resolved `service_id`, and the discovered
        `dc_provider` name. Set `managed: true` (or `rail: "async"`) to request the
        managed async rail instead. When the provider supports it the response
        carries a `consent_url` and `rail: "async"` (and the grant lets the control
        plane re-apply / revert server-side without re-consent). `service_ids`
        (plural) bundles several templates under one managed consent (async only;
        the OAuth scope is the space-separated list and the callback applies each);
        on the sync fallthrough only the first template applies.


        Either rail is offered only when the DNS provider holds the exact
        template: the control plane runs the Domain Connect template check
        against the provider's API first (remembered for a few minutes), and a
        provider that has not onboarded it is refused with a `503` that names it.
        A root domain uses `apex-a` (an `A` record to the edge address, which needs
        `APEX_A_TARGETS`). The sync `apply_url`
        carries a signed `redirect_uri` back to `/connect/dc/return/{state}`
        whenever the template allows it; pass `return_origin` on a sync start to
        have that return page post the outcome to your page.


        A widget JWT starts either rail for its own application's connections
        (a domain-bound token for its own domain only); an API key for a
        connection of any application in its tenant, and a member's key needs a
        role that operates apps.


        A delegated agent token needs `domains:connect` and starts the setup of
        its own application's connections.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:connect']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id: { type: string }
                service_ids:
                  type: array
                  items: { type: string }
                  description: >-
                    Bundle of templates to authorize under one managed consent
                    (async rail only). Wins over `service_id` when set.
                host: { type: string }
                vars:
                  type: object
                  additionalProperties: { type: string }
                managed:
                  type: boolean
                  description: Opt into the managed (async) one-click rail.
                rail:
                  type: string
                  description: Set to "async" to request the managed rail (same effect as managed:true).
                return_origin:
                  type: string
                  description: >-
                    Vetted web origin the finish page may postMessage the
                    outcome to; must be on the server allowlist. Used by the
                    async callback, and by the sync return page on a plain sync
                    start.
      responses:
        '200':
          description: >-
            Sync rail returns `apply_url`; the managed async rail returns
            `consent_url` and `rail: "async"`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apply_url: { type: string, format: uri, description: "Sync rail: provider-hosted apply URL." }
                  consent_url: { type: string, format: uri, description: "Async rail: provider consent URL." }
                  service_id: { type: string }
                  service_ids:
                    type: array
                    items: { type: string }
                    description: "Async rail: the resolved template bundle."
                  dc_provider: { type: string }
                  rail: { type: string, description: '"async" on the managed rail; omitted on the sync rail.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422':
          description: >-
            The target is a root (apex) domain that the selected template cannot
            serve. Branch on `code`: `apex_template_required` means the named
            template is `hostRequired` (or no apex-capable template is loaded):
            retry without `service_id`, or pass a `host` to set up a subdomain
            instead. `InvalidNameservers` means the domain has no usable NS
            delegation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /connections/{id}/route53-role:start:
    post:
      operationId: startRoute53Role
      summary: Start connecting a Route 53 domain through a limited IAM role instead of an access key
      tags: [Connections]
      description: >-
        **Route 53 access role.** For a domain whose DNS is in Amazon Route 53,
        the customer creates a limited IAM role in their own AWS account from the
        CustomDomain™ CloudFormation template instead of pasting an AWS access
        key. This call generates the connection's external ID (once: later calls
        return the same one), stores the hosted zone id when you pass one, and
        returns a CloudFormation quick-create link plus plain instructions. The
        role the link creates can be assumed by CustomDomain™ only with that
        external ID, can read only the chosen hosted zone, and can change only
        the records for the connected name. Idempotent. Answers `503` when this
        deployment has not set the rail up. Takes a widget JWT for the
        connection's own application or an API key for a connection of any
        application in its tenant (a member's key needs a role that operates
        apps), like `route53-role:complete`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hosted_zone_id:
                  type: string
                  description: >-
                    The Route 53 hosted zone that holds the domain, such as
                    `Z23YXV4OVPL04A` (a `/hostedzone/` prefix is accepted).
                    Optional: without it the AWS console lists the account's
                    zones to choose from.
      responses:
        '200':
          description: The quick-create link and the steps to show the customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route53RoleStart' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/route53-role:complete:
    post:
      operationId: completeRoute53Role
      summary: Verify the customer's Route 53 access role and write the connection's records with it
      tags: [Connections]
      description: >-
        **Route 53 access role, second step.** Send the `RoleArn` output of the
        stack the customer created from the `route53-role:start` link.
        CustomDomain™ assumes the role with the connection's external ID and
        checks that AWS refuses the role both without an external ID and with a
        wrong one: a role that lets CustomDomain™ in without the right external
        ID is refused and never stored. It then finds the hosted zone and writes
        the connection's records through Route 53 with the role's temporary
        credentials, and the connection moves to `propagating` exactly as after
        an API key apply. The verified role is stored, so calling this again
        with an empty body re-applies the records with it. Branch on `code`:
        `route53_role_not_started` (409), `route53_role_arn_invalid` (400),
        `route53_external_id_mismatch` (the role was made from another link),
        `route53_role_not_found` (AWS refused the role),
        `route53_external_id_not_required`, `route53_zone_not_found` (no public
        hosted zone for the domain or a parent of it), `route53_zone_ambiguous`
        (two public hosted zones share the name and the role can read both),
        `route53_access_denied` (the role cannot read that zone, or cannot write
        a record the connection needs) and `route53_record_conflict` (another
        record holds the name with a type the needed record cannot share;
        delete or change it in the Route 53 console), all 422, and
        `route53_unavailable` (503, nothing was changed, try again).
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role_arn:
                  type: string
                  description: >-
                    The stack's `RoleArn` output, such as
                    `arn:aws:iam::123456789012:role/CustomDomainDNSAccess-0123456789abcdef0123456789abcdef`.
                    Optional once a role has been verified for the connection.
      responses:
        '200':
          description: The records were written and the connection is propagating.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route53RoleComplete' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------------- Sharing
  /sharing/connect:
    post:
      operationId: createSharedFlow
      summary: Mint a share link that resumes a connect flow from a server-side prefill
      tags: [Sharing]
      description: >-
        **Forward-to-a-colleague.** The widget posts the domain(s) a teammate
        should connect plus an arbitrary `prefill` (the widget config to resume);
        the control plane stores that server-side under an opaque token and returns
        the absolute `link` (ends `/share/{token}`) and a `job_id`. Every domain the
        link targets must be one the calling token may act on: a share link never
        widens a domain-bound token's reach. The link's server-side prefill is read
        back by `GET /share/{token}`, which the teammate's widget bootstraps from
        instead of a URL that carries the config in the clear. The share token
        EXPIRES 30 days after it is minted.


        **Share by email.** With `recipient_email`, CustomDomain™ also emails the
        link to that address together with the DNS records the domain needs (the
        records of this application's connection for it when one exists,
        otherwise the default set) and your optional `note`. The email names the
        application as the product that asked. A malformed address is a `400`
        `invalid_request`; so is `recipient_email` without a `domain` or
        `domains`. Sending is capped at 3 emails per domain per application and
        50 per application every 24 hours, and 10 per client IP address per hour;
        over any cap the call is a `429` `rate_limited` and no link is minted. When
        the email cannot be sent the link is still returned, with
        `email_error: "not_sent"`, so the widget can offer to copy it instead.


        **From a server.** An API key mints a link for `application_id` (an
        application in the key's tenant, 404 otherwise) or for the key's own
        application, and the teammate's flow then connects the domain into that
        application. A member's key needs a role that operates apps. A widget
        JWT always shares for its own application.
      security:
        - widgetJWT: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: string
                  description: >-
                    With an API key, the application the shared flow connects
                    into (defaults to the key's own). A widget JWT may only omit it
                    or send its own application id (403 otherwise).
                domain: { type: string, description: Single domain the teammate will connect. }
                domains:
                  type: array
                  items: { type: string }
                  description: Several domains the teammate will connect.
                prefill:
                  type: object
                  additionalProperties: true
                  description: >-
                    Arbitrary widget config to resume. Served back verbatim by
                    `GET /share/{token}`, stamped with the normalized domain
                    target(s).
                recipient_email:
                  type: string
                  format: email
                  maxLength: 254
                  description: >-
                    Optional. One plain address (no display name, no list) to email
                    the link and the DNS records to, for example the person who runs
                    the domain's DNS. The instructions cover `domain`, or the first
                    of `domains`.
                note:
                  type: string
                  maxLength: 280
                  description: >-
                    Optional plain-text note quoted in the email (at most 280
                    characters; markup is shown as text, never interpreted). Ignored
                    without `recipient_email`.
      responses:
        '201':
          description: Share link minted (and, with recipient_email, the email attempted)
          content:
            application/json:
              schema:
                type: object
                required: [link, job_id]
                properties:
                  link: { type: string, format: uri, description: "Absolute forwardable URL ending /share/<token>." }
                  job_id: { type: string }
                  emailed_to:
                    type: string
                    format: email
                    description: Present when the email was accepted for delivery; the normalized recipient address.
                  email_error:
                    type: string
                    enum: [not_sent]
                    description: Present when recipient_email was given but the email could not be sent. The link is still valid.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429':
          description: Share-by-email cap reached (`rate_limited`); no link was minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /openapi.json:
    # API-13: the document serves itself, and omitting it from itself meant an
    # integrator had no documented way to fetch the reference at runtime.
    get:
      operationId: getOpenAPISpec
      summary: This OpenAPI document
      tags: [Meta]
      security: []
      description: >-
        Returns this specification as JSON. Public and unauthenticated, cached
        for 5 minutes. It is the same document published at
        `apps/app/openapi-v1.yaml`, converted to JSON at build time and embedded
        in the binary, so the served copy can never drift from the source.
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema: { type: object }

  /applications/{id}/client-secret:rotate:
    post:
      operationId: rotateClientSecret
      summary: Rotate an application's widget client_secret (new secret returned once)
      tags: [Applications]
      description: >-
        Mints a fresh client_secret, stores only its hash, and returns the
        plaintext exactly once; it is never retrievable again. The old secret
        stops minting widget tokens (POST /tokens) immediately; already-issued
        widget JWTs run out their own short TTL. Admin-or-above (keys:manage):
        a member/viewer API key is rejected with 403.
      security:
        - apiKey: []
        - managementKey: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Rotated; the new client_secret is present only in this response
          content:
            application/json:
              schema:
                type: object
                required: [application_id, client_secret]
                properties:
                  application_id: { type: string }
                  client_secret:
                    type: string
                    description: sk_… (mints widget JWTs; shown once, stored hashed)
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/BillingRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /applications/{id}/edge-secret:rotate:
    post:
      operationId: rotateEdgeSecret
      summary: Rotate an application's edge auth secret
      tags: [Applications]
      description: >-
        Mints a new `edge_auth_secret` for the application and invalidates the
        previous one immediately. There is no overlap window, so the edge must
        be reconfigured with the returned value before it can authenticate
        again. Requires `app:write` (member and above); a widget token cannot
        call it. The secret is returned once and is not retrievable afterwards.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Application id.
      responses:
        '200':
          description: The new secret. Store it now; it is never shown again.
          content:
            application/json:
              schema:
                type: object
                required: [application_id, edge_auth_secret]
                properties:
                  application_id: { type: string }
                  edge_auth_secret:
                    type: string
                    description: The new shared secret. Shown exactly once.
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /billing/setup:
    post:
      operationId: startCardSetup
      summary: Start a Stripe Checkout session to save a payment method
      tags: [Billing]
      description: >-
        Opens a Stripe Checkout session in `setup` mode: it saves a card
        WITHOUT charging it. This is the card-on-file flow that agent purchases
        and domain buys draw against later; it is not a plan purchase (see
        `/billing/checkout` for that). Requires `billing:manage` (owners and admins).

        Supply EITHER `return_url` for the embedded flow, OR both `success_url`
        and `cancel_url` for the hosted redirect flow. Supplying neither is a
        400.


        `ui_mode` is optional and picks how the session is shown. Leave it out
        (a `null` or an empty string counts as leaving it out), or send
        `embedded`, for the behavior from before it existed: Stripe Embedded
        Checkout when `return_url` is set, and the hosted redirect when only
        `success_url` and `cancel_url` are. `elements` is Elements with the
        Checkout Sessions API: the caller renders the whole page and mounts only
        Stripe's Payment Element with the returned `client_secret`, so the page
        can wear its own theme. It needs `return_url`, which is where redirect
        based payment methods and the finished setup land, and the session is
        created on a Stripe API version of the dahlia release train (the billing
        guide names the exact version), so mount it with a Stripe.js of that
        train. The response's `ui_mode` says what was really created
        (`embedded`, `elements` or `hosted`): an `elements` request answers
        `embedded` when Stripe could not create an Elements session, so read it
        before mounting anything. `hosted` is only ever an answer, never a
        request value: a client that keeps the response's `ui_mode` must not
        send it back (the redirect flow is chosen by sending `success_url` and
        `cancel_url` without `return_url`). Any other value is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                return_url:
                  type: string
                  description: Where Checkout returns the user (embedded and elements flows).
                success_url:
                  type: string
                  description: Hosted redirect flow; requires cancel_url too.
                cancel_url:
                  type: string
                  description: Hosted redirect flow; requires success_url too.
                ui_mode:
                  type: string
                  enum: [embedded, elements]
                  description: >-
                    How the session is shown. Leave it out (or send null or an
                    empty string) for Stripe Embedded Checkout when `return_url`
                    is set and the hosted redirect when only `success_url` and
                    `cancel_url` are. `elements` requires `return_url`. Never
                    send `hosted`: it is only an answer.
      responses:
        '200':
          description: The Checkout session. Embedded and elements flows read `client_secret`; redirect flows read `url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url:
                    type: string
                    description: Hosted Checkout URL (redirect flow).
                  client_secret:
                    type: string
                    description: Client secret to mount the embedded or elements checkout with.
                  ui_mode:
                    type: string
                    enum: [embedded, elements, hosted]
                    description: How the session was really created. An `elements` request answers `embedded` when Stripe could not create an Elements session.
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /telemetry:connect:
    post:
      operationId: recordConnectTelemetry
      summary: Widget funnel beacon (fire-and-forget)
      tags: [Connect]
      description: >-
        A PII-free beacon recording which step of the in-modal connect flow a
        user reached. It exists because server-side counters only observe
        connections that actually get created, and so are blind to
        pre-connection drop-off.

        `step` and `outcome` are allow-listed server-side and anything
        unrecognised is folded into a fixed label. A beacon that carries a
        `session_id` is also stored against the calling application, which is
        what `GET /analytics/connect` reads; one without it is only counted. No
        domain, IP or user agent is stored. It **always** answers `204`,
        including for an invalid token or a malformed body, so telemetry can
        never block or error the widget; do not branch on its response.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                step: { type: string, description: 'Funnel step label (server-side allow-list).' }
                outcome: { type: string, description: 'Outcome label (server-side allow-list).' }
                session_id: { type: string, description: 'Random id per widget open, 8 to 64 of [A-Za-z0-9_-].' }
                provider: { type: string, description: Detected DNS provider id. }
                rail: { type: string, enum: [oauth, domain_connect, manual, api_key, managed_dns] }
                domain_kind: { type: string, enum: [apex, subdomain] }
                error_code: { type: string, description: 'Widget error code, [A-Za-z0-9_] up to 48.' }
                connection_id: { type: string }
                elapsed_ms: { type: integer, description: Milliseconds since the widget opened (capped at a day). }
      responses:
        '204':
          description: Always. Carries no body and reports no error by design.

  /analytics/connect:
    get:
      operationId: getConnectAnalytics
      summary: Connect funnel and connection outcomes
      tags: [Analytics]
      description: >-
        The widget funnel (sessions, how many entered a domain, were offered a
        one-click or sign-in rail, were shown records to copy, succeeded, where
        the rest stopped, per provider and root versus subdomain) and connection
        outcomes (live rate, time to live, per provider and method, why the rest
        are stuck), plus a daily series. API key; any member role.
      security:
        - apiKey: []
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 180, default: 30 } }
        - { name: app_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectAnalytics' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /traffic:
    get:
      operationId: getTrafficSummary
      summary: Edge traffic for the workspace or one application, with its busiest domains
      tags: [Analytics]
      description: >-
        Requests the CustomDomain™ edge served for the tenant's domains, by
        status class, and the bytes it relayed to visitors, as a series (one
        point per hour for `24h` and `7d`, per UTC day for `30d` and `90d`,
        every bucket present) with totals and the busiest domains. Only
        traffic that passes through the edge is counted: a domain whose
        records point at the integrator's own servers (connected for DNS
        only) never appears. Counts arrive from the edge once a minute.
        Hourly figures are kept 14 days, daily figures 400 days. API key; any
        member role; `app_id` narrows to one application of the key's tenant
        (another tenant's application is a 404).
      security:
        - apiKey: []
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [24h, 7d, 30d, 90d], default: 7d } }
        - { name: app_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, description: How many of the busiest domains to return., schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Traffic summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/traffic:
    get:
      operationId: getConnectionTraffic
      summary: Edge traffic for one domain
      tags: [Analytics]
      description: >-
        What the edge served for one connected domain: requests by status
        class, bytes relayed to visitors, the origin's time to first byte
        (p50, p95, p99 and mean over the requests that reached it) and
        approximate unique visitors, as a series with totals, plus when the
        edge last served a request for it. `serving` says whether the
        domain's visitors reach the edge at all: `live` and `verifying` are
        served by the edge; `not_live` will be once the domain is live;
        `dns_only` means its records point somewhere other than the edge (it
        was connected for DNS only), so its traffic never passes through
        CustomDomain™ and there is nothing to count. Visitors are estimated
        from a sketch of keyed hashes of client addresses; no address is
        stored, and a visitor seen on two UTC days counts once on each. A
        tenant API key reads a domain of any application in its tenant; a
        widget token minted with scope `app` (or a delegated agent token)
        reads its own application's domains; an end user's connect-scoped
        widget token is refused.


        A delegated agent token needs `domains:read`.
      security:
        - apiKey: []
        - widgetJWT: []
        - agentToken: ['domains:read']
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: range, in: query, required: false, schema: { type: string, enum: [24h, 7d, 30d, 90d], default: 7d } }
      responses:
        '200':
          description: Domain traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTraffic' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /share/{token}:
    # API-13: this route is served at the ROOT, not under /v1. The document's
    # global `servers` are /v1-suffixed, and without this override the published
    # URL resolved to /v1/share/{token}, which 404s. The router
    # (`mux.HandleFunc("GET /share/{token}", …)`), the console's proxy
    # (`${CP_BASE}/share/${token}`) and the integration tests all agree on the
    # root path, so the SPEC was the thing that was wrong. Moving the route
    # instead would break every share link already minted by
    # POST /v1/sharing/connect.
    servers:
      - url: https://api.customdomain.ai
        description: Hosted control-plane (share links are not under /v1)
      - url: http://localhost:8080
        description: Local control-plane
    get:
      operationId: getSharedFlow
      summary: Read a share link's server-side prefill (token is the bearer credential)
      tags: [Sharing]
      description: >-
        Public by design: the opaque, unguessable `token` in the path IS the
        credential (mirroring the OAuth callback's state-as-credential pattern), so
        no bearer is required. Returns the stored `prefill` so a teammate's widget
        can resume the flow. A share token EXPIRES 30 days after it is minted;
        unknown OR expired tokens are indistinguishable and both return `404`.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Shared flow prefill
          content:
            application/json:
              schema:
                type: object
                required: [token, application_id, job_id, prefill]
                properties:
                  token: { type: string }
                  application_id: { type: string }
                  job_id: { type: string }
                  prefill:
                    type: object
                    additionalProperties: true
        '404': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Providers
  /providers:
    get:
      operationId: listProviders
      summary: List the DNS providers the Connect engine can detect and automate
      tags: [Providers]
      security: []
      responses:
        '200':
          description: Provider capability catalog
          content:
            application/json:
              schema:
                type: object
                required: [providers, count]
                properties:
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderInfo' }
                  count: { type: integer }
  /providers/census:
    get:
      operationId: providerCensus
      summary: Full parity census (every target provider routed to its working mode)
      tags: [Providers]
      security: []
      responses:
        '200':
          description: Census (each provider routed to dc / oauth / api / manual)
          content:
            application/json:
              schema:
                type: object
                required: [providers, count]
                properties:
                  providers:
                    type: array
                    items: { type: object }
                  count: { type: integer }

  # ---------------------------------------------------------------- Templates
  /templates:
    get:
      operationId: listTemplates
      summary: List one-click setup service templates
      tags: [Templates]
      security: []
      responses:
        '200':
          description: Template list
        '503': { $ref: '#/components/responses/Error' }
  /templates/{serviceId}:
    get:
      operationId: getTemplate
      summary: Get one setup template
      tags: [Templates]
      security: []
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Template
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /templates/{serviceId}/apply-url:
    post:
      operationId: buildTemplateApplyUrl
      summary: Build the one-click apply URL for a domain
      tags: [Templates]
      security: []
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, provider_base]
              properties:
                domain: { type: string }
                host: { type: string }
                provider_base: { type: string }
                vars:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: apply_url
          content:
            application/json:
              schema:
                type: object
                properties:
                  apply_url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Registrar
  /registrar/search:
    get:
      operationId: searchDomains
      summary: Search domain availability and pricing
      tags: [Registrar]
      description: >-
        Availability and retail prices for the typed name. With `suggest=1` it
        also returns the same name on other TLDs and close variants, each result
        carrying a `kind` (`exact`, `tld` or `variant`). A widget token of
        either scope, a tenant API key of any role, or a delegated agent token
        with `domains:read` may search.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - name: suggest
          in: query
          required: false
          description: >-
            Send `1` for the shop style search: the typed name, the same name on
            other TLDs and close variants, each with a `kind`.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Results
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /registrar/quote:
    post:
      operationId: quoteDomain
      summary: Cheapest real-time price for a domain
      tags: [Registrar]
      description: >-
        The registrar's cheapest real time price for a domain, with the retail
        markup applied. A widget token of either scope, a tenant API key of any
        role, or a delegated agent token with `domains:read` may ask.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        '200':
          description: Price
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /registrar/purchase:
    post:
      operationId: purchaseDomain
      summary: Register a domain (fail-closed; requires Idempotency-Key)
      tags: [Registrar]
      description: >-
        Off on the hosted service. This route registers a domain without taking
        a payment, so it needs both `SELL_PURCHASE_ENABLED` and its own switch
        `SELL_DIRECT_PURCHASE_ENABLED`; buy through checkout instead. A required
        `Idempotency-Key` header dedupes retries so a registration is never
        charged twice.


        A delegated agent token needs `domains:purchase`; the grant's monthly
        spend cap is charged first, and a purchase that would pass it answers
        `409`. A tenant API key is refused with `401`. A workspace that billing
        refuses answers `402`.
      security:
        - widgetJWT: []
        - agentToken: ['domains:purchase']
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, buyer]
              properties:
                domain: { type: string }
                buyer:
                  type: object
                  required: [email]
                  properties:
                    name: { type: string }
                    email: { type: string }
                    country: { type: string }
      responses:
        '200':
          description: Order (idempotent replay)
        '201':
          description: Order
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/BillingRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Monitor
  /monitor:check:
    post:
      operationId: checkRecords
      summary: Check declared baseline records against live public DNS
      tags: [Monitor]
      description: >-
        Resolves each baseline record and reports whether it is still present.
        This is what the SDK's `checkRecords` rides on. Read-only; performs no
        writes.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, baseline]
              properties:
                domain: { type: string }
                baseline:
                  type: array
                  items:
                    type: object
                    properties:
                      subdomain: { type: string }
                      type: { type: string }
                      values:
                        type: array
                        items: { type: string }
      responses:
        '200':
          description: Drift report
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /monitor/domains:
    get:
      operationId: listMonitoredDomains
      summary: Every domain of the workspace with its last drift check
      tags: [Monitor]
      description: >-
        The monitoring state of the domains in the API key's workspace (or
        one application with `app_id`), the ones needing attention first, a
        page at a time, with counts over every domain. Pass the previous
        page's `next_cursor` as `cursor` for the next page; there is no
        `next_cursor` on the last one. The per domain detail (watched records,
        repair route, history) is on `GET /connections/{id}/monitor`.
      security:
        - apiKey: []
      parameters:
        - name: app_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
          description: Domains per page; a larger value is read as 1000.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: The previous page's `next_cursor`.
      responses:
        '200':
          description: One page of domains, and a summary of all of them
          content:
            application/json:
              schema:
                type: object
                required: [domains, summary, every, auto_repair]
                properties:
                  every: { type: string }
                  auto_repair:
                    type: boolean
                    description: Whether this deployment puts missing records back automatically (`MONITOR_AUTO_REPAIR`).
                  next_cursor:
                    type: string
                    description: Present when more domains follow; pass it as `cursor`.
                  summary:
                    type: object
                    properties:
                      domains: { type: integer }
                      watched: { type: integer }
                      ok: { type: integer }
                      drift: { type: integer }
                      needs_action: { type: integer }
                      inconclusive: { type: integer }
                      not_checked: { type: integer }
                  domains:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/MonitorView' }
                        - type: object
                          properties:
                            application_id: { type: string }
                            status: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Webhooks
  /webhooks:
    post:
      operationId: createWebhook
      summary: Register a webhook endpoint (secret returned once)
      tags: [Webhooks]
      description: >-
        Registers an HTTPS receiver under the calling application. The `secret`
        (`whsec_…`) is returned ONCE. Store it to verify signatures. An empty
        `events` array subscribes to all events; `"*"` also matches all.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  description: >-
                    Event types to subscribe to; empty subscribes to all events,
                    and `"*"` also matches all. Every value listed here has a
                    producer: the enum is asserted against the emit sites in CI,
                    so you can never subscribe to an event that cannot arrive.
                    `connection.records.updated` / `connection.reapply.failed` /
                    `connection.disconnected` cover the managed (async one-click)
                    re-apply and disconnect lifecycle; `connection.disconnected`
                    carries a `removal` object saying what happened to the DNS
                    records. `certificate.issued` / `certificate.renewed` /
                    `certificate.failed` follow the edge's certificate reports,
                    and `certificate.expiring` fires 14, 7 and 3 days before an
                    unrenewed certificate expires and when it expired; each
                    carries a `certificate` object. `domain.record_missing` /
                    `domain.record_restored` carry a `drift` object with the
                    record, what public DNS shows and what was done about it.
                    `secure_status` is sent only where the deployment has
                    Secure on (`SECURE_ENABLED`), once each time a
                    certificate's status changes.
                  items:
                    type: string
                    enum:
                      - '*'
                      - domain.record_missing
                      - domain.record_restored
                      - domain.purchased
                      - purchase.error
                      - purchase.confirmation.expired
                      - secure_status
                      - power_status
                      - connection.created
                      - connection.applied
                      - connection.live
                      - connection.failed
                      - connection.records.updated
                      - connection.reapply.failed
                      - connection.records_outdated
                      - connection.disconnected
                      - certificate.issued
                      - certificate.renewed
                      - certificate.failed
                      - certificate.expiring
      responses:
        '201':
          description: Created (secret returned once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      tags: [Webhooks]
      description: >-
        With an API key: endpoints across all the tenant's live apps (a test
        mode application's endpoints are left out unless `?app_id=` names it).
        With a test mode API key: that application's endpoints. With a widget
        JWT: the calling app's endpoints. Secrets are omitted.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters:
        - name: app_id
          in: query
          required: false
          schema: { type: string }
          description: Narrow to one application, which is how a live key reaches a test mode application's endpoints.
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      security:
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: Recent webhook delivery attempts for the caller's tenant
      tags: [Webhooks]
      description: >-
        API key: all the tenant's apps. Widget JWT: the calling app.
        `?app_id=` narrows to one application; `?type=` filters by event type.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters:
        - { name: app_id, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, count]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------- Billing
  /plans:
    get:
      operationId: listPlans
      summary: Public plan catalog (plus billing {configured, mode})
      tags: [Billing]
      description: >-
        The public plan catalog: `starter` ($10 a month, the default for a new
        workspace, 14 day trial), `startup`, `growth`, and the contact-sales
        `premium` and `enterprise`. The retired `free` plan is not listed; a
        workspace created before it was retired keeps it until it subscribes.
      security: []
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
                  billing:
                    type: object
                    properties:
                      configured: { type: boolean, description: Whether a Stripe key is configured. }
                      mode: { type: string, enum: ['test', 'live', ''] }
                      trial_days: { type: integer, description: The trial a new workspace's first subscription starts with. }
  /billing/usage:
    get:
      operationId: getUsage
      summary: Metered domain usage, plan, and quota for the caller's tenant
      tags: [Billing]
      description: >-
        The tenant is derived from the authenticated credential, never a query
        parameter. `?period=` defaults to the current UTC calendar month.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, examples: ['2026-07'] } }
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/checkout:
    post:
      operationId: createCheckout
      summary: Start a Stripe Checkout session for a self-serve plan
      tags: [Billing]
      description: >-
        Starts a subscription Checkout for the caller's workspace. Requires
        `billing:manage` (owners and admins); a widget token is refused. The
        session collects the card up front, and carries the customer's
        `promotion_code` as its discount when one is sent (below). A new
        workspace's first subscription starts with a 14 day trial; a workspace
        inside its grace period (the retired Free plan) gets a trial that ends
        when its grace ends, so subscribing early never costs a day; anyone else
        is charged today. A workspace that already has a running subscription
        gets `409` (change the plan with `/billing/change-plan` instead).
        Nothing is granted until Stripe confirms the checkout.


        Supply EITHER `return_url` (embedded Checkout, the response carries
        `client_secret`) OR both `success_url` and `cancel_url` (hosted
        Checkout, the response carries `url`).


        `promotion_code` is optional: the text a customer typed, at most 64
        characters (never a Stripe `promo_` id). It is checked here, before
        Stripe is asked for a session, and only CustomDomain's own codes are
        taken (made through the operator console, or limited to this
        deployment's Stripe products), because a Stripe account can be shared
        with other products. A code that is not CustomDomain's, does not exist
        or is no longer active is a `404`, the same for all three, and no
        session is created; a CustomDomain code that Stripe will not give this
        order (a first order only code, a minimum amount) is a `400`. The code
        becomes the session's one discount, and Stripe's own code field on its
        checkout page is never switched on, so a code of another product cannot
        be typed there either. A Checkout Session cannot be given a discount
        after it is created: to add, change or remove a code, start a new
        checkout (with the new code, or without one) and mount its
        `client_secret` in place of the old one.


        `ui_mode` is optional and picks how the session is shown. Leave it out
        (a `null` or an empty string counts as leaving it out), or send
        `embedded`, for the behavior from before it existed: Stripe Embedded
        Checkout when `return_url` is set, and the hosted redirect when only
        `success_url` and `cancel_url` are. `elements` is Elements with the
        Checkout Sessions API: the caller renders the whole page (the plan, the
        price, the trial, the promotion code box, the totals) and mounts only
        Stripe's Payment Element with the returned `client_secret`, so the page
        can wear its own theme. It needs `return_url`, which is where redirect
        based payment methods and the finished payment land, and the session is
        created on a Stripe API version of the dahlia release train (the billing
        guide names the exact version), so mount it with a Stripe.js of that
        train. The trial, the promotion codes and the card up front are the same
        in every mode. The response's `ui_mode` says what was really created
        (`embedded`, `elements` or `hosted`): an `elements` request answers
        `embedded` when Stripe could not create an Elements session, so read it
        before mounting anything. `hosted` is only ever an answer, never a
        request value: a client that keeps the response's `ui_mode` must not
        send it back (the redirect flow is chosen by sending `success_url` and
        `cancel_url` without `return_url`). Any other value is a 400.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/PlanId' }
                success_url: { type: string, format: uri }
                cancel_url: { type: string, format: uri }
                return_url: { type: string, format: uri, description: 'Selects embedded Checkout, or the elements checkout with ui_mode elements.' }
                ui_mode: { type: string, enum: [embedded, elements], description: 'How the session is shown. Leave it out (or send null or an empty string) for Stripe Embedded Checkout when `return_url` is set and the hosted redirect when only `success_url` and `cancel_url` are. `elements` requires `return_url`. Never send `hosted`: it is only an answer.' }
                promotion_code: { type: string, maxLength: 64, description: 'A promotion code as a customer types it (never a Stripe `promo_` id). Taken only when it is one of CustomDomain''s own, and then the session''s one discount. Not found, not CustomDomain''s, or no longer active is a `404`.' }
      responses:
        '200':
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, description: Hosted Checkout URL (redirect flow). }
                  client_secret: { type: string, description: Client secret to mount the embedded or elements checkout with. }
                  ui_mode: { type: string, enum: [embedded, elements, hosted], description: 'How the session was really created. An `elements` request answers `embedded` when Stripe could not create an Elements session.' }
                  trial_days: { type: integer, description: 'Trial length, when the checkout starts one by days.' }
                  trial_end: { type: [string, 'null'], format: date-time, description: 'When the trial ends, when it ends at a fixed time (the grace end).' }
                  first_charge_at: { type: string, format: date-time, description: 'When the card is first charged, when there is a trial.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: 'The `promotion_code` does not exist, is no longer active, or is not one of CustomDomain''s own.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/portal:
    post:
      operationId: createPortalSession
      summary: Open a Stripe Billing Portal session
      tags: [Billing]
      description: >-
        Opens the Stripe Billing Portal (invoices, the card, cancellation) for
        the caller's workspace. Requires `billing:manage` (owners and admins)
        and a Stripe customer (a completed checkout). `flow` deep-links into one
        task: `payment_method_update` (the "update your card" link of a payment
        failure email) or `subscription_cancel`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url]
              properties:
                return_url: { type: string, format: uri }
                flow: { type: string, enum: [payment_method_update, subscription_cancel] }
      responses:
        '200':
          description: Portal session
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/notice:
    get:
      operationId: getBillingNotice
      summary: Whether billing needs attention (every member)
      tags: [Billing]
      description: >-
        What the console needs on every page to decide on a billing banner or
        the setup flow. Any member of the workspace may read it with their own
        tenant API key. Members and viewers get only `role`, `can_manage`,
        `configured`, `attention` and `restricted`: never the plan, dates or
        amounts. Owners and admins also get the billing state, and
        `first_domain_free` with `free_domains` (how many domains it may
        connect before a card) while a new workspace is on the first domain
        free rule.
      security:
        - apiKey: []
      responses:
        '200':
          description: Billing notice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingNotice' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /billing/standing:
    get:
      operationId: getBillingStanding
      summary: Whether the workspace may connect new domains
      tags: [Billing]
      description: >-
        The lean read the MCP server's `check-billing-status` tool uses: whether
        a new connection is refused right now, and if so the same `code`, `title`
        and `details` the refusal carries (`billing_required`), plus the plan and
        this month's usage. It has no dates, amounts, invoices or card; owners and
        admins read those from `GET /billing/status`. Any workspace credential may
        read it: a tenant API key of any role, a delegated agent token with
        `domains:read`, or a widget token minted with scope `app`. A
        `connect`-scoped widget token (an end user's) is refused with `403`.
      security:
        - apiKey: []
        - widgetJWT: []
        - agentToken: ['domains:read']
      responses:
        '200':
          description: The workspace's standing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingStanding' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /billing/status:
    get:
      operationId: getBillingStatus
      summary: The workspace's subscription (owners and admins)
      tags: [Billing]
      description: >-
        The billing page: plan, state, trial or grace countdown, the next
        charge, the card on file, what a checkout started now would give, and
        this month's usage. Requires `billing:manage` (owners and admins);
        members and viewers get `403`.
      security:
        - apiKey: []
      responses:
        '200':
          description: Billing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/invoices:
    get:
      operationId: listBillingInvoices
      summary: The workspace's recent invoices (owners and admins)
      tags: [Billing]
      description: Read from Stripe, newest first. Requires `billing:manage`.
      security:
        - apiKey: []
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/grace:start:
    post:
      operationId: startBillingGrace
      summary: Start a legacy Free workspace's grace period (owners and admins)
      tags: [Billing]
      description: >-
        Called by the console when an owner or admin opens it: a workspace still
        on the retired Free plan gets its 14 day grace period from now (and its
        owners and admins an email). Idempotent, and a no-op in any other state.
        A Free workspace that never signs in gets the same grace at its first
        connection attempt. Requires `billing:manage`.
      security:
        - apiKey: []
      responses:
        '200':
          description: The grace state
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, description: Whether this call started the grace. }
                  state: { $ref: '#/components/schemas/BillingState' }
                  grace_ends_at: { type: [string, 'null'], format: date-time }
                  days_left: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/checkout:confirm:
    post:
      operationId: confirmBillingCheckout
      summary: Record a completed plan checkout now (owners and admins)
      tags: [Billing]
      description: >-
        Called when Stripe returns the browser from a completed Checkout, so the
        subscription is recorded at once instead of when Stripe's
        `checkout.session.completed` event arrives. The session is read from
        Stripe, never trusted from the caller: it must belong to the caller's
        workspace (another workspace's session is a `404`) and be complete and
        paid (a trial's "no payment required" counts); otherwise `confirmed` is
        false and nothing changes. Idempotent with the webhook. Requires
        `billing:manage`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, examples: ['cs_test_a1B2c3'] }
      responses:
        '200':
          description: Whether the checkout was recorded, and the billing status after
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed: { type: boolean }
                  session_status: { type: string, examples: ['complete', 'open'] }
                  payment_status: { type: string, examples: ['paid', 'no_payment_required', 'unpaid'] }
                  billing: { $ref: '#/components/schemas/BillingStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/change-plan:
    post:
      operationId: changeBillingPlan
      summary: Move a running subscription to another self-serve plan
      tags: [Billing]
      description: >-
        Swaps the price of the workspace's running Stripe subscription (Stripe
        prorates the difference). Self-serve plans only; a workspace without a
        running subscription gets `409` and subscribes through
        `/billing/checkout`. Requires `billing:manage`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/PlanId' }
      responses:
        '200':
          description: The new billing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /billing/promotion-code:
    post:
      operationId: applyBillingPromotionCode
      summary: Apply a promotion code to the running subscription
      tags: [Billing]
      description: >-
        Applies a promotion code, as a customer types it, to the workspace's
        running subscription (a new subscription takes a code as
        `promotion_code` on `POST /billing/checkout`). A code is accepted only when it belongs to this
        deployment, because a Stripe account can be shared with other products:
        it was created through the operator console, or its coupon is limited
        to this deployment's Stripe products. An unknown, inactive or foreign
        code is a `404`. Requires `billing:manage`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: The new billing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Enterprise
  /rbac:
    get:
      operationId: getRbac
      summary: Role / permission matrix (static reference)
      tags: [Enterprise]
      security: []
      responses:
        '200':
          description: Matrix
  /audit:
    get:
      operationId: getAudit
      summary: Audit log (tenant-scoped for tenant credentials; full log for the management key)
      tags: [Enterprise]
      security:
        - managementKey: []
        - apiKey: []
        - widgetJWT: []
      responses:
        '200':
          description: Events
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: recordAuditEvent
      summary: Record an audit event for a change made in the console
      tags: [Enterprise]
      description: >-
        Ingest for the few mutations that happen in the customer console's own
        database, so the control plane never sees them. Everything the control
        plane changes itself is recorded by its own handler and is not accepted
        here. The organization, actor, address and time are derived on the
        server; the body names only the action, an optional target and a small
        before and after summary. Requires an API key whose role may manage
        identity settings (admin or owner); a widget JWT is refused with `403`,
        and a `503` means the audit log is not configured on the deployment.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [whitelabel.configured, api_key.default_revealed]
                  description: >-
                    The console-recordable verb. Any other value is refused with `400`.
                target:
                  type: string
                  description: >-
                    What the event is about. Defaults to the caller's own
                    organization when empty.
                before:
                  type: object
                  additionalProperties: true
                  description: A small summary of the state before the change; at most 24 keys.
                after:
                  type: object
                  additionalProperties: true
                  description: A small summary of the state after the change; at most 24 keys.
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [recorded, action]
                properties:
                  recorded: { type: boolean }
                  action: { type: string, description: The verb that was recorded. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Secure (SSL)
  # The whole /ssl surface is gated by SECURE_ENABLED on the deployment; when
  # unset every route answers 503 ("not configured") and nothing is written.
  /connections/{id}/ssl:
    get:
      operationId: getConnectionCertificate
      summary: Read the mirrored TLS certificate status for a connection's domain
      tags: [Secure]
      description: >-
        The control-plane's read-mirror of the edge certificate store for this
        connection's domain. `404` when no certificate is tracked yet.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Certificate status
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deprovisionConnectionCertificate
      summary: Deprovision a connection's certificate (drop the mirror, stop managing)
      tags: [Secure]
      description: >-
        Drops the mirror row and clears `secure_root_domain`; the edge stops
        managing the certificate on its next reconcile.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deprovisioned }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/ssl:eligibility:
    get:
      operationId: getConnectionCertificateEligibility
      summary: Whether a certificate can be issued for this connection yet
      tags: [Secure]
      description: >-
        Advisory: a certificate is only issuable once the domain points at the
        edge (connection `live` or `propagating`). The widget/console uses this
        to gate the provision button.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Eligibility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eligibility' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/ssl:provision:
    post:
      operationId: provisionConnectionCertificate
      summary: Record intent to issue an edge-managed certificate
      tags: [Secure]
      description: >-
        Creates/updates the mirror row as `pending` + managed. The edge performs
        the actual ACME issuance on first handshake and reports back. Optionally
        sets `secure_root_domain` so the edge also secures the registrable apex.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                secure_root_domain: { type: boolean, description: also secure the registrable apex. }
      responses:
        '202':
          description: Provisioning requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/ssl:renew:
    post:
      operationId: renewConnectionCertificate
      summary: Mark a connection's certificate for renewal
      tags: [Secure]
      description: >-
        Records the operator-requested renew and surfaces `renewing`. The edge's
        autocert manager performs the actual renewal ahead of expiry.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '202':
          description: Renewal requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/ssl:import:
    post:
      operationId: importConnectionCertificate
      summary: Record an operator-supplied (externally obtained) certificate's metadata
      tags: [Secure]
      description: >-
        Mirrors the status + validity window of an external certificate for
        display (`managed=false`, so the edge does not ACME-renew it). Private
        key material is an edge concern and is not handled here.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuer: { type: string }
                not_before: { type: string, format: date-time, description: RFC3339. }
                not_after: { type: string, format: date-time, description: RFC3339. }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { $ref: '#/components/schemas/Certificate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ssl:
    get:
      operationId: listCertificates
      summary: List the certificates tracked for the caller's application
      tags: [Secure]
      security:
        - widgetJWT: []
        - apiKey: []
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: array
                    items: { $ref: '#/components/schemas/Certificate' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Power
  # The whole /power surface is gated by POWER_ENABLED on the deployment; when
  # unset every route answers 503 ("not enabled") and nothing is written.
  /connections/{id}/power:
    get:
      operationId: getConnectionPower
      summary: Read a connection's Power (edge reverse-proxy) configuration
      tags: [Power]
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Power configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  power: { $ref: '#/components/schemas/PowerConfig' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: enableConnectionPower
      summary: Enable Power (register the origin + redirect/root-path config)
      tags: [Power]
      description: >-
        Registers the origin the edge reverse-proxies to (SSRF-validated) plus
        the redirect / root-path config the ask answer carries. `application_url`
        is required to enable.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PowerConfigInput' }
      responses:
        '201':
          description: Power enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  power: { $ref: '#/components/schemas/PowerConfig' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: disableConnectionPower
      summary: Remove Power (drop the origin, clear config, tear down the cert)
      tags: [Power]
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Power removed }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /applications/{id}/power:default:
    get:
      operationId: getApplicationDefaultOrigin
      summary: The application-wide default origin
      tags: [Power]
      description: >-
        The origin the edge proxies to for any of this application's connections
        that have no origin of their own. Resolution order is: the connection's
        own origin, then this default, then none (the edge answers 421).


        This exists because a per-connection origin is the wrong grain for the
        common case: one application serving thousands of customer domains, all
        proxying to the same place and dispatching on `X-Forwarded-Host`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The current default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationDefaultOrigin' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: setApplicationDefaultOrigin
      summary: Set or clear the application-wide default origin
      tags: [Power]
      description: >-
        Send `default_origin: ""` to clear it. The value is validated by the same
        guard a per-connection origin gets, and the edge re-validates the
        RESOLVED address at dial time: a hostname that passes here and is later
        repointed at a private address is refused when the edge connects.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [default_origin]
              properties:
                default_origin:
                  type: string
                  description: Absolute http(s) URL, or "" to clear.
                  example: https://app.yourcompany.com
      responses:
        '200':
          description: The stored default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationDefaultOrigin' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /applications/{id}/connect-target:
    get:
      operationId: getConnectTarget
      summary: Where this application's customer domains point
      tags: [Applications]
      description: >-
        `mode: edge` (the default) points customer domains at the platform edge,
        which proxies their traffic (Power). `mode: custom` points them at your
        own infrastructure: subdomains get a CNAME to `cname_target`; a root
        domain gets an ALIAS, ANAME or flattened CNAME to it on providers that
        have one, and A records to `apex_ipv4` elsewhere. `edge` echoes what edge
        mode points at, so a console can show both options.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Connection target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectTargetView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: setConnectTarget
      summary: Point this application's customer domains at your own infrastructure
      tags: [Applications]
      description: >-
        Available on every plan (it is how a Connect-only plan gets domains that
        serve). `cname_target` must be a public hostname that is not the
        platform edge; send `""` to go back to the edge. `apex_ipv4` (up to 4
        public IPv4 addresses) is what root domains get on DNS providers with no
        ALIAS-style record; without it such roots cannot be pointed at a
        hostname and `POST /domains:check` reports `apex_strategy: unsupported`.
        Existing connections pick up the new target for any record set that
        has not been written yet.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cname_target]
              properties:
                cname_target: { type: string, description: 'Hostname, or "" for the edge.' }
                apex_ipv4:
                  type: array
                  maxItems: 4
                  items: { type: string }
      responses:
        '200':
          description: Connection target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectTargetView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/power:eligibility:
    get:
      operationId: getConnectionPowerEligibility
      summary: Whether Power can be enabled for this connection yet
      tags: [Power]
      description: >-
        Power needs the domain pointing at the edge (connection `live` or
        `propagating`) so the reverse proxy receives its traffic.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Eligibility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eligibility' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/power:repower:
    post:
      operationId: repowerConnection
      summary: Update an existing Power configuration
      tags: [Power]
      description: >-
        Update the origin and/or config. Omitting `application_url` keeps the
        current origin (unlike enable, which requires it).
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PowerConfigInput' }
      responses:
        '200':
          description: Power updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  power: { $ref: '#/components/schemas/PowerConfig' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /power:
    get:
      operationId: listPoweredConnections
      summary: List the caller app's powered connections
      tags: [Power]
      security:
        - widgetJWT: []
        - apiKey: []
      responses:
        '200':
          description: Powered connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  power:
                    type: array
                    items: { $ref: '#/components/schemas/PowerConfig' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Connections (bulk) + Providers (zones)
  /connections:bulk:
    post:
      operationId: bulkCreateConnections
      summary: Create connections for a set of domains in one call
      tags: [Connections]
      description: >-
        Fans out the same idempotent upsert as single-domain create. Each domain
        is independent: a bad domain is reported `failed` and the batch
        continues; a domain already connected under this app returns `already`.
        Max 200 domains per call.


        Callable with an app scoped widget token or straight from your server
        with an API key, in which case the connections are created on the key's
        application, or on `application_id` when that names another
        application of the same tenant. A viewer's key is refused.


        `end_user_ref` labels every connection the call creates, the way it does
        on a single create: an agency adds a client's domains together under the
        client's name, and the Domains page shows, filters and exports the
        label. It is set once, when the connection is created. A domain that
        already exists keeps the label it has and is reported `already`.


        A workspace with no subscription yet connects its first ten domains, or
        the number an operator set, without one; the rest of a list are
        reported `failed` with the reason, one by one, until it starts its
        trial.
      security:
        - widgetJWT: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              description: >-
                The body is decoded with unknown fields REJECTED, so the
                properties below are exactly the accepted set.
              properties:
                domains:
                  type: array
                  items: { type: string }
                  maxItems: 200
                batch_id: { type: string, description: correlates every domain connected in one session. }
                end_user_ref:
                  type: string
                  maxLength: 256
                  description: >-
                    Your own label for these domains, such as a client's name or
                    your id for the customer they belong to. Stored on each
                    connection this call creates and echoed back by the
                    connection reads.
                application_id:
                  type: string
                  description: >-
                    API key callers only: create the connections on this
                    application of the key's tenant instead of the key's own.
                    A widget token may only name its own application.
      responses:
        '200':
          description: Per-domain results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/BulkResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /provider-accounts:
    post:
      operationId: createProviderAccount
      summary: Connect a provider account with a key
      tags: [Provider accounts]
      description: >-
        Keeps a DNS provider or registrar key for the workspace, encrypted
        (GRANT_ENCRYPTION_KEY; `503` without it). The key is checked first by
        listing the provider's domains, or, for a provider that cannot list
        them, by reading one of the selected domains or `check_domain`; with
        neither, `400` `check_domain_required`, and a key is never kept
        unchecked. `access` is `continuous` (kept until revoked, used only to
        put back records it wrote that disappear where the deployment has
        automatic repair on, remove records when a domain is removed, and
        re-apply the records it wrote on request) or `one_time` (usable for an
        hour, and deleted as soon as the chosen domains are connected or the
        hour passes). `scope` is `all` of the account's domains or `selected`
        ones. The key is never returned.


        Anyone whose role operates applications may connect a key, read the
        accounts and revoke one. Changing an account's access, scope or
        domains, connecting domains with it and replacing its key take an
        admin, an owner or the member who connected it (`can_manage`).
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, credential]
              properties:
                provider: { type: string }
                label: { type: string }
                access: { type: string, enum: [continuous, one_time], default: continuous }
                scope: { type: string, enum: [all, selected] }
                domains:
                  type: array
                  items: { type: string }
                check_domain:
                  type: string
                  description: >-
                    A domain the key manages, read to check the key when the
                    provider cannot list its domains and `scope` is `all`.
                credential:
                  type: object
                  required: [token]
                  properties:
                    token: { type: string }
                    params: { type: object, additionalProperties: { type: string } }
      responses:
        '201':
          description: The account, and the provider's domains when it lists them
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/ProviderAccount' }
                  zones:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { description: "The provider refused the key (`ProviderAuthenticationError`)" }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listProviderAccounts
      summary: Every connected account, with the kept sign-ins and Domain Connect grants
      tags: [Provider accounts]
      description: >-
        The workspace's provider accounts with their access mode, the domains
        they cover, when they were last used and when they expire, and
        whether the caller may manage each one (`can_manage`); and, in
        `kept_access`, the sign-ins and Domain Connect authorizations kept per
        domain, grouped by provider. A kept sign-in is stopped per domain with
        `DELETE /connections/{id}/grant`.
      security:
        - apiKey: []
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts, kept_access, keeping_available]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderAccount' }
                  kept_access:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [sign_in, domain_connect] }
                        provider: { type: string }
                        provider_name: { type: string }
                        access: { type: string, enum: [continuous] }
                        connections:
                          type: array
                          items: { $ref: '#/components/schemas/AccountConnection' }
                        created_at: { type: string, format: date-time }
                        last_used_at: { type: string, format: date-time }
                        uses:
                          type: array
                          items: { type: string }
                  keeping_available: { type: boolean, description: Whether this deployment can keep keys (GRANT_ENCRYPTION_KEY is set). }
        '401': { $ref: '#/components/responses/Error' }
  /provider-accounts/{id}:
    get:
      operationId: getProviderAccount
      summary: One provider account with its domains
      tags: [Provider accounts]
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/ProviderAccount' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProviderAccount
      summary: Change an account's label, access or scope
      tags: [Provider accounts]
      description: >-
        Narrowing the scope detaches the domains it no longer covers; they stay
        connected, without continuous access. Switching to `one_time` deletes
        the key now. Switching to `continuous` needs the key still held.
        Changing `access`, `scope` or `domains` takes an admin, an owner or the
        member who connected the account (`403` otherwise); the label is
        anyone's who operates applications.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                access: { type: string, enum: [continuous, one_time] }
                scope: { type: string, enum: [all, selected] }
                domains:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/ProviderAccount' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeProviderAccount
      summary: Revoke an account
      tags: [Provider accounts]
      description: >-
        Deletes the key and the account. Its domains stay connected and
        served, without continuous access; each domain's timeline records it.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  revoked: { type: boolean }
                  domains_kept_connected: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /provider-accounts/{id}/zones:
    post:
      operationId: listProviderAccountZones
      summary: The domains the account's key can reach
      tags: [Provider accounts]
      description: >-
        Lists the provider's domains with the kept key. `listed` is false for a
        provider that cannot list them. A refused key flags the account
        `needs_reconnect`. A one time account past its hour answers `409`, and
        its key is deleted then if the hourly cleanup has not deleted it yet.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items: { type: string }
                  listed: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: "The provider refused the key; the account is flagged `needs_reconnect`" }
        '503': { $ref: '#/components/responses/Error' }
  /provider-accounts/{id}/connect:
    post:
      operationId: connectWithProviderAccount
      summary: Connect domains with the account
      tags: [Provider accounts]
      description: >-
        Creates a connection for each domain under the application and writes
        its records with the account's key (keeping the CAA and TXT values
        already there and recording what each write replaced). Each domain is
        linked to the account; a continuous account then keeps them in sync.
        A domain the application already serves is only linked. A one time
        account deletes its key once the domains are connected, even when the
        caller has gone away by then, and past its hour answers `409`. A
        domain in a zone the key does not reach fails alone
        (`zone_not_reached` on the connection); the account is flagged
        `needs_reconnect` only when the provider refuses the key itself, which
        is checked with a request that does not depend on the zone. Takes an
        admin, an owner or the member who connected the account.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id, domains]
              properties:
                application_id: { type: string }
                domains:
                  type: array
                  items: { type: string }
                www_redirect: { type: boolean }
      responses:
        '200':
          description: Per domain results and the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: { type: string }
                        connection_id: { type: string }
                        status: { type: string, enum: [connected, already, failed] }
                        message: { type: string }
                  account: { $ref: '#/components/schemas/ProviderAccount' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /provider-accounts/{id}/reconnect:
    post:
      operationId: reconnectProviderAccount
      summary: Give an account a new key
      tags: [Provider accounts]
      description: >-
        For an account the provider stopped accepting, or a one time account
        whose key was deleted. Everything is checked before anything is kept:
        the access mode, then the key (listing the provider's domains, or
        reading `check_domain`, a selected domain or a domain the account
        connected, for a provider that cannot list them), and for a `selected`
        account that the key reaches every selected domain. `params` sent
        with the key replace the kept ones. Takes an admin, an owner or the
        member who connected the account.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                access: { type: string, enum: [continuous, one_time] }
                check_domain:
                  type: string
                  description: A domain the key manages, read to check the key when the provider cannot list its domains.
                credential:
                  type: object
                  required: [token]
                  properties:
                    token: { type: string }
                    params: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/ProviderAccount' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { description: "The provider refused the key (`ProviderAuthenticationError`)" }
        '503': { $ref: '#/components/responses/Error' }
  /providers/{provider}/zones:list:
    post:
      operationId: listProviderZones
      summary: Enumerate the connectable domains a provider credential controls
      tags: [Providers]
      description: >-
        For the bulk-connect picker. The credential is used once to list zones
        and is never persisted here. `422` (`list_not_supported`) when the
        adapter can't enumerate zones; the console degrades to single-domain
        connect.
      security:
        - widgetJWT: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  required: [token]
                  properties:
                    token: { type: string, description: "Scoped provider API token; used once, never persisted." }
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  zones:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422':
          description: The provider can't enumerate zones
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, examples: [list_not_supported] }
                  provider: { type: string }
                  message: { type: string }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Registrar (purchase flow)
  /registrar/checkout:
    post:
      operationId: startDomainCheckout
      summary: Start an embedded payment to buy a domain at retail
      tags: [Registrar]
      description: >-
        Authorizes payment (manual capture) for a domain at the retail price.
        Returns a Stripe checkout session whose `client_secret` drives the
        embedded payment element. The domain is registered only after payment
        completes via `POST /v1/registrar/fulfill`; the card is captured strictly
        after the registrar settles, so a failed registration never charges the
        buyer. `503` when purchasing is disabled on the deployment.


        `ui_mode` is optional and picks how the payment is shown. Leave it out
        (a `null` or an empty string counts as leaving it out), or send
        `embedded`, for Stripe Embedded Checkout. `elements` is Elements with the
        Checkout Sessions API: the caller renders the page and mounts only
        Stripe's Payment Element with the returned `client_secret`, so the page
        can wear its own theme; the session is created on a Stripe API version
        of the dahlia release train (the billing guide names the exact version),
        so mount it with a Stripe.js of that train. Authorizing now and
        capturing after registration works the same in both. The response's
        `ui_mode` says what was really created (`embedded` or `elements`; a
        domain payment has no redirect flow, so it is never `hosted`): an
        `elements` request answers `embedded` when Stripe could not create an
        Elements session, so read it before mounting anything. Any other
        `ui_mode`, `hosted` included, is a 400.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, buyer, return_url]
              properties:
                domain: { type: string }
                buyer:
                  type: object
                  required: [email]
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    country: { type: string, description: ISO 3166-1 alpha-2. }
                return_url: { type: string, format: uri }
                ui_mode: { type: string, enum: [embedded, elements], default: embedded, description: 'How the payment is shown. Leave it out (or send null or an empty string) for embedded: a domain payment has no redirect flow. Never send `hosted`.' }
      responses:
        '200':
          description: Stripe checkout session (embedded or elements)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/BillingRequired' }
        '503': { $ref: '#/components/responses/Error' }
  /registrar/fulfill:
    post:
      operationId: fulfillDomainPurchase
      summary: Finalize a domain purchase after the embedded payment completes
      tags: [Registrar]
      description: >-
        Verifies the session, registers the domain, captures the charge, and
        auto-connects the domain. Idempotent per session id (the Stripe webhook
        drives the same path server-side, so a closed tab never strands a paid
        session). `201` on first fulfillment, `200` on an idempotent replay.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        '200':
          description: Already fulfilled (idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellOrder' }
        '201':
          description: Purchased
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellOrder' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '502':
          description: "Registrar registration failed after payment authorization; the card authorization was released (code: registration_failed)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sell/orders:
    get:
      operationId: listSellOrders
      summary: List the calling application's domain-purchase orders, newest first
      description: >-
        Every order the application recorded (quoted, purchased, transferred,
        failed, or expired). A quote-only order that was never paid for is
        expired by the hourly reaper after 24 hours (status `expired`, with a
        `purchase.confirmation.expired` webhook), so "quoted" always means
        recent intent.


        With a tenant API key it lists the orders of every application of the
        tenant, or of one with `app_id` (another tenant's id answers `404`). A
        widget token minted with scope `app`, or a delegated agent token with
        `domains:read`, lists its own application's orders.
      tags: [Registrar]
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      parameters:
        - name: app_id
          in: query
          required: false
          description: With a tenant API key, list the orders of this one application of the tenant.
          schema: { type: string }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [orders, count]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/SellOrderView' }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /sell/orders/{id}:
    get:
      operationId: getSellOrder
      summary: Read a persisted domain-purchase order's status by id
      tags: [Registrar]
      description: >-
        A widget token or a delegated agent token (`domains:read`) reads an
        order of its own application; a tenant API key reads an order of any of
        its applications. An order of another application answers `404`.
      security:
        - widgetJWT: []
        - apiKey: []
        - agentToken: ['domains:read']
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellOrderView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Agents
  # The agent OAuth endpoints sit at the origin root, not under /v1, so each
  # path item names its server. Discovery: GET /.well-known/oauth-authorization-server
  # (RFC 8414) and GET /.well-known/jwks.json (RFC 7517) are specified by those
  # RFCs and are not repeated here.
  /oauth/agent/register:
    servers:
      - url: https://api.customdomain.ai
        description: Hosted control-plane (the origin, not /v1)
    post:
      operationId: registerAgentClient
      summary: Register an agent as an OAuth client
      tags: [Agents]
      description: >-
        Dynamic Client Registration (RFC 7591). An AI assistant registers itself
        as a public client (PKCE, no secret) and can do nothing until a person
        approves a grant for it in the console. Registration is open on purpose,
        so it is bounded: a per-IP hourly budget on top of the global limit, and a
        client that nobody ever approves into a workspace is deleted after a
        while. Other client metadata (`client_uri`, `logo_uri`, `scope`,
        `contacts`, ...) is accepted and ignored. A `client_name` that claims a
        well known brand (Claude, ChatGPT, ...) is refused unless every redirect
        host belongs to that brand or is a loopback address. Errors use the RFC
        7591 envelope.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentClientRegistration' }
      responses:
        '201':
          description: The registered client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentClient' }
        '400':
          description: >-
            `invalid_client_metadata` (a bad or impersonating name, grant or
            response types without the authorization code grant) or
            `invalid_redirect_uri` (none, more than 10, a fragment, user
            information, or http on a host that is not loopback).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /oauth/agent/authorize:
    servers:
      - url: https://api.customdomain.ai
        description: Hosted control-plane (the origin, not /v1)
    get:
      operationId: authorizeAgent
      summary: Start an agent authorization (code with PKCE)
      tags: [Agents]
      description: >-
        The authorization endpoint. A browser is sent here by an agent; the
        request is validated (the client, the exact redirect URI, S256 PKCE, the
        scopes, the resource) and the browser is redirected to the console, where
        a signed in owner or admin sees what the agent asks for and where its code
        would go, and approves or denies. The authorization code goes to the
        redirect URI and is exchanged at `POST /oauth/agent/token`. A request with
        an unregistered or mismatched redirect URI is refused without redirecting.
        `client_id` is a registered client or an https URL of a Client ID Metadata
        Document.
      security: []
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, description: 'BASE64URL(SHA-256(code_verifier)).', schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - name: scope
          in: query
          required: true
          description: Space separated scopes from `domains:read`, `domains:connect`, `domains:disconnect` and `domains:purchase`. The person may approve fewer.
          schema: { type: string, example: domains:read domains:connect }
        - { name: state, in: query, required: false, schema: { type: string } }
        - name: resource
          in: query
          required: false
          description: >-
            RFC 8707. The resource the token is for: the MCP endpoint
            (`https://mcp.customdomain.ai/mcp`, the default) or this API's origin.
            Anything else is `invalid_target`. The access token carries it as `aud`.
          schema: { type: string, format: uri }
      responses:
        '302':
          description: Redirect to the console consent screen
          headers:
            Location: { schema: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /oauth/agent/token:
    servers:
      - url: https://api.customdomain.ai
        description: Hosted control-plane (the origin, not /v1)
    post:
      operationId: exchangeAgentToken
      summary: Exchange an authorization code or a refresh token for an access token
      tags: [Agents]
      description: >-
        `grant_type=authorization_code` (with the PKCE `code_verifier`) or
        `grant_type=refresh_token`. The access token is an ES256 JWT that lives 15
        minutes and is verified locally against `/.well-known/jwks.json`; it
        carries the tenant, the application the grant is bound to, the grant, the
        scopes and `aud`. A refresh token rotates: every refresh returns a new one
        and retires the old, and presenting a retired one again revokes the whole
        grant (a client racing itself within ten seconds is only refused). Errors
        use the RFC 6749 envelope.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/AgentTokenRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/AgentTokenRequest' }
      responses:
        '200':
          description: The tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTokenResponse' }
        '400':
          description: >-
            `invalid_request`, `invalid_grant` (a code or refresh token that is
            invalid, expired, spent or revoked, a failed PKCE check, a grant that
            is no longer active), `invalid_target` (a resource that is not the
            one approved) or `unsupported_grant_type`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '503':
          description: Agent access is not enabled on this deployment (`temporarily_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /oauth/agent/revoke:
    servers:
      - url: https://api.customdomain.ai
        description: Hosted control-plane (the origin, not /v1)
    post:
      operationId: revokeAgentToken
      summary: Revoke an agent's access with its refresh token
      tags: [Agents]
      description: >-
        RFC 7009. Revokes the grant behind a refresh token, so the agent's access
        ends within one access token lifetime (15 minutes at most). It answers
        `200` for a token it does not know, so it cannot be used to find out which
        tokens exist. The workspace's owners and admins are told once.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The refresh token. }
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The refresh token. }
      responses:
        '200': { description: "Revoked, or the token was not known" }
        '400':
          description: '`invalid_request`: no token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '503':
          description: Agent access is not enabled on this deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /agent/consent-request/{id}:
    get:
      operationId: getAgentConsentRequest
      summary: Read a pending agent authorization, for the consent screen
      tags: [Agents]
      description: >-
        What the console shows a signed in owner before they approve an agent: the
        client's name, where its authorization code would go (`redirect_host`),
        whether that destination is a known assistant's own (`verified`,
        `verified_as`) or the person's own computer (`local`), whether the name
        imitates a brand it does not belong to (`imitates`; such a request cannot
        be approved), how the client identified itself, and the scopes asked for.
        The unguessable request id is the capability: it needs no other
        credential and reveals only this.
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The pending request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConsentRequest' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: cancelAgentConsentRequest
      summary: Deny a pending agent authorization
      tags: [Agents]
      description: >-
        Consumes the request so it can no longer be approved, from this tab or any
        other. Idempotent, and like the read it needs no credential: the request id
        is the capability, and cancelling is all it allows.
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Denied }
        '503': { $ref: '#/components/responses/Error' }
  /agent/consent:
    post:
      operationId: approveAgent
      summary: Approve an agent and mint its authorization code
      tags: [Agents]
      description: >-
        Called by the console's server after a person signs in and approves, with
        that member's tenant API key (a widget token is refused, because it lives
        in browsers). The key's member needs `agent:manage` (owners and admins),
        and `member_id` must belong to the workspace. The approved scopes are a
        subset of what was requested. The grant is bound to one `application_id`
        of the workspace. `domains:purchase` also needs a `spend_cap_cents` and a
        saved card. Persistent access is the default; `persist: false` ends it
        after `expires_days`. The authorization code is single use and is
        exchanged at `POST /oauth/agent/token`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentConsentApproval' }
      responses:
        '200':
          description: The redirect for the agent, with its code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConsentResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent/grants:
    get:
      operationId: listAgentGrants
      summary: List the workspace's agent grants
      tags: [Agents]
      description: >-
        Every grant of the workspace with the current month's spend, for the
        console's manage screen. Needs a tenant API key held by an owner or admin
        (`agent:manage`). Refresh tokens are never returned.
      security:
        - apiKey: []
      responses:
        '200':
          description: The grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentGrantList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent/grants/{id}:
    delete:
      operationId: revokeAgentGrant
      summary: Revoke an agent's access
      tags: [Agents]
      description: >-
        Ends the grant and kills its refresh tokens; the agent's access token stops
        working within its 15 minute life. A grant of another workspace answers
        `404`. The workspace's owners and admins are told once (a repeat is quiet),
        and the audit log records `agent.revoked`. Needs `agent:manage`.
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Meta
  /config:
    get:
      operationId: getConfig
      summary: Public service discovery (advertised products and version)
      tags: [Meta]
      security: []
      responses:
        '200':
          description: Service capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  env: { $ref: '#/components/schemas/Environment' }
                  version: { type: string }
                  api_version: { type: string, examples: [v1] }
                  products:
                    type: array
                    description: >-
                      The products THIS deployment actually serves, not the full
                      catalog. "connect" and "mcp" are always present; "secure"
                      appears only when SECURE_ENABLED is set, "power" only when
                      POWER_ENABLED is set, "sell" only when a registrar is
                      configured, and "monitor" only when a DNS resolver is
                      wired. Absent products answer 503 not-configured on every
                      route. Per-tenant plan entitlements are not reflected here;
                      this endpoint is unauthenticated.
                    items: { type: string }
                    examples: [[connect, secure, sell, power, monitor, mcp]]

components:
  securitySchemes:
    managementKey:
      type: http
      scheme: bearer
      description: Operator management key. Gates provisioning + reads across tenants.
    provisionSecret:
      type: apiKey
      in: header
      name: X-Provision-Secret
      description: Narrow secret for the one-call signup provisioning endpoint (also accepted as a Bearer token).
    apiKey:
      type: http
      scheme: bearer
      description: 'Long-lived tenant API key, cd_live_… (production) or cd_test_… (staging, development), stored hashed. Keys created before the switch to cd_ start with sk_live_… / sk_test_… and are still accepted. Scoped to the owning application''s tenant.'
    widgetJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived widget JWT minted server-side via POST /v1/tokens. Scoped to one application (and optionally one domain).
    browserSession:
      type: http
      scheme: bearer
      description: >-
        The session token of one cloud browser sign in, returned by
        `POST /browser-sessions:redeem`. It binds one session, one connection and
        one workspace, lives at most as long as the session, and stops working the
        moment the session ends. It lives in the popup's memory only.
    agentToken:
      type: oauth2
      description: >-
        A delegated agent access token: an ES256 JWT that lives 15 minutes, sent
        as a bearer token. A person approves an agent in the console and the
        agent exchanges its authorization code (with PKCE) at the token
        endpoint. The token carries the workspace, the one application the grant
        is bound to, the grant, the approved scopes and its audience, and is
        verified against `/.well-known/jwks.json`. A route that accepts it lists
        the scope it needs; a token without the scope is refused with `403`, and
        a connection or order of another application answers `404`.
      flows:
        authorizationCode:
          authorizationUrl: https://api.customdomain.ai/oauth/agent/authorize
          tokenUrl: https://api.customdomain.ai/oauth/agent/token
          refreshUrl: https://api.customdomain.ai/oauth/agent/token
          scopes:
            'domains:read': Look at availability, connections, records, certificates, diagnoses, orders and the billing standing.
            'domains:connect': Connect a domain, recheck it, reapply its records and start a one click setup.
            'domains:disconnect': Remove a connected domain. The call must name the domain.
            'domains:purchase': Buy a domain, up to the grant's monthly spend cap.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    BrowserSessionId:
      name: sid
      in: path
      required: true
      description: The cloud browser session id, `bs_` and 32 hex characters.
      schema: { type: string }
    ActorEmail:
      name: X-Actor-Email
      in: header
      required: false
      description: >-
        The email of the person acting through the owner dashboard, recorded as
        the actor on the billing audit trail (the management key names no one).
        Read only on these operator routes. Absent or not an email: the actor
        is recorded as "owner dashboard".
      schema: { type: string, format: email }
  responses:
    Error:
      description: 'Error envelope: {code, title, details}.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BillingRequired:
      description: >-
        Refused because of the workspace's billing. `billing_required`: the
        workspace has no active or trialing subscription (a new workspace that
        has not started its trial, a Free workspace past its grace period, a
        comp that ended, or a subscription Stripe marked unpaid or canceled). It
        stops a new connection, the start of a domain purchase and the first live
        credential (an application, an API key or a rotated client secret).
        Domains already connected keep working, and an owner or admin sets up
        billing in the console; `details` says where. A new workspace's first
        domain is the exception: while it has fewer pending, propagating or live
        connections than its free domains (ten, unless an operator set another number:
        `free_domains`), a connect and the start of a purchase go through
        (`first_domain_free`), and the next one is refused with a `title` saying
        a card is needed to connect more domains. Credentials still need the
        trial. `quota_exceeded`
        (connections only): a plan that is refused past its quota (Starter, and
        the retired Free) is at it and the deployment enforces quotas.
        `connections_unavailable`: what a connect-scoped widget token, the
        tenant's own end user, gets instead of either, with neutral wording, so
        the tenant's customers are never told about the tenant's billing. A
        delegated agent token gets the full wording, and `GET /billing/standing`
        tells it beforehand whether a new connection would be refused.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: billing_required
            title: An active subscription is needed to connect new domains.
            details: "This workspace has not started its subscription yet. Domains that are already connected keep working. An owner or admin can set up billing at https://app.customdomain.ai/app/billing."
    AdminBillingTenant:
      description: The workspace after the action, with its invoices and audit trail.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminBillingTenantDetail' }
  schemas:
    Error:
      type: object
      required: [code, title]
      properties:
        code: { type: string, description: 'stable machine code, e.g. invalid_request, unauthorized, not_found, service_unavailable, internal_error' }
        title: { type: string, description: human-readable summary }
        details: { type: string, description: optional extra context }
    Environment:
      type: string
      enum: [production, staging, development]
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    PlanId:
      type: string
      description: '`free` is retired: legacy workspaces still carry it until they subscribe, and it cannot be bought or assigned.'
      enum: [starter, startup, growth, premium, enterprise, free]
    Plan:
      type: object
      properties:
        id: { $ref: '#/components/schemas/PlanId' }
        name: { type: string }
        price_cents: { type: integer, description: Monthly price in US cents; 0 when not public. }
        public_price: { type: boolean }
        domains_per_year: { type: integer, description: The marketed annual allowance. }
        domains_per_month: { type: integer, description: 'The enforced monthly allowance (`domains_per_year` ceiling-divided by 12; 0 = unlimited).' }
        metered: { type: boolean }
        overage_increment: { type: integer }
        motion: { type: string, enum: [self_serve, contact_sales] }
        entitlements: { type: object }
        hard_cap: { type: boolean, description: 'Connections past the monthly allowance are refused (`starter`) rather than recorded as overage.' }
        trial_days: { type: integer, description: The trial a new workspace's first subscription to this plan starts with (0 for contact sales). }
        default: { type: boolean, description: The plan preselected for a new workspace (`starter`). }
    BillingState:
      type: string
      description: >-
        A workspace's billing state, evaluated from its record and the clock.
        `trialing` and `active` are a running Stripe subscription; `past_due`
        is a failed payment Stripe is still retrying (nothing is refused);
        `grace` is a legacy Free workspace (or an operator extension) inside its
        grace period; `legacy_free` is a Free workspace whose grace has not
        started; `comped` is an operator comp; `blocked` and `canceled` refuse
        new connections (`402 billing_required`) while live domains keep
        working. A new workspace (`blocked`, reason `setup_required`) is
        refused only once its first domain is connected: see
        `first_domain_free`.
      enum: [trialing, active, past_due, grace, blocked, comped, canceled, legacy_free]
    BillingNotice:
      type: object
      required: [role, can_manage, configured, attention, restricted]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        can_manage: { type: boolean, description: Whether this member holds billing:manage (owners and admins). }
        configured: { type: boolean, description: Whether a workspace can subscribe on this deployment. }
        attention: { type: boolean, description: 'Billing needs an owner or admin: a trial or grace to act on, a failed payment, or a block.' }
        restricted: { type: boolean, description: New domain connections are refused right now. }
        setup_required: { type: boolean, description: 'Owners and admins only: send them through the billing setup flow.' }
        first_domain_free:
          type: boolean
          description: >-
            Owners and admins only, and present only when true: this is a new
            workspace on the first domain free rule. Its first domain connects
            without a subscription, so `restricted` is false until that domain
            is connected and true after, and the next one needs the trial.
            Credentials (an API key, an application) always need it.
        free_domains:
          type: integer
          description: >-
            Owners and admins only, present with `first_domain_free`: how many
            domains the workspace may connect before it has a subscription. One,
            unless the operator granted more.
        state: { $ref: '#/components/schemas/BillingState' }
        reason: { type: string, description: 'Why a restricted workspace is restricted: setup_required, grace_ended, unpaid, comp_ended or canceled.' }
        plan_id: { type: string }
        plan_name: { type: string }
        days_left: { type: integer, description: Whole days left in the trial or grace; -1 otherwise. }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        cancel_at_period_end: { type: boolean }
        payment_failed: { type: boolean }
    BillingStanding:
      type: object
      required: [configured, restricted, attention, billing_url]
      properties:
        configured: { type: boolean, description: Whether a workspace can subscribe on this deployment. }
        restricted: { type: boolean, description: New domain connections are refused right now. }
        first_domain_free:
          type: boolean
          description: >-
            Present only when true: this is a new workspace on the first domain
            free rule. `restricted` is false until its free domains are
            connected, and true, with the refusal's words, after.
        free_domains:
          type: integer
          description: >-
            Present with `first_domain_free`: how many domains the workspace may
            connect before it has a subscription. One, unless the operator
            granted more.
        attention: { type: boolean, description: 'Billing needs an owner or admin: a trial or grace to act on, a failed payment, or a block.' }
        code: { type: string, description: 'Set when `restricted`: `billing_required`.' }
        title: { type: string, description: 'Set when `restricted`: what the refusal says.' }
        details: { type: string, description: 'Set when `restricted`: why, and where an owner or admin fixes it.' }
        billing_url: { type: string, description: Where an owner or admin sets up billing. }
        plan:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            hard_cap: { type: boolean, description: Whether the plan refuses new connections at its quota (when the deployment enforces quotas). }
        usage:
          type: object
          properties:
            used: { type: integer, description: Domains connected this period. }
            quota: { type: integer, description: What the plan includes per month. }
            period: { type: string, description: 'The calendar month, `YYYY-MM` (UTC).' }
    BillingStatus:
      type: object
      properties:
        tenant_id: { type: string }
        state: { $ref: '#/components/schemas/BillingState' }
        reason: { type: string }
        restricted: { type: boolean }
        first_domain_free: { type: boolean, description: 'Present only when true: a new workspace on the first domain free rule (see `GET /billing/notice`).' }
        free_domains: { type: integer, description: 'Present with `first_domain_free`: how many domains the workspace may connect before it has a subscription.' }
        attention: { type: boolean }
        setup_required: { type: boolean }
        days_left: { type: integer }
        price_cents: { type: integer, description: 'What the workspace pays per month (the Stripe amount, else the catalog price).' }
        currency: { type: string }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        grace_started_at: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        cancel_at_period_end: { type: boolean }
        ended_at: { type: [string, 'null'], format: date-time }
        comped: { type: boolean }
        comped_until: { type: [string, 'null'], format: date-time }
        payment_failed: { type: boolean }
        payment_failed_at: { type: [string, 'null'], format: date-time }
        has_billing_account: { type: boolean }
        portal_available: { type: boolean }
        can_change_plan: { type: boolean }
        mode: { type: string, enum: ['test', 'live', ''] }
        plan:
          type: object
          properties:
            id: { $ref: '#/components/schemas/PlanId' }
            name: { type: string }
            price_cents: { type: integer }
            public_price: { type: boolean }
            domains_per_year: { type: integer }
            domains_per_month: { type: integer }
            hard_cap: { type: boolean }
