# Customdomain public API contract (/v1).
#
# This vendored spec is the SINGLE SOURCE OF TRUTH for the Fumadocs API
# reference: every page under src/content/docs/api-reference/** is generated
# from THIS file by `npm run gen:api` (scripts/gen-api-docs.ts). It mirrors the
# routes the control-plane actually registers (services/control-plane/internal/
# api/api.go) and the machine-readable document served at GET /v1/openapi.json.
#
# Versioning: URI major (/v1), additive-only within a version.
openapi: 3.1.0
info:
  title: Customdomain Control-Plane API
  version: "1.0"
  description: >-
    APIs for connecting your customers' domains to your product:
    Connect (DNS) · Secure (SSL) · Sell (domain resale) · Monitor (DNS drift),
    plus tenancy, members, billing, and webhooks.


    Three credential types authenticate the surface. A **management key** gates
    operator/provisioning routes. A tenant **API key** (`sk_live_…` / `sk_test_…`)
    is the long-lived server-to-server credential. A short-lived **widget JWT**,
    minted server-side via `POST /v1/tokens`, authorizes the browser widget and
    is scoped to one application (and optionally one domain).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://api.customdomain.ai/v1
    description: Hosted control-plane
  - url: http://localhost:8080/v1
    description: Local control-plane
security:
  - apiKey: []
tags:
  - name: Tenancy
    description: Operator provisioning — tenants and one-call signup.
  - name: Applications
    description: Applications and their long-lived API keys.
  - name: Members
    description: Multi-user tenancy — invites, roles, and membership.
  - name: Tokens
    description: Minting short-lived widget JWTs for the browser.
  - name: Domains
    description: Read-only domain / DNS-provider feature detection.
  - name: Connections
    description: The connect pipeline for one customer domain, across all four rails.
  - name: Secure
    description: Edge-managed TLS certificates (SSL) for connected domains — issue, renew, import, deprovision.
  - name: Power
    description: The edge reverse-proxy for a connection — origin, apex↔www redirect, and root-path serving.
  - name: Sharing
    description: Forward-to-a-colleague share links that resume a connect flow from a server-side prefill.
  - name: Providers
    description: The DNS-provider capability catalog and parity census.
  - name: Templates
    description: One-click setup service templates and apply-URL building.
  - name: Registrar
    description: Domain search, quote, and purchase (Sell).
  - name: Monitor
    description: Checking declared records against live public DNS (drift).
  - name: Webhooks
    description: Registering receivers and inspecting delivery attempts.
  - name: Billing
    description: Plans, metered usage, checkout, and the billing portal.
  - name: Enterprise
    description: RBAC reference matrix and the audit log.
  - name: Meta
    description: Public service discovery and capability advertisement.

paths:
  # ------------------------------------------------------------------ Tenancy
  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      tags: [Tenancy]
      description: Operator provisioning endpoint. Requires the management key in production.
      security:
        - managementKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant
      tags: [Tenancy]
      security:
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants:provision:
    post:
      operationId: provisionTenant
      summary: One-call signup provisioning (tenant + owner + app + API key)
      tags: [Tenancy]
      description: >-
        Atomically creates a tenant, its first owner member, a default
        application, and a long-lived API key. `api_key` and `client_secret` are
        returned ONCE. Guarded by the dedicated provision secret (the
        `X-Provision-Secret` header or a Bearer token) so the customer console's
        server can hold this narrow secret instead of the operator management key.
      security:
        - provisionSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_name]
              properties:
                tenant_name: { type: string }
                app_name: { type: string }
                owner_email: { type: string }
                environment: { $ref: '#/components/schemas/Environment' }
      responses:
        '201':
          description: Provisioned (api_key + client_secret shown once)
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, application_id, api_key, client_secret]
                properties:
                  tenant_id: { type: string }
                  application_id: { type: string }
                  api_key: { type: string, description: 'sk_live_… / sk_test_… — shown once' }
                  client_secret: { type: string, description: mints widget JWTs; shown once }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------- Applications
  /applications:
    post:
      operationId: createApplication
      summary: Create an application (client_secret returned once)
      tags: [Applications]
      description: >-
        Accepts the management key (the body `tenant_id` selects the tenant) or a
        tenant-scoped `sk_` API key (the app is always created in the key's own
        tenant; any body `tenant_id` is ignored).
      security:
        - managementKey: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name]
              properties:
                tenant_id: { type: string }
                name: { type: string }
                environment: { $ref: '#/components/schemas/Environment' }
      responses:
        '201':
          description: Created (client_secret present only here)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Application' }
                  - type: object
                    properties:
                      client_secret: { type: string, description: mints widget JWTs; shown once }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      operationId: listApplications
      summary: List applications
      tags: [Applications]
      description: >-
        With an `sk_` API key: the caller's own tenant's apps. With the
        management key: `?tenant_id=` selects the tenant.
      security:
        - apiKey: []
        - managementKey: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
          description: Required only when listing with the management key.
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: object
                required: [applications, count]
                properties:
                  applications:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /applications/{id}:
    get:
      operationId: getApplication
      summary: Get an application
      tags: [Applications]
      security:
        - managementKey: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /applications/{id}/keys:
    post:
      operationId: createApiKey
      summary: Issue an API key for an application (key returned once)
      tags: [Applications]
      security:
        - apiKey: []
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                environment: { $ref: '#/components/schemas/Environment' }
      responses:
        '201':
          description: Created; the full secret is present only in this response
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiKey' }
                  - type: object
                    properties:
                      key: { type: string, description: 'sk_live_… / sk_test_… — shown once, stored hashed' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      operationId: listApiKeys
      summary: List an application's API keys (secrets omitted)
      tags: [Applications]
      security:
        - apiKey: []
        - managementKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Keys (metadata only — the secret is never returned again)
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /applications/{id}/keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags: [Applications]
      security:
        - apiKey: []
        - managementKey: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Members
  /members:
    post:
      operationId: inviteMember
      summary: Invite a member to the caller's tenant (invite_token shown once)
      tags: [Members]
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      operationId: listMembers
      summary: List the caller tenant's members
      tags: [Members]
      security:
        - apiKey: []
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
  /members:accept:
    post:
      operationId: acceptMember
      summary: Accept an invite (single-use token)
      tags: [Members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                email: { type: string, description: "When supplied, must match the invited email." }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /members/{id}:
    patch:
      operationId: updateMemberRole
      summary: Change a member's role (owner-protected)
      tags: [Members]
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      summary: Remove a member or revoke a pending invite (owner-protected)
      tags: [Members]
      security:
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------- Tokens
  /tokens:
    post:
      operationId: createWidgetToken
      summary: Exchange application credentials for a short-lived widget JWT
      tags: [Tokens]
      description: >-
        Server-side only. Trade an application's `client_secret` for a
        short-lived widget JWT the browser can use on the Connect endpoints.
        Never ship the `client_secret` or an API key to the browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id, client_secret]
              properties:
                application_id: { type: string }
                client_secret: { type: string }
                domain:
                  type: string
                  description: Optional. Binds the token to a single hostname.
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type, expires_in]
                properties:
                  token: { type: string, description: the widget JWT (Bearer) }
                  token_type: { type: string, examples: [Bearer] }
                  expires_in: { type: integer, description: lifetime in seconds (default 3600) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Domains
  /domains:check:
    post:
      operationId: checkDomain
      summary: Detect where a domain's DNS lives and how it will be set up
      tags: [Domains]
      description: >-
        Read-only feature detection. Returns the provider, the chosen
        `setup_type`, whether automatic setup is possible, whether the
        OAuth-into-provider and one-click setup rails are available, capability
        flags (`ns_support`, `wildcard_support`, `cname_flattening`,
        `spf_override_support`, `caa_support`), social-login support, and any
        `record_conflicts` observed in public DNS. Unknown providers degrade to
        `setup_type: manual`.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainCheck' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- Connections
  /connections:
    post:
      operationId: createConnection
      summary: Create a domain connection (idempotent per app + domain)
      tags: [Connections]
      description: >-
        Starts connecting `domain` under the calling application and returns the
        connection plus its authoritative desired record set. Idempotent: if the
        app already has a non-failed connection for the domain, that existing
        connection is replayed with `200`.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        '201':
          description: Connection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '200':
          description: Existing connection replayed (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      operationId: listConnections
      summary: List connections
      tags: [Connections]
      description: >-
        With an `sk_` API key: every connection across the tenant's applications
        (optional `?app_id=` and `?status=` filters). With a widget JWT: the
        calling application's connections.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters:
        - { name: app_id, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConnectionStatus' }
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [connections, count]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
  /connections/{id}:
    get:
      operationId: getConnection
      summary: Get a connection with its authoritative record set
      tags: [Connections]
      description: >-
        Returns the connection object and its records. The connection carries a
        `managed` boolean: `true` when it opted in to **managed
        mode** (the control plane holds a durable, encrypted async grant so it can
        re-apply / revert the template server-side without re-consent); `false`
        (omitted on the wire) for the default use-once connection.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: disconnectConnection
      summary: Disconnect a domain (revert managed records, then delete the connection)
      tags: [Connections]
      description: >-
        **Managed-mode offboarding + delete.** For a managed (async
        one-click) connection the control plane first **reverts** the applied template
        through the pinned provider API using the stored grant, then deletes the
        connection and all its child state (records, origin, monitor watch, managed
        grant). A non-managed connection is simply deleted. Emits
        `connection.disconnected`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: "Disconnected (grant reverted, if any, and connection deleted)" }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/records:
    get:
      operationId: getConnectionRecords
      summary: Authoritative desired DNS record set for a connection
      tags: [Connections]
      description: >-
        The single source of truth the widget renders, the OAuth callback
        writes, and the propagation poller verifies. Before records are applied,
        the default edge record is synthesized server-side.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, records]
                properties:
                  connection_id: { type: string }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/DnsRecord' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/grant:
    delete:
      operationId: disableManagedConnection
      summary: Turn managed mode OFF without disconnecting
      tags: [Connections]
      description: >-
        Drops the stored async grant and clears the connection's
        `managed` flag, leaving the connection and its applied records in place.
        The records the provider already wrote stay live; the control plane simply
        stops holding a credential to re-apply / revert them. This is **not**
        `DELETE /v1/connections/{id}` (which reverts the template at the provider
        and removes the whole connection). Idempotent: a connection that is already
        unmanaged returns `200`.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Managed mode disabled (grant dropped, managed=false, connection kept)
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, managed]
                properties:
                  connection_id: { type: string }
                  managed: { type: boolean, enum: [false] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /connections/{id}/apply:
    post:
      operationId: applyConnection
      summary: Write a connection's records through the customer's provider (BYO token, used once)
      tags: [Connections]
      description: >-
        **Rail B (API-token apply).** The scoped provider credential is used once
        to write the records and is never stored. The connection advances to
        `propagating`; the poller promotes it to `live` once the records appear
        in public DNS.
      security:
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, records]
              properties:
                provider: { type: string, description: DNS provider id; defaults to the detected provider. }
                zone: { type: string, description: DNS zone the credential manages; defaults to the connection domain. }
                credential:
                  type: object
                  required: [token]
                  properties:
                    token: { type: string, description: "Scoped provider API token; used once, never persisted." }
                records:
                  type: array
                  items: { $ref: '#/components/schemas/WritableRecord' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { $ref: '#/components/schemas/Connection' }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/DnsRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}:reapply:
    post:
      operationId: reapplyConnection
      summary: Re-apply a managed connection's desired records (async one-click, no re-consent)
      tags: [Connections]
      description: >-
        **Managed mode only.** Recomputes the connection's authoritative desired
        record set and writes any drift through the provider's async one-click
        API using the stored, encrypted grant (the provider API base pinned at
        onboarding) — the end user does **not** re-consent. On success the
        connection is re-verified and `connection.records.updated` is emitted. A
        failure emits `connection.reapply.failed`; if the provider reports the grant
        was revoked (401 kill-switch) the grant is cleared and the connection is
        flagged for re-consent.
      security:
        - widgetJWT: []
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Re-applied (records updated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionWithRecords' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "The connection is not managed, has no stored grant, or the grant was revoked; re-consent required" }
        '503': { $ref: '#/components/responses/Error' }
  /connections/{id}/oauth:start:
    post:
      operationId: startConnectionOAuth
      summary: Begin the OAuth-into-DNS-provider authorization for a connection
      tags: [Connections]
      description: >-
        **Rail C (flagship).** Returns the provider authorize URL (PKCE S256 +
        HMAC-signed single-use `state`). The widget opens it in a popup; the
        provider redirects back to `/v1/connect/oauth/callback`, which writes the
        connection's records with the one-time access token and never persists it.
      security:
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_origin]
              properties:
                provider: { type: string, description: DNS provider id; defaults to the detected provider. }
                return_origin:
                  type: string
                  description: Web origin the callback page may postMessage the outcome to; must be on the server's allowlist.
      responses:
        '200':
          description: Authorize URL
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /connect/oauth/callback:
    get:
      operationId: oauthCallback
      summary: OAuth redirect target (public; authenticated by the signed state)
      tags: [Connections]
      description: >-
        The provider's browser redirect target — **not** a bearer-authenticated
        endpoint. It consumes the signed single-use `state`, exchanges the code,
        writes the connection's records with the one-time token (discarded
        after), and returns an HTML page that postMessages
        `{ type: "customdomain:oauth", payload }` to the vetted return origin.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: HTML finish page (postMessages the outcome to the vetted return origin)
        '400':
          description: Invalid, expired, or replayed state
  /connect/dc/callback:
    get:
      operationId: dcCallback
      summary: Async one-click setup redirect target (public; authenticated by the signed state)
      tags: [Connections]
      description: >-
        **Rail A (async one-click setup) redirect target** — distinct from
        `/connect/oauth/callback` (Mode C), which discards its one-time token. It
        consumes the signed single-use `state` (rail-bound to async), exchanges the
        code for a **durable async grant** at the provider API base pinned into the
        `state` at start (never re-derived from fresh discovery), applies the
        template, and persists the **encrypted** grant so the connection can be
        re-applied / reverted server-side. Records are applied with
        `data.via = async`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: HTML finish page (postMessages the outcome to the vetted return origin)
        '400':
          description: Invalid, expired, replayed, or wrong-rail state
  /connections/{id}/domainconnect:start:
    post:
      operationId: startDomainConnect
      summary: Build the one-click apply URL (sync) or start the managed async rail
      tags: [Connections]
      description: >-
        **Rail A (one-click sync-redirect) by default.** `service_id` may be
        omitted when a default/sole template is loaded; the response carries the
        provider-hosted `apply_url`, the resolved `service_id`, and the discovered
        `dc_provider` name. Set `managed: true` (or `rail: "async"`) to request the
        managed async rail instead — when the provider supports it the response
        carries a `consent_url` and `rail: "async"` (and the grant lets the control
        plane re-apply / revert server-side without re-consent). `service_ids`
        (plural) bundles several templates under one managed consent (async only;
        the OAuth scope is the space-separated list and the callback applies each);
        on the sync fallthrough only the first template applies.
      security:
        - widgetJWT: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id: { type: string }
                service_ids:
                  type: array
                  items: { type: string }
                  description: >-
                    Bundle of templates to authorize under one managed consent
                    (async rail only). Wins over `service_id` when set.
                host: { type: string }
                vars:
                  type: object
                  additionalProperties: { type: string }
                managed:
                  type: boolean
                  description: Opt into the managed (async) one-click rail.
                rail:
                  type: string
                  description: Set to "async" to request the managed rail (same effect as managed:true).
                return_origin:
                  type: string
                  description: >-
                    Vetted web origin the async callback finish page may
                    postMessage the outcome to; must be on the server allowlist.
      responses:
        '200':
          description: >-
            Sync rail returns `apply_url`; the managed async rail returns
            `consent_url` and `rail: "async"`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apply_url: { type: string, format: uri, description: "Sync rail: provider-hosted apply URL." }
                  consent_url: { type: string, format: uri, description: "Async rail: provider consent URL." }
                  service_id: { type: string }
                  service_ids:
                    type: array
                    items: { type: string }
                    description: "Async rail: the resolved template bundle."
                  dc_provider: { type: string }
                  rail: { type: string, description: '"async" on the managed rail; omitted on the sync rail.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------------- Sharing
  /sharing/connect:
    post:
      operationId: createSharedFlow
      summary: Mint a share link that resumes a connect flow from a server-side prefill
      tags: [Sharing]
      description: >-
        **Forward-to-a-colleague.** The widget posts the domain(s) a teammate
        should connect plus an arbitrary `prefill` (the widget config to resume);
        the control plane stores that server-side under an opaque token and returns
        the absolute `link` (ends `/share/{token}`) and a `job_id`. Every domain the
        link targets must be one the calling token may act on — a share link never
        widens a domain-bound token's reach. The link's server-side prefill is read
        back by `GET /share/{token}`, which the teammate's widget bootstraps from
        instead of a URL that carries the config in the clear. The share token
        EXPIRES 30 days after it is minted.
      security:
        - widgetJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string, description: Single domain the teammate will connect. }
                domains:
                  type: array
                  items: { type: string }
                  description: Several domains the teammate will connect.
                prefill:
                  type: object
                  additionalProperties: true
                  description: >-
                    Arbitrary widget config to resume. Served back verbatim by
                    `GET /share/{token}`, stamped with the normalized domain
                    target(s).
      responses:
        '201':
          description: Share link minted
          content:
            application/json:
              schema:
                type: object
                required: [link, job_id]
                properties:
                  link: { type: string, format: uri, description: "Absolute forwardable URL ending /share/<token>." }
                  job_id: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /share/{token}:
    get:
      operationId: getSharedFlow
      summary: Read a share link's server-side prefill (token is the bearer credential)
      tags: [Sharing]
      description: >-
        Public by design — the opaque, unguessable `token` in the path IS the
        credential (mirroring the OAuth callback's state-as-credential pattern), so
        no bearer is required. Returns the stored `prefill` so a teammate's widget
        can resume the flow. A share token EXPIRES 30 days after it is minted;
        unknown OR expired tokens are indistinguishable and both return `404`.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Shared flow prefill
          content:
            application/json:
              schema:
                type: object
                required: [token, application_id, job_id, prefill]
                properties:
                  token: { type: string }
                  application_id: { type: string }
                  job_id: { type: string }
                  prefill:
                    type: object
                    additionalProperties: true
        '404': { $ref: '#/components/responses/Error' }

