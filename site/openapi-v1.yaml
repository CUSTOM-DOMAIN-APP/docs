        `sk_` API key: all the tenant's apps. Widget JWT: the calling app.
        `?app_id=` narrows to one application; `?type=` filters by event type.
      security:
        - apiKey: []
        - widgetJWT: []
      parameters:
        - { name: app_id, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
      responses:
