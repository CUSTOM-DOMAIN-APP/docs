          properties:
            available: { type: boolean }
            trial_days: { type: integer }
            trial_end: { type: [string, 'null'], format: date-time }
            first_charge_at: { type: string, format: date-time }
            default_plan: { $ref: '#/components/schemas/PlanId' }
        usage:
          type: object
          properties:
            used: { type: integer }
            quota: { type: integer }
            period_start: { type: string, format: date-time }
            period_end: { type: string, format: date-time }
        payment_method:
          type: [object, 'null']
          description: 'The payment method the workspace is charged on, or null when Stripe holds none. A card has its brand, last four digits and expiry, and names the wallet when it was paid through Apple Pay or Google Pay. A Link account has the email of the account (Stripe never shows the card behind it). Cash App Pay has only its type.'
          properties:
            type: { type: string, enum: [card, link, cashapp] }
            brand: { type: string }
            last4: { type: string }
            exp_month: { type: integer }
            exp_year: { type: integer }
            wallet: { type: string, enum: [apple_pay, google_pay], description: 'The wallet a card was paid through, when it was.' }
            email: { type: string, description: 'The email of the Link account (type link).' }
    Invoice:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string, description: 'Stripe invoice status: draft, open, paid, uncollectible or void.' }
        amount_due_cents: { type: integer }
        amount_paid_cents: { type: integer }
        currency: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        hosted_invoice_url: { type: [string, 'null'] }
        invoice_pdf: { type: string }
    AdminBillingSummary:
      type: object
      required: [currency, mrr_cents, counts]
      properties:
        currency: { type: string }
        mrr_cents: { type: integer }
        counts:
          type: object
          required: [trialing, active, past_due, grace, blocked, comped, canceled, legacy_free]
          properties:
            trialing: { type: integer }
            active: { type: integer }
            past_due: { type: integer }
            grace: { type: integer }
            blocked: { type: integer }
            comped: { type: integer }
            canceled: { type: integer }
            legacy_free: { type: integer }
        tenants: { type: integer }
        paying: { type: integer }
        can_subscribe: { type: boolean }
        enforcement: { type: boolean, description: Whether BILLING_REQUIRE_SUBSCRIPTION is on. }
        mode: { type: string }
        trial_days: { type: integer }
        generated_at: { type: string, format: date-time }
        starter_price_on: { type: boolean }
    AdminBillingTenant:
      type: object
      required: [tenant_id, name, owner_email, plan_id, plan_name, price_cents, status, trial_ends_at, grace_ends_at,
        current_period_end, cancel_at_period_end, comped_until, stripe_customer_id, stripe_subscription_id, usage, created_at]
      properties:
        tenant_id: { type: string }
        name: { type: string }
        owner_email: { type: string }
        plan_id: { type: string }
        plan_name: { type: string }
        price_cents: { type: integer }
        status: { $ref: '#/components/schemas/BillingState' }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        cancel_at_period_end: { type: boolean }
        comped_until: { type: [string, 'null'], format: date-time }
        stripe_customer_id: { type: [string, 'null'] }
        stripe_subscription_id: { type: [string, 'null'] }
        usage:
          type: object
          properties:
            used: { type: integer }
            quota: { type: integer }
            period_start: { type: [string, 'null'], format: date-time }
            period_end: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        reason: { type: string }
        restricted: { type: boolean }
        comped: { type: boolean }
        comp_reason: { type: string }
        payment_failed: { type: boolean }
        stripe_status: { type: string }
        currency: { type: string }
        grace_started_at: { type: [string, 'null'], format: date-time }
        days_left: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
        first_domain_free:
          type: boolean
          description: >-
            The first domain free rule covers this workspace (brand new: no
            subscription and no trial yet, enforcement on). `restricted` is the
            billing state; a workspace can be `restricted` and still connect its
            free domain, which is what `can_connect_now` answers.
        free_domains: { type: integer, description: 'How many domains the workspace may connect before it has a subscription (one, unless set by `set-free-domains`); 0 when the rule does not cover it.' }
        free_domains_used: { type: integer, description: 'How many it has open now (pending, propagating or live); counted only when the rule covers it.' }
        can_connect_now: { type: boolean, description: 'Billing lets the workspace connect another domain now: the answer the connection gate gives, not a reading of `status`. The plan quota is separate (see `usage`).' }
    AdminBillingTenantDetail:
      allOf:
        - { $ref: '#/components/schemas/AdminBillingTenant' }
        - type: object
          properties:
            invoices:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  number: { type: string }
                  status: { type: string }
                  amount_due_cents: { type: integer }
                  amount_paid_cents: { type: integer }
                  currency: { type: string }
                  created_at: { type: [string, 'null'], format: date-time }
                  hosted_invoice_url: { type: [string, 'null'] }
            invoices_error: { type: string }
            events:
              type: array
              description: The billing audit trail, newest first.
              items:
                type: object
                properties:
                  at: { type: [string, 'null'], format: date-time }
                  kind: { type: string, examples: ['grace.started', 'comp.granted', 'subscription.active'] }
                  actor: { type: string, examples: ['ops@example.com', 'owner dashboard', 'stripe:webhook', 'system:sweeper'] }
                  detail: { type: object }
            notices:
              type: array
              description: The billing email log, newest first.
              items:
                type: object
                properties:
                  kind: { type: string }
                  key: { type: string }
                  status: { type: string, enum: [pending, sent, failed, skipped] }
                  attempts: { type: integer }
                  error: { type: [string, 'null'] }
                  created_at: { type: [string, 'null'], format: date-time }
                  sent_at: { type: [string, 'null'], format: date-time }
            previous_status: { $ref: '#/components/schemas/BillingState' }
    PromoCode:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        active: { type: boolean }
        coupon:
          type: object
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
            percent_off: { type: [number, 'null'] }
            amount_off_cents: { type: [integer, 'null'] }
            currency: { type: [string, 'null'] }
            duration: { type: string, enum: [once, repeating, forever] }
            duration_in_months: { type: [integer, 'null'] }
            valid: { type: boolean }
        max_redemptions: { type: [integer, 'null'] }
        times_redeemed: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
        first_time_transaction: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        created_here: { type: boolean, description: Created from the owner dashboard (as opposed to elsewhere on the shared Stripe account). }
    SetupType:
      type: string
      description: How a connection reaches live.
      enum: [automatic, manual, async, mcp]
    ConnectionStatus:
      type: string
      enum: [pending, propagating, live, failed]
    Tenant:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Application:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        default_origin: { type: string }
        connect_target: { $ref: '#/components/schemas/ConnectTarget' }
        sandbox:
          type: boolean
          description: >-
            `true` for a **test mode** application, made with `"sandbox": true`
            on `POST /applications`. It runs the whole connect flow end to end
            (the widget, the API, webhooks) against simulated DNS, on
            reserved `.test` names only, and never touches a real domain, the
            free domain, the quota or billing. Fixed when the application is
            created. Omitted (treated as `false`) on a live application.
        created_at: { type: string, format: date-time }
    ConnectTarget:
      type: object
      required: [cname_target]
      properties:
        cname_target: { type: string }
        apex_ipv4:
          type: array
          items: { type: string }
    ConnectTargetView:
      type: object
      required: [application_id, mode, edge]
      properties:
        application_id: { type: string }
        mode: { type: string, enum: [edge, custom] }
        connect_target:
          oneOf:
            - { $ref: '#/components/schemas/ConnectTarget' }
            - { type: 'null' }
        edge:
          type: object
          properties:
            cname_target: { type: string }
            apex_ipv4:
              type: array
              items: { type: string }
    ConnectionDiagnosis:
      type: object
      required: [connection_id, domain, zone, status, all_found, records, issues]
      properties:
        connection_id: { type: string }
        domain: { type: string }
        zone: { type: string, description: The DNS zone a panel manages (the registrable domain). }
        provider: { type: string }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        checked_at: { type: string, format: date-time }
        all_found: { type: boolean }
        found_count: { type: integer }
        total: { type: integer }
        next_check_seconds: { type: integer }
        records:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              host: { type: string }
              name: { type: string, description: 'What to type in the Name/Host field ("@" for the root).' }
              value: { type: string }
              ttl: { type: integer }
              priority: { type: integer }
              status: { type: string, enum: [found, missing, mismatch, unverifiable] }
              observed:
                type: array
                items: { type: string }
              observed_label: { type: string }
              at_provider: { type: boolean }
        issues:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [doubled_host, cloudflare_proxied, aaaa_conflict, extra_a_records, conflicting_record, caa_blocks] }
              severity: { type: string, enum: [blocking, warning] }
              name: { type: string }
              host: { type: string }
              observed:
                type: array
                items: { type: string }
              message: { type: string }
    ConnectAnalytics:
      type: object
      required: [window, widget, connections, daily, truncated]
      properties:
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            days: { type: integer }
            application_id: { type: string }
        widget:
          type: object
          properties:
            sessions: { type: integer }
            entered_domain: { type: integer }
            analyzed: { type: integer }
            offered_automatic: { type: integer }
            shown_manual: { type: integer }
            succeeded: { type: integer }
            succeeded_automatic: { type: integer }
            errored: { type: integer }
            conversion_rate: { type: number }
            median_seconds_to_success: { type: integer }
            drop_off: { type: array, items: { $ref: '#/components/schemas/AnalyticsCount' } }
            errors: { type: array, items: { $ref: '#/components/schemas/AnalyticsCount' } }
            providers:
              type: array
              items:
                type: object
                properties:
                  provider: { type: string }
                  sessions: { type: integer }
                  succeeded: { type: integer }
                  automatic: { type: integer }
            domain_kinds:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string }
                  sessions: { type: integer }
                  succeeded: { type: integer }
        connections:
          type: object
          properties:
            total: { type: integer }
            live: { type: integer }
            pending: { type: integer }
            propagating: { type: integer }
            failed: { type: integer }
            live_rate: { type: number }
            median_seconds_to_live: { type: integer }
            by_provider:
              type: array
              items:
                type: object
                properties:
                  provider: { type: string }
                  total: { type: integer }
                  live: { type: integer }
                  pending: { type: integer }
                  failed: { type: integer }
            by_method: { type: array, items: { $ref: '#/components/schemas/AnalyticsGroup' } }
            by_kind: { type: array, items: { $ref: '#/components/schemas/AnalyticsGroup' } }
            stuck: { type: array, items: { $ref: '#/components/schemas/AnalyticsCount' } }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              sessions: { type: integer }
              succeeded: { type: integer }
              created: { type: integer }
              went_live: { type: integer }
        truncated: { type: boolean }
    AnalyticsCount:
      type: object
      properties:
        key: { type: string }
        count: { type: integer }
    AnalyticsGroup:
      type: object
      properties:
        key: { type: string }
        total: { type: integer }
        live: { type: integer }
    TrafficStatusCounts:
      type: object
      description: Requests by the status class of the answer the visitor got.
      required: [1xx, 2xx, 3xx, 4xx, 5xx]
      properties:
        1xx: { type: integer, description: 'Mostly 101 Switching Protocols (websockets).' }
        2xx: { type: integer }
        3xx: { type: integer, description: Includes the edge's own redirects (redirect_to and the www redirect). }
        4xx: { type: integer, description: 'Includes 421 answered by the edge when the domain has no origin set.' }
        5xx: { type: integer, description: 'Includes 502 answered by the edge when the origin could not be reached.' }
    TrafficLatency:
      type: object
      description: The origin's time to first response byte, in milliseconds, over the requests that reached it.
      required: [p50, p95, p99, mean, samples]
      properties:
        p50: { type: number }
        p95: { type: number }
        p99: { type: number, description: 'Estimated from a fixed histogram; anything slower than 10 seconds reads as 10000.' }
        mean: { type: number }
        samples: { type: integer }
    TrafficRetention:
      type: object
      required: [hourly_days, daily_days]
      properties:
        hourly_days: { type: integer, description: How long hourly figures are kept. }
        daily_days: { type: integer, description: How long daily figures are kept. }
    ConnectionTraffic:
      type: object
      required: [connection_id, domain, range, granularity, from, to, serving, last_request_at, totals, series, retention]
      properties:
        connection_id: { type: string }
        domain: { type: string }
        range: { type: string, enum: [24h, 7d, 30d, 90d] }
        granularity: { type: string, enum: [hour, day] }
        from: { type: string, format: date-time, description: Start of the first bucket. }
        to: { type: string, format: date-time, description: End of the last bucket (exclusive); the last bucket is the current one. }
        serving:
          type: object
          required: [through_edge, reason]
          properties:
            through_edge: { type: boolean, description: Whether this domain's visitors reach the edge. }
            reason: { type: string, enum: [live, verifying, not_live, dns_only] }
        last_request_at: { type: [string, 'null'], format: date-time, description: End of the last minute in which the edge served this domain; null when never (within retention). }
        totals:
          type: object
          required: [requests, status, bytes_out, error_rate, latency_ms, visitors]
          properties:
            requests: { type: integer }
            status: { $ref: '#/components/schemas/TrafficStatusCounts' }
            bytes_out: { type: integer, description: Response body bytes relayed to visitors. }
            error_rate: { type: number, description: 'Share of requests answered with a 5xx, 0 to 1.' }
            latency_ms: { oneOf: [ { $ref: '#/components/schemas/TrafficLatency' }, { type: 'null' } ] }
            visitors: { type: integer, description: 'Approximate unique visitors; one seen on two UTC days counts once on each.' }
        series:
          type: array
          items:
            type: object
            required: [t, requests, status, bytes_out, error_rate, latency_ms, visitors]
            properties:
              t: { type: string, format: date-time, description: Bucket start. }
              requests: { type: integer }
              status: { $ref: '#/components/schemas/TrafficStatusCounts' }
              bytes_out: { type: integer }
              error_rate: { type: number }
              latency_ms: { oneOf: [ { $ref: '#/components/schemas/TrafficLatency' }, { type: 'null' } ] }
              visitors: { type: integer }
        retention: { $ref: '#/components/schemas/TrafficRetention' }
    TrafficSummary:
      type: object
      required: [application_id, range, granularity, from, to, totals, series, top_domains, retention]
      properties:
        application_id: { type: string, description: The application the summary is narrowed to; empty for the whole workspace. }
        range: { type: string, enum: [24h, 7d, 30d, 90d] }
        granularity: { type: string, enum: [hour, day] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totals:
          type: object
          required: [requests, status, bytes_out, error_rate, domains_with_traffic]
          properties:
            requests: { type: integer }
            status: { $ref: '#/components/schemas/TrafficStatusCounts' }
            bytes_out: { type: integer }
            error_rate: { type: number }
            domains_with_traffic: { type: integer, description: How many domains the edge served at least once in the range. }
        series:
          type: array
          items:
            type: object
            required: [t, requests, status, bytes_out, error_rate]
            properties:
              t: { type: string, format: date-time }
              requests: { type: integer }
              status: { $ref: '#/components/schemas/TrafficStatusCounts' }
              bytes_out: { type: integer }
              error_rate: { type: number }
        top_domains:
          type: array
          description: The busiest domains, most requests first.
          items:
            type: object
            required: [connection_id, domain, application_id, requests, status, bytes_out, error_rate, share, last_request_at]
            properties:
              connection_id: { type: string }
              domain: { type: string }
              application_id: { type: string }
              requests: { type: integer }
              status: { $ref: '#/components/schemas/TrafficStatusCounts' }
              bytes_out: { type: integer }
              error_rate: { type: number }
              share: { type: number, description: 'This domain''s part of the scope''s requests, 0 to 1.' }
              last_request_at: { type: [string, 'null'], format: date-time }
        retention: { $ref: '#/components/schemas/TrafficRetention' }
    ApiKey:
      type: object
      required: [id, application_id, name, prefix, environment, is_default, created_at]
      properties:
        id: { type: string }
        application_id: { type: string, description: The application the key belongs to. }
        name: { type: string }
        prefix: { type: string, description: 'The stored, non-secret prefix that identifies the key, for example cd_live_ab12cd34.' }
        environment: { $ref: '#/components/schemas/Environment' }
        scopes: { type: array, items: { type: string } }
        is_default: { type: boolean, description: 'true on the workspace default key (at most one active per workspace).' }
        last_used_at: { type: string, format: date-time, description: When the key last authenticated a request. Absent until it has been used. }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, description: When the key was revoked. Absent while the key is active. }
    DefaultApiKey:
      type: object
      required: [key_id, prefix, created]
      properties:
        key_id: { type: string }
        prefix: { type: string, description: 'The stored, non-secret prefix, for example cd_live_ab12cd34.' }
        created: { type: boolean, description: 'true when this call minted the key; api_key is present only then.' }
        api_key: { type: string, description: 'The full secret, cd_live_… or cd_test_…; shown once.' }
    Member:
      type: object
      required: [id, tenant_id, email, role, status, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status:
          type: string
          enum: [active, pending, expired]
          description: '`active` once accepted, `pending` while the invite link works, `expired` once it has lapsed.'
        invited_by: { type: string, description: 'The accepting user''s id in the calling application, when one was supplied at accept.' }
        inviter_email: { type: string, description: 'Who sent (or last re-sent) the invite, resolved from the sending credential.' }
        inviter_name: { type: string, description: 'The sender''s display name, when one was supplied.' }
        invite_sent_at: { type: string, format: date-time, description: When the current invite link was issued. }
        invite_expires_at: { type: string, format: date-time, description: When the current invite link stops working. Absent for members never invited by link. }
        invite_token:
          type: string
          description: >-
            The single-use invite token. Present only in the invite, resend and
            get-invite responses, never in the roster.
        accepted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitePreview:
      type: object
      required: [status, email, role, tenant_id, workspace_name]
      properties:
        status:
          type: string
          enum: [pending, accepted, expired, revoked, replaced]
          description: >-
            `pending`: the link works. `accepted`: it was used. `expired`: it
            lapsed. `revoked`: an admin withdrew the invite. `replaced`: a newer
            invite was sent to the same address.
        email: { type: string, description: The invited address. }
        role: { $ref: '#/components/schemas/Role' }
        tenant_id: { type: string }
        workspace_name: { type: string, description: The tenant's display name. }
        inviter_name: { type: string }
        inviter_email: { type: string }
        invited_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When the link stops (or stopped) working. Absent when it never expires. }
    DnsRecord:
      type: object
      required: [type, host, value]
      properties:
        type:
          type: string
          examples: [CNAME, APEXCNAME, A, AAAA, TXT, MX]
          description: >-
            DNS record type. `APEXCNAME` is the engine's provider-agnostic
            CNAME-at-the-apex type (a plain CNAME is illegal at a zone apex);
            it is realized to the host's native ALIAS / ANAME / flattened-CNAME
            on write, and shown to users as `ALIAS` in manual instructions.
        host: { type: string, description: fully-qualified record name }
        value: { type: string }
        ttl: { type: integer, default: 3600 }
        priority: { type: [integer, 'null'], description: MX only }
        applied: { type: boolean, description: true once written through a provider }
        change:
          type: string
          enum: [created, added, replaced, merged, existing]
          description: >-
            What writing this record did to its name, recorded when we wrote it
            through a provider API. `created`: nothing of this type was there.
            `added`: our value joined a shared TXT or CAA set and the values
            already there were kept. `replaced`: the values of this type at the
            name were replaced (`prior` holds them). `merged`: an SPF policy was
            merged with the one already there (`prior` holds the original).
            `existing`: our exact value was already there, so removing the
            domain leaves it.
            Omitted when not recorded (a manual or one-click setup, or a record
            written before this was recorded).
        prior:
          type: array
          description: >-
            The values this record replaced, so removing the domain can put them
            back. Omitted when nothing was replaced or it is unknown.
          items: { $ref: '#/components/schemas/PriorValue' }
        prior_source:
          type: string
          enum: [provider, public_dns]
          description: >-
            Where `prior` was read: `provider` (through the provider's API right
            before the write) or `public_dns` (observed in public DNS before the
            change). Omitted when unknown.
    PriorValue:
      type: object
      required: [type, value]
      properties:
        type: { type: string }
        value: { type: string }
        ttl: { type: integer }
        priority: { type: integer }
    RemovalRecord:
      type: object
      required: [type, host, name, value, change, action]
      properties:
        type: { type: string, description: 'The type as a DNS panel shows it (ALIAS, A, CNAME, TXT, MX, CAA).' }
        host: { type: string, description: fully-qualified record name }
        name: { type: string, description: 'the name a DNS panel wants ("@", "www", "_dmarc")' }
        value: { type: string }
        ttl: { type: integer }
        priority: { type: integer }
        change:
          type: string
          enum: [created, added, replaced, merged, existing, unknown]
          description: What writing the record did to its name (see `DnsRecord.change`).
        action:
          type: string
          enum: [delete, remove_value, restore, keep]
          description: >-
            What a removal does with it: `delete` our value, take our value out
            of a shared TXT or CAA set (`remove_value`), put back what it
            replaced (`restore`), or `keep` it (another connected domain uses
            it, it was already there before we wrote it, or it is an SPF policy
            whose original we do not know).
        prior:
          type: array
          items: { $ref: '#/components/schemas/PriorValue' }
        prior_source: { type: string, enum: [provider, public_dns] }
        note: { type: string }
    RemovalPlan:
      type: object
      required: [connection_id, domain, connected_via, access, record_removal, default_choice, records_in_use_elsewhere, records, manual_steps, teardown]
      properties:
        connection_id: { type: string }
        domain: { type: string }
        provider: { type: string }
        provider_name: { type: string }
        connected_via:
          type: string
          description: The rail that wrote the records (see `Connection.write_rail`), `manual` when none did, or `unknown_api` for an older connection written through a provider API.
        access:
          type: string
          enum: [kept, one_time, none]
          description: What access we hold now.
        access_detail: { type: string }
        record_removal:
          type: string
          enum: [automatic, partial, reauthorize, manual, in_use, not_needed]
          description: >-
            What choosing `remove` can do: `automatic` with the access we
            kept; `partial` (some automatically, the rest by hand: a Domain
            Connect revert cannot restore a replaced value, and the Route 53
            access role cannot delete); `reauthorize` (one more sign-in or key,
            see `reauthorize`); `manual` (only by hand, see `manual_steps`);
            `in_use` (another connection still serves the domain, so the
            records stay); `not_needed` (nothing was added).
        default_choice:
          type: string
          enum: [remove, keep]
          description: >-
            The choice to offer first: `remove` when it can run without the
            person (automatic or partial), `keep` otherwise. A `DELETE` without
            a records choice keeps its original behaviour instead (see
            `DELETE /connections/{id}`).
        reauthorize:
          type: object
          properties:
            methods:
              type: array
              items: { type: string, enum: [sign_in, api_key] }
            provider: { type: string }
            flow: { type: string }
            regions: { type: array, items: { type: string } }
        records_in_use_elsewhere: { type: boolean }
        records:
          type: array
          items: { $ref: '#/components/schemas/RemovalRecord' }
        manual_steps:
          type: array
          items: { type: string }
          description: The exact steps to remove the records by hand, in order.
        notes:
          type: array
          items: { type: string }
        teardown:
          type: array
          items: { type: string }
          description: What always happens, whatever the choice.
        removal_started_at:
          type: string
          format: date-time
          description: Set while a removal of the domain is running.
        removed:
          type: boolean
          description: >-
            True once the domain is removed: the connection is gone and
            `result` is what the removal did with its records.
        removed_at: { type: string, format: date-time }
        result: { $ref: '#/components/schemas/RemovalOutcome' }
    RemovalOutcome:
      type: object
      required: [choice, outcome]
      properties:
        choice: { type: string, enum: [remove, keep] }
        outcome:
          type: string
          enum: [removed, partly_removed, kept, manual, in_use, not_needed, failed]
        via: { type: string }
        removed: { type: array, items: { $ref: '#/components/schemas/RemovalResult' } }
        restored: { type: array, items: { $ref: '#/components/schemas/RemovalResult' } }
        left_in_place: { type: array, items: { $ref: '#/components/schemas/RemovalResult' } }
        failed: { type: array, items: { $ref: '#/components/schemas/RemovalResult' } }
        manual_steps: { type: array, items: { type: string } }
    RemovalResult:
      type: object
      required: [type, name, value]
      properties:
        type: { type: string }
        name: { type: string }
        value: { type: string }
        note: { type: string }
    CertificateView:
      type: object
      required: [host, status, managed]
      properties:
        host: { type: string }
        status:
          type: string
          enum: [issued, renewing, failed, pending, revoked, not_reported]
          description: >-
            `issued`: a valid certificate. `renewing`: renewing keeps failing
            while the current certificate still serves (`last_error` says
            why). `failed`: no valid certificate. `not_reported`: the edge
            has not reported one yet.
        issuer: { type: string, description: "The issuing CA certificate's name, for example R11 or E6 (Let's Encrypt)." }
        issued_at: { type: string, format: date-time }
        renewed_at: { type: string, format: date-time }
        not_before: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        days_left: { type: integer }
        next_renewal_at:
          type: string
          format: date-time
          description: When the edge starts renewing (about 30 days before expiry). Omitted while a failing renewal is being retried.
        last_error: { type: string }
        failing_since: { type: string, format: date-time }
        failure_count: { type: integer }
        managed: { type: boolean }
        attention:
          type: string
          enum: [failed, renewal_failing, expired, expiring]
        updated_at: { type: string, format: date-time }
    DomainEvent:
      type: object
      required: [id, domain, kind, created_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        connection_id: { type: string }
        domain: { type: string }
        kind:
          type: string
          description: >-
            One of connection.disconnected, records.removed,
            certificate.issued, certificate.renewed, certificate.failed,
            certificate.expiring, certificate.removed, drift.found,
            drift.fixed, drift.fix_failed, drift.action_required,
            drift.restored, access.granted, access.revoked,
            access.needs_reconnect.
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AccountConnection:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        domain: { type: string }
        status: { type: string }
    ProviderAccount:
      type: object
      required: [id, kind, provider, provider_name, label, access, scope, domains, credential_held, status, connections, uses, can_manage, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [api_key] }
        provider: { type: string }
        provider_name: { type: string }
        label: { type: string }
        access: { type: string, enum: [continuous, one_time] }
        scope: { type: string, enum: [all, selected] }
        domains:
          type: array
          description: The selected zones (scope `selected`).
          items: { type: string }
        credential_held: { type: boolean, description: "Whether the key is still kept and usable (false for a one time account past its hour). The key itself is never returned." }
        status: { type: string, enum: [active, used, expired, needs_reconnect] }
        last_error: { type: string }
        created_by: { type: string }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When a one time account's key is deleted at the latest. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        connections:
          type: array
          items: { $ref: '#/components/schemas/AccountConnection' }
        uses:
          type: array
          description: What the account's access is used for.
          items: { type: string }
        can_manage:
          type: boolean
          description: >-
            Whether the caller may change the account's access, scope or
            domains, connect domains with it and replace its key: an admin,
            an owner, or the member who connected it.
    ConnectionServices:
      type: object
      required: [connection_id, application_id, domain, status, access, services, active_count]
      properties:
        connection_id: { type: string }
        application_id: { type: string }
        domain: { type: string }
        status: { type: string }
        provider: { type: string }
        provider_name: { type: string }
        access:
          type: object
          required: [mode, detail, connected_via]
          properties:
            mode:
              type: string
              enum: [kept, one_time, none]
              description: >-
                `kept`: CustomDomain™ holds continuous access (the zone it
                hosts, a kept sign-in or Domain Connect grant, a continuous
                provider account, the Route 53 access role). `one_time`: the
                records were written with access that was not kept. `none`:
                a person or the provider wrote them.
            via: { type: string, enum: [managed_dns, sign_in, domain_connect, provider_account, route53_role] }
            detail: { type: string }
            connected_via: { type: string, description: The rail that wrote the records. }
        services:
          type: array
          items:
            type: object
            required: [id, name, active, state, detail]
            properties:
              id:
                type: string
                enum: [dns_connect, managed_dns, edge, tls, power, monitoring, auto_repair, redirects, email_records, caa]
              name: { type: string }
              active: { type: boolean }
              state: { type: string, enum: [active, pending, attention, paused, inactive] }
              detail: { type: string }
              since: { type: string, format: date-time }
        active_count: { type: integer }
    DriftRecord:
      type: object
      required: [subdomain, type, verdict, expected]
      properties:
        subdomain: { type: string, description: The record's name relative to the domain ("@" for the domain itself). }
        type: { type: string }
        verdict: { type: string, enum: [record_missing, record_changed] }
        expected:
          type: array
          items: { type: string }
        observed:
          type: array
          items: { type: string }
    MonitorView:
      type: object
      required: [connection_id, domain, watched, active, every, last_checked_at, result, drift, checked, repair, alerts]
      properties:
        connection_id: { type: string }
        domain: { type: string }
        watched: { type: boolean }
        active: { type: boolean }
        every: { type: string, description: How often the domain is checked (hour). }
        last_checked_at: { type: [string, 'null'], format: date-time }
        next_check_at: { type: string, format: date-time }
        result:
          type: string
          enum: [ok, drift, inconclusive, not_checked, not_watched]
          description: >-
            The last check. `drift` is only reported after a second,
            independent look at the zone's own nameservers confirmed it;
            `inconclusive` means the lookup did not answer and the previous
            finding stands.
        drift_since: { type: string, format: date-time }
        drift:
          type: array
          items: { $ref: '#/components/schemas/DriftRecord' }
        checked: { type: integer, description: Records compared in the last check. }
        error: { type: string }
        action:
          type: object
          description: >-
            What was done about the drift: `auto_fixed` (put back),
            `fix_failed` (the repair failed, did not hold, or the records were
            put back 3 times in 24 hours and disappeared again) or
            `action_required` (left for the tenant).
          properties:
            kind: { type: string, enum: [auto_fixed, fix_failed, action_required] }
            at: { type: string, format: date-time }
            description: { type: string }
        attention:
          type: string
          enum: [action_required, fix_failed, drift]
          description: Set while drift needs the tenant (action_required, fix_failed) or is being repaired (drift).
        repair:
          type: object
          required: [automatic, detail]
          properties:
            automatic: { type: boolean, description: True when CustomDomain™ holds continuous access and puts disappeared records back itself. }
            paused:
              type: boolean
              description: >-
                True when CustomDomain™ holds the access (`via`) but this
                deployment has automatic repair switched off
                (`MONITOR_AUTO_REPAIR`): missing records are reported, not put
                back. Omitted otherwise.
            via: { type: string, enum: [managed_dns, sign_in, domain_connect, provider_account] }
            detail: { type: string }
        alerts:
          type: object
          properties:
            webhooks: { type: boolean }
            email: { type: boolean }
        watching:
          type: array
          description: The records the domain is held to.
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              value: { type: string }
        history:
          type: array
          items: { $ref: '#/components/schemas/DomainEvent' }
    DisconnectResult:
      type: object
      required: [connection_id, domain, disconnected, records, serving, certificate, monitoring]
      properties:
        connection_id: { type: string }
        domain: { type: string }
        disconnected: { type: boolean }
        records: { $ref: '#/components/schemas/RemovalOutcome' }
        serving: { type: string, enum: [stopped] }
        certificate: { type: string, enum: [removed, kept, none] }
        monitoring: { type: string, enum: [stopped] }
    WritableRecord:
      type: object
      required: [type, value]
      properties:
        type: { type: string, examples: [CNAME, A, AAAA, TXT, MX, SPFM] }
        host: { type: string, description: "relative label, apex, or fully-qualified" }
        value: { type: string }
        ttl: { type: integer, default: 3600 }
        priority: { type: integer, description: MX only }
        essential: { type: boolean, description: fail the apply if this record cannot be written }
    Connection:
      type: object
      required: [id, domain, setup_type, status]
      properties:
        id: { type: string }
        application_id: { type: string }
        domain: { type: string }
        host: { type: string, description: subdomain label; empty means the apex }
        provider_id: { type: string, description: detected / applied DNS provider }
        setup_type: { $ref: '#/components/schemas/SetupType' }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        managed:
          type: boolean
          description: >-
            `true` when the connection opted into **managed mode**:
            the control plane holds a durable, encrypted async grant and can
            re-apply (`POST /v1/connections/{id}:reapply`) or revert
            (`DELETE /v1/connections/{id}`) the template server-side without
            re-consent. Omitted (treated as `false`) for the default use-once
            connection.
        created_at: { type: string, format: date-time }
        sandbox:
          type: boolean
          description: >-
            `true` when the connection belongs to a test mode application. Its
            DNS is simulated, nothing real is read, written or served, and it
            counts for nothing (no free domain, quota, billing or metering).
            Copied from the application at create and never changed. Omitted
            (treated as `false`) on a real connection.
        last_checked_at:
          type: string
          format: date-time
          description: >-
            When the propagation poller last examined this connection. Omitted
            until the first check.
        # --- Config flags echoed back from create (always present) ---
        # These five carry no omitempty on the wire, so they are on EVERY
        # connection response, `false` included.
        www_redirect: { type: boolean, description: Serve an apex↔www redirect. Echoed from create. }
        override_spf: { type: boolean, description: 'Replace an existing SPF record instead of merging into it, where the provider supports it. Echoed from create.' }
        validate_dmarc: { type: boolean, description: Stored and echoed from create; not acted on yet. }
        validate_caa: { type: boolean, description: 'Whether the Let''s Encrypt CAA records are part of the desired record set. Echoed from create.' }
        monitor:
          type: boolean
          default: true
          description: >-
            Whether the domain is enrolled in drift monitoring. Echoed from
            create, where it defaults to true when omitted, and honoured: the
            drift watch is registered when the connection goes live only if this
            is true. Connections created before the flag was honoured read true
            (they were monitored unconditionally, and were backfilled), so this
            is false only where a caller explicitly opted out.
        batch_id:
          type: string
          description: >-
            The multi-domain session this connection was created in. Omitted for
            a standalone connect.
        end_user_ref:
          type: string
          description: >-
            The integrator's own identifier for the end user who connected this
            domain. Omitted for a console/direct connect.
        retried_at:
          type: string
          format: date-time
          description: >-
            When a human (or the create-path resume, or real edge traffic) last
            asked for this connection to be re-verified. The retry clock is
            max(created_at, retried_at): a revived connection gets a fresh
            window from here, not from its original creation. Absent when it
            was never retried.
        records_source:
          type: string
          enum: [integrator]
          description: >-
            Present as `integrator` when the connection's desired record set was
            supplied through `PUT /v1/connections/{id}/records` rather than
            authored by us. Omitted for the usual server-synthesized or Domain
            Connect template-materialized set. Such a connection cannot use the
            Domain Connect rail, which applies our published templates at the
            provider.
        created_via:
          type: string
          enum: ['', widget, console, api, agent, mcp]
          description: >-
            Where the connection was created, recorded once at create and never
            changed. `widget`: an end user's connect-scoped widget token (the
            embedded widget in your product). `console`: the CustomDomain™
            console. `api`: an API key, or an app-scoped token, from your
            server. `agent`: a delegated agent access token. `mcp`: the MCP
            server. Empty for connections created before this was recorded.
            A trusted server-side caller may name its surface with the
            `X-CustomDomain-Client` request header (`console` or `mcp`); the
            header is a label only and grants nothing.
        # --- Secure / Power config (set via /ssl and /power, not at create) ---
        secure_root_domain:
          type: boolean
          description: >-
            The edge also issues/secures the registrable apex alongside this
            subdomain connection. Omitted (treated as `false`) when unset.
        redirect_to:
          type: string
          format: uri
          description: >-
            URL the edge 301s this host to (Power redirect target). Omitted when
            the connection is not a redirect.
        power_root_path_access:
          type: array
          items: { type: string }
          description: >-
            URL paths the edge may static-serve at the root (Power root-path
            access). Omitted when none are configured.
        # --- Failure diagnosis ---
        error_code:
          type: string
          description: >-
            The last failure reason recorded for this connection, from whichever
            path failed, not only the background poller. It is persisted by:
            the propagation poller / `:recheck` verification (e.g.
            `propagation_timeout`, `setup_incomplete`, `domain_already_connected`);
            the foreground apply on `POST /connections/{id}/apply` (e.g.
            `dns_write_failed`, `ProviderAuthenticationError`, `spf_merge_failed`,
            `apex_not_supported`, `forwarding_not_supported`); the OAuth callback
            (which also records `forwarding_not_supported`); and the Domain Connect
            async callback (both e.g. `provider_unavailable`,
            `ProviderAuthenticationError`, `apply_failed`, `internal_error`, or
            the provider's own `error` parameter). Rejected request validation
            (`400`) is deliberately NOT recorded here: a malformed request is
            not a connection failure. Omitted when healthy or never failed;
            cleared when the connection next verifies.
        error_message:
          type: string
          description: >-
            Human-readable detail for `error_code`. Populated on the same paths
            and cleared alongside it. Omitted when there is none.
        # --- Lifecycle ---
        write_rail:
          type: string
          enum: [api_key, sign_in, domain_connect, domain_connect_async, route53_role, provider_account, managed_dns]
          description: >-
            The rail that last wrote this connection's records. Omitted when no
            rail wrote them (a manual setup, or a connection from before this
            was recorded). It decides what removing the domain can do with the
            records (`GET /connections/{id}/removal`).
        provider_account_id:
          type: string
          description: >-
            The connected provider account whose credential wrote this
            connection's records and, when the account's access is
            `continuous`, keeps them (repairs and removal). Omitted when none.
        removal_started_at:
          type: string
          format: date-time
          description: >-
            Set while the domain is being removed: the records are being taken
            out and the connection is deleted when that finishes. The domain no
            longer serves from this moment. Omitted otherwise.
    ConnectionWithRecords:
      allOf:
        - { $ref: '#/components/schemas/Connection' }
        - type: object
          required: [records]
          properties:
            records:
              type: array
              items: { $ref: '#/components/schemas/DnsRecord' }
    RecheckResult:
      allOf:
        - { $ref: '#/components/schemas/ConnectionWithRecords' }
        - type: object
          description: >-
            The body of `POST /connections/{id}:recheck`. Unlike `ReapplyResult`
            this IS a connection (the full `ConnectionWithRecords` shape, so it
            is a drop-in replacement for a `GET /connections/{id}` response)
            with the check's own findings attached.
          required: [checked, records_resolved, retried, previous_status]
          properties:
            checked:
              type: array
              description: >-
                Per-record verdict for the set that was resolved: the persisted
                records when the connection has any, otherwise (for a `pending`
                manual connection nobody wrote records for) the synthesized
                desired set.
              items:
                allOf:
                  - { $ref: '#/components/schemas/DnsRecord' }
                  - type: object
                    required: [resolved]
                    properties:
                      resolved:
                        type: boolean
                        description: Public DNS answered with this record's expected value at check time.
            records_resolved:
              type: boolean
              description: >-
                True only when EVERY entry in `checked` resolved. An empty
                `checked` is `false`: nothing to verify is not "everything
                verified".
            retried:
              type: boolean
              description: >-
                True when this call re-entered a `failed` connection into
                verification (re-basing its timeout clock), rather than
                re-checking a connection that was already in flight.
            previous_status:
              type: string
              enum: [pending, propagating, live, failed]
              description: The status the connection held when the request arrived.
    ReapplyResult:
      type: object
      description: >-
        The receipt returned by `POST /connections/{id}:reapply`. It is
        deliberately NOT a `Connection`: the re-apply endpoint reports the
        outcome of the provider write and the record set that was written, and
        carries no other connection state.
      required: [connection_id, reapplied, records]
      properties:
        connection_id:
          type: string
          description: The connection the re-apply ran against (the `{id}` path parameter).
        reapplied:
          type: boolean
          description: >-
            Always `true` on a `200`: the provider accepted the write for every
            template in the grant's bundle. Failures are reported as `409`
            (not managed / grant revoked), `422` (a provider account's key or
            write refused), `503` (managed rail unavailable) or `500`, never as
            `reapplied: false`.
        via:
          type: string
          enum: [provider_account]
          description: >-
            `provider_account` when a continuous provider account's key wrote
            the records; omitted for a kept grant or a zone CustomDomain™
            hosts.
        records:
          type: array
          description: >-
            The authoritative desired record set as recomputed and written:
            the materialized template records for a template bundle, the
            records CustomDomain™ wrote for a provider account, otherwise the
            connection's default desired set.
          items: { $ref: '#/components/schemas/DnsRecord' }
    Route53RoleStart:
      type: object
      description: The answer of `POST /connections/{id}/route53-role:start`.
      required: [connection_id, quick_create_url, template_url, region, stack_name, role_name, external_id, trusted_principal_arn, record_name, instructions]
      properties:
        connection_id: { type: string }
        quick_create_url:
          type: string
          format: uri
          description: Opens the AWS CloudFormation console with the template and every parameter filled in. Open it in a new tab.
        template_url: { type: string, format: uri, description: The public S3 URL of the CloudFormation template. }
        region: { type: string, description: 'The AWS console region the link opens in. IAM roles are global, so it does not limit the role.' }
        stack_name: { type: string, description: The stack name the link proposes. }
        role_name: { type: string, description: 'The role the stack creates: CustomDomainDNSAccess- followed by the external ID.' }
        external_id: { type: string, description: 'The external ID the role requires, generated by CustomDomain™ once per connection. AWS does not treat it as a secret.' }
        trusted_principal_arn: { type: string, description: The CustomDomain™ AWS principal the role trusts. }
        record_name: { type: string, description: 'The name the role may change, together with its www name and their verification names.' }
        hosted_zone_id: { type: string, description: 'The hosted zone passed to this call, when one was.' }
        role_arn: { type: string, description: 'The role already verified for this connection, when there is one.' }
        instructions:
          type: array
          items: { type: string }
          description: Plain steps to show the customer.
    Route53RoleComplete:
      type: object
      description: The answer of `POST /connections/{id}/route53-role:complete`.
      required: [connection, records, role_arn, zone]
      properties:
        connection: { $ref: '#/components/schemas/Connection' }
        records:
          type: array
          items: { $ref: '#/components/schemas/DnsRecord' }
        role_arn: { type: string, description: 'The verified role, now stored so an empty call re-applies with it.' }
        zone: { type: string, description: The Route 53 hosted zone the records were written into. }
    BrowserSessionView:
      type: object
      required: [id, state, provider, domain]
      description: >-
        One cloud browser session as the popup may see it. `live_view_url` and
        `live_view_origin` are present only in `awaiting_sign_in` and
        `manual_assist` (`interactive` true) and, read only, in `checking`,
        `plan_ready`, `applying` and `verifying`; never in a terminal state. The
        address is a bearer: anyone holding it can drive the browser.
      properties:
        id: { type: string }
        state:
          type: string
          enum: [created, awaiting_sign_in, checking, plan_ready, applying, verifying, manual_assist, done, done_manual, cancelled, expired, abandoned, failed]
        provider: { type: string }
        provider_name: { type: string }
        vendor: { type: string, description: "The browser hosting company." }
        domain: { type: string }
        interactive: { type: boolean, description: "True when the customer may type in the live view." }
        live_view_url: { type: string, format: uri }
        live_view_origin: { type: string }
        deadline:
          type: string
          format: date-time
          description: >-
            The next timer that matters: the sign in window in `awaiting_sign_in`,
            the approval window in `plan_ready`, the apply window in `applying`,
            the hard cap otherwise.
        plan: { $ref: '#/components/schemas/BrowserPlan' }
        manual:
          type: object
          description: "Present in `manual_assist`: the records the customer adds by hand."
          properties:
            records:
              type: array
              items:
                type: object
                properties:
                  type: { type: string }
                  name: { type: string }
                  value: { type: string }
                  ttl: { type: integer }
                  present: { type: boolean, description: "The live tick from public DNS, refreshed about every 8 seconds." }
            guide_url: { type: string }
        notice:
          type: string
          enum: [not_signed_in]
          description: Present after a `:signed-in` that landed on the sign in page, until the customer presses the button again.
        error:
          type: object
          description: Present in `manual_assist` and `failed`, and in `checking` after the records changed under a plan.
          properties:
            code: { type: string }
            message: { type: string }
    BrowserPlan:
      type: object
      required: [hash, base_hash, changes, unchanged, approve_by]
      properties:
        hash: { type: string, description: 'The sha256 of the plan, 64 hex characters. `:approve` sends all of it.' }
        base_hash: { type: string, description: "The hash of the page the plan was made from." }
        changes:
          type: array
          description: Removes, then changes, then adds. Values are shown in full.
          items:
            type: object
            required: [op, type, name]
            properties:
              op: { type: string, enum: [add, replace, remove] }
              type: { type: string }
              name: { type: string, description: "The name as the provider's page shows it, `@` for the root." }
              old: { type: string }
              new: { type: string }
              ttl: { type: integer, description: "The rounded value that will be written." }
              priority: { type: integer }
              reason: { type: string, description: "Why a record that is not ours goes." }
        unchanged: { type: integer, description: "How many records on the page stay as they are." }
        approve_by: { type: string, format: date-time }
    RailInfo:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason:
          type: string
          enum: [unknown_provider, provider_has_no_oauth, oauth_client_not_registered, not_discovered, template_not_onboarded, redirect_unavailable, rail_disabled, no_adapter, unregistered, platform_subdomain, provider_not_listed, not_enabled_for_workspace, oauth_available, script_unhealthy, vendor_unavailable, monthly_cap, sign_in_not_wired]
          description: >-
            Set exactly when `available` is false. `provider_has_no_oauth`:
            the provider publishes no OAuth rail. `oauth_client_not_registered`:
            it does, but this deployment has not set it up: no client
            registered, or an MCP server sign-in not listed in
            `MCP_SIGNIN_PROVIDERS` (operator task). `not_discovered`: no Domain Connect discovery answer.
            `template_not_onboarded`: the provider speaks Domain Connect but
            has not onboarded our template. `redirect_unavailable`: the
            provider requires our return link on a one-click apply and the
            template cannot carry it yet. `rail_disabled`: the sync rail is
            off in this deployment. `no_adapter`: no write adapter for the
            API-key rail. `unregistered` / `platform_subdomain`: the domain is
            blocked (see `blocked_reason`). For `rails.cloud_browser` only:
            `provider_not_listed` (no script for this provider, or the
            deployment does not offer it), `not_enabled_for_workspace` (the
            workspace is not on the pilot list), `oauth_available` (the provider
            has a sign in of its own, which wins), `script_unhealthy` (its script
            failed in recent sessions and the rail is paused), `vendor_unavailable`
            (the browser vendor failed to create sessions and the rail is paused),
            `monthly_cap` (the monthly browser minutes are used) and
            `sign_in_not_wired` (the sign in token cannot be signed).
        caveat:
          type: string
          description: >-
            A note on an AVAILABLE rail: what the end user must create or
            qualify for before it works (a GoDaddy Personal Access Token;
            Namecheap's API eligibility and IP allowlist). Show it; do not
            treat it as unavailability.
        flow:
          type: string
          enum: [oauth2, vercel_integration, porkbun_handoff, ovh_consent, mcp_oauth]
          description: >-
            Available `oauth` rail only: the sign-in it runs, so a client can
            label its button (see `POST /connections/{id}/oauth:start`).
        managed:
          type: boolean
          description: >-
            Available `oauth` rail only: the connect will keep its credential
            (managed mode). Omitted when it will not.
        regions:
          type: array
          items: { type: string, enum: [eu, ca, us] }
          description: >-
            Available `ovh_consent` rail only: the OVHcloud API regions this
            deployment can run the consent in, the default first.
    DomainCheck:
      type: object
      required: [domain, setup_type]
      properties:
        domain: { type: string }
        sandbox:
          type: boolean
          description: >-
            `true` when the check ran for a test mode application: nothing was
            looked up, the answer is always the manual rail, and the domain
            must be a reserved `.test` name. Omitted on a real check.
        subdomain:
          type: string
          description: >-
            Server's authoritative Public-Suffix-List parse verdict: the
            subdomain labels of `domain`, empty string when the domain IS the
            registrable apex. Clients must adopt this boundary instead of
            computing their own.
        registrable_domain:
          type: string
          description: The registrable domain (eTLD+1) of `domain` per the full PSL.
        public_suffix:
          type: string
          description: 'The effective TLD (public suffix) of `domain`, e.g. `com`, `co.uk`, `com.ng`.'
        provider: { type: [string, 'null'] }
        setup_type: { $ref: '#/components/schemas/SetupType' }
        supports_automatic: { type: boolean }
        oauth_available: { type: boolean, description: the OAuth-into-provider rail can be offered }
        domain_connect: { type: boolean, description: "the one-click (Domain Connect sync) rail is offered for this domain. Same predicate as `rails.domain_connect.available`: the provider answered discovery AND, when a provider allowlist is configured (DC_SYNC_PROVIDERS, the default), the provider is on it, i.e. is measured to serve our template catalog. Providers that speak the protocol but have not onboarded our template (GoDaddy, IONOS, Cloudflare) report false even with DC_SYNC_ENABLED on. A domain reported true will not have its domainconnect:start refused for lack of the rail." }
        registered:
          type: boolean
          description: >-
            Whether the domain resolves to a delegated zone. OMITTED (not
            false) when detection failed for a transient reason; only an
            NXDOMAIN answer reports `false`. Do not tell a user their domain is
            unregistered unless this field is present and false.
        detection_error:
          type: string
          enum: [nxdomain, resolver]
          description: >-
            Present only on a degraded check (detection failed): `nxdomain`
            means the domain is not delegated (`registered` is false, `blocked_reason`
            is `unregistered`); `resolver` means a transient resolver failure; the
            provider is unknown for now, retry the check.
        authoritative_dns_provider: { type: [string, 'null'] }
        ns_support:
          type: object
          properties:
            root: { type: boolean }
            subdomains: { type: boolean }
        wildcard_support: { type: boolean }
        cname_flattening: { type: boolean }
        apex_supported:
          type: boolean
          description: >-
            The provider can serve CNAME-like data at the zone root
            (ALIAS/ANAME/flattened CNAME). Always agrees with
            `cname_flattening`. Reported for every check, apex target or not.
        apex_message:
          type: string
          description: >-
            Present only when the record set this check ran against needs an
            apex record the provider cannot host, i.e. exactly when the apply
            would refuse with `apex_not_supported`. Gate any warning UI on this
            field, not on `apex_supported`: a subdomain connect on a provider
            with no apex capability reports `apex_supported: false` and no
            message, because nothing in that flow breaks.
        target_mode:
          type: string
          enum: [edge, custom]
          description: >-
            Where this application's domains point: `edge` (proxied by the
            platform) or `custom` (the application's own connection target, see
            `PUT /applications/{id}/connect-target`).
        apex_strategy:
          type: string
          enum: [alias, a_records, unsupported]
          description: >-
            How a ROOT domain is pointed for this application on the detected
            provider: `alias` (an ALIAS, ANAME or flattened CNAME record to a
            hostname), `a_records` (address records to `apex_targets`), or
            `unsupported` (neither is possible; `apex_message` explains).
        apex_record_type:
          type: string
          description: The record type to choose in the provider's panel for the root (ALIAS, ANAME, CNAME or A).
        apex_targets:
          type: array
          items: { type: string }
          description: The addresses a root domain's A records point at when `apex_strategy` is `a_records`.
        spf_override_support: { type: boolean }
        caa_support: { type: boolean }
        supports_social_login: { type: string, description: 'yes | no | n-a' }
        rails:
          type: object
          description: >-
            Rail truth: per rail, whether it can run for THIS domain right now,
            and when it can't, one machine reason why. `setup_type: automatic`
            / `supports_automatic` only ever meant "an adapter exists"; this
            block is what to show a user. Present on every check; a degraded
            check (detection failed) reports only `manual` available.
          properties:
            oauth: { $ref: '#/components/schemas/RailInfo' }
            domain_connect: { $ref: '#/components/schemas/RailInfo' }
            api_key: { $ref: '#/components/schemas/RailInfo' }
            manual: { $ref: '#/components/schemas/RailInfo' }
            cloud_browser:
              $ref: '#/components/schemas/RailInfo'
              description: >-
                The cloud browser sign in (see `POST /connections/{id}/browser:start`).
                Present only while the deployment has it on; absent otherwise.
        recommended_rail:
          type: string
          enum: [oauth, domain_connect, cloud_browser, api_key, manual]
          description: >-
            The rail the server recommends, by precedence oauth →
            domain_connect → cloud_browser → api_key → manual (least typing for
            the end user first). `cloud_browser` is recommended only when it is
            available and the API key rail is unavailable or carries a caveat.
            Absent when `blocked_reason` is set. The console and the
            widget follow this field so the surfaces never disagree.
        end_user_automatic:
          type: boolean
          description: >-
            True when the recommended rail needs nothing typed by the end
            user (OAuth or one-click). This is the fact `supports_automatic`
            was always misread as. An API-key rail is "automatic" only for
            someone holding an API key.
        blocked_reason:
          type: string
          enum: [unregistered, platform_subdomain]
          description: >-
            Present when no rail can connect this domain. `unregistered`: no
            nameserver delegation at all (fix it at the registrar).
            `platform_subdomain`: a hosting platform's own subdomain
            (www.<name>.vercel.app). Its DNS is the platform's; `POST
            /v1/connections` refuses it with `platform_subdomain`.
        dashboard_url:
          type: string
          description: >-
            Best-effort deep link into the detected provider's DNS panel for
            this zone, to send the user to when they add records by hand.
            Absent when unknown.
        nameservers:
          type: array
          items: { type: string }
          description: The nameserver delegation the detector observed (normalized hostnames).
        managed_dns:
          $ref: '#/components/schemas/ManagedDNSAvailability'
        integration_warnings:
          type: array
          description: >-
            Problems with how YOU configured the integration, not with the end
            user's domain. They are returned only when you supplied your own `records`.
            The widget never renders these; they are for your logs and your
            developers.


            Present because this class of failure is invisible to the party who
            can fix it: an integrator testing with `www.` sees everything work
            and ships, and only their end users hit the wall.
          items:
            type: object
            properties:
              code:
                type: string
                enum: [supplied_apex_unrealizable]
                description: >-
                  `supplied_apex_unrealizable`: you supplied a record for the
                  zone apex pointing at your own host, and this domain's DNS
                  provider has no ALIAS/ANAME/CNAME-flattening type, so a
                  hostname cannot sit at a root there. Providers WITH flattening
                  (Cloudflare, Route 53, DNSimple) accept it unchanged.
              message:
                type: string
                description: Human-readable, with the available alternatives named.
        record_conflicts:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, description: 'value-mismatch | cname-collision | spf-merge' }
              host: { type: string }
              type: { type: string }
              existing: { type: string }
              desired: { type: string }
        conflict_tolerance:
          type: integer
          description: Provider's automated-write conflict threshold (0/absent = no modeled limit).
        will_fallback_to_manual:
          type: boolean
          description: >-
            True when current record conflicts exceed the provider's threshold,
            so an automated flow would silently drop to manual. Have the user
            clear conflicts first.
    ProviderInfo:
      type: object
      required: [id]
      properties:
        id: { type: string }
        rail: { type: string, description: 'dc | oauth | api | manual' }
        oauth: { type: boolean }
    Usage:
      type: object
      description: >-
        Metered usage for ONE calendar month, for the tenant the credential
        belongs to (never a query parameter). `org`, `period`, `used` and `mode`
        are always present; the plan block below it is present whenever the org
        resolves to a billing record, which is every legitimate tenant (a new
        workspace starts on `starter`). `status`, `has_billing_account` and
        `billing_state` are billing data: they are sent only to a credential
        holding `billing:manage` (owners and admins, and a workspace's own
        non-member API key), never to a member's or viewer's key or a widget
        token.
      required: [org, period, used, mode]
      properties:
        org: { type: string, description: 'The tenant the usage belongs to, derived from the authenticated credential.' }
        period: { type: string, examples: ['2026-07'], description: 'UTC calendar month, `YYYY-MM`.' }
        used: { type: integer, description: metered domain connections this period }
        mode:
          type: string
          enum: ['test', 'live', '']
          description: The Stripe key mode the control plane is running against; empty when billing is unconfigured.
        plan: { $ref: '#/components/schemas/PlanId' }
        plan_name: { type: string, description: 'The plan''s display name, e.g. `Growth`.' }
        quota:
          type: integer
          description: >-
            The plan's included domain connections for ONE billing MONTH
            (`DomainsPerYear` ceiling-divided by 12; `0` = unlimited). Compare
            `used` against this. `limit` carries the identical value.
        limit:
          type: integer
          description: >-
            Alias of `quota`, carrying the identical value. This schema declared
            `limit` while the handler emitted only `quota`; rather than break
            either reader, both are emitted. Prefer `quota` in new code.
        metered:
          type: boolean
          description: >-
            `true` on tiers priced for overage (`growth`, `enterprise`). It
            carries NO enforcement meaning; it describes pricing only. Read
            `hard_cap` for the plan's refusal policy and `quota_enforced` for
            whether a `402` is possible right now. Never branch on this field.
        hard_cap:
          type: boolean
          description: >-
            Whether this PLAN refuses connections past `quota` (`402
            quota_exceeded`) rather than allowing and recording them as
            overage. `true` only on the entry tiers: `starter` ($10 a month)
            and the retired `free`. Every larger tier (`startup`, `premium`,
            `growth`, `enterprise`) is `false` and is never refused at quota.
            The refusal reaches the tenant's own end users through the embedded
            widget, so it is worded neutrally for them. Independent of the
            deployment's `BILLING_ENFORCE_QUOTA`; combine the two via
            `quota_enforced`.
        quota_state:
          type: string
          enum: ['ok', 'approaching', 'at_limit']
          description: >-
            The server's classification of `used` against `quota`.
            `approaching` means at or past 80% of quota; `at_limit` means
            `used >= quota`. Always `ok` on an unlimited plan (`quota <= 0`).
        quota_enforced:
          type: boolean
          description: >-
            Whether an over-quota connection would actually be refused with
            `402 quota_exceeded` right now. True only when the plan's
            `hard_cap` is set AND the deployment enables enforcement. A client
            cannot infer the second half, which is why this is served rather
            than derived. On every paid tier it is `false` at any usage level.
            A tenant may therefore be `at_limit` with `quota_enforced: false`
            (over the line with nothing refused), so never treat `at_limit`
            alone as "blocked". Always `false` on an unlimited plan.
        remaining:
          type: integer
          description: >-
            `quota - used`, floored at `0`. Omitted entirely on an unlimited
            plan, where no remainder is meaningful.
        status: { type: string, description: 'Subscription status mirrored from Stripe, e.g. `active`, `past_due` (empty for a workspace that has not subscribed). Owners and admins only.' }
        has_billing_account: { type: boolean, description: '`true` when a Stripe customer exists for the org, i.e. the billing portal is available. Owners and admins only.' }
        billing_state: { $ref: '#/components/schemas/BillingState' }
    WebhookEndpoint:
      type: object
      required: [id, url]
      properties:
        id: { type: string }
        application_id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        secret:
          type: [string, 'null']
          description: >-
            Present ONLY in the creation response (whsec_…). Deliveries are
            signed with it: each POST carries X-JE-Timestamp (unix seconds) and
            X-JE-Signature (sha256=hex of HMAC-SHA256 over "<timestamp>.<rawBody>").
            Reject deliveries whose timestamp is outside a ~5-minute window.
        created_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      required: [id, event_type]
      properties:
        id: { type: string }
        endpoint_id: { type: string }
        application_id: { type: string }
        url: { type: string, format: uri }
        event_id: { type: string }
        event_type: { type: string }
        domain: { type: string }
        attempts: { type: integer }
        status_code: { type: integer, description: HTTP status of the final attempt (0 = no response) }
        delivered: { type: boolean }
        error: { type: string }
        created_at: { type: string, format: date-time }
    CertStatus:
      type: string
      enum: [pending, issued, renewing, failed, revoked]
    Certificate:
      type: object
      required: [domain, status, managed]
      properties:
        id: { type: string }
        domain: { type: string }
        application_id: { type: string }
        status: { $ref: '#/components/schemas/CertStatus' }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        last_error: { type: string, description: most recent issuance/renewal failure; empty when healthy. }
        managed: { type: boolean, description: 'true = edge auto-manages (ACME); false = operator-imported.' }
        renew_after: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Eligibility:
      type: object
      required: [domain, eligible]
      properties:
        domain: { type: string }
        eligible: { type: boolean }
        reason: { type: string, description: "why not, when ineligible; empty when eligible." }
    ApplicationDefaultOrigin:
      type: object
      properties:
        application_id: { type: string }
        default_origin:
          type: string
          description: Absent when no default is set.
        configured:
          type: boolean
          description: Whether a default is set. Distinguishes "no default" from an empty value.
    PowerConfig:
      type: object
      required: [connection_id, domain, powered, www_redirect]
      properties:
        connection_id: { type: string }
        domain: { type: string }
        origin: { type: string, description: the URL the edge reverse-proxies to. }
        powered: { type: boolean, description: true when an origin is registered. }
        www_redirect: { type: boolean, description: serve an apex↔www redirect. }
        redirect_to: { type: string, description: "when set, the edge 301s the host here." }
        root_path_access:
          type: array
          items: { type: string }
    PowerConfigInput:
      type: object
      properties:
        application_url: { type: string, format: uri, description: 'origin the edge proxies to; required to enable, optional to re-power (kept if omitted).' }
        www_redirect: { type: boolean }
        redirect_to: { type: string, description: set to a URL to 301 the host there; "" clears it. }
        root_path_access:
          type: array
          items: { type: string }
    BulkResult:
      type: object
      required: [domain, status]
      properties:
        domain: { type: string }
        connection_id: { type: string }
        status: { type: string, enum: [connected, already, failed] }
        message: { type: string }
    CheckoutSession:
      type: object
      description: A Stripe Checkout session for the embedded or elements payment form.
      required: [id]
      properties:
        id: { type: string, examples: [cs_test_123] }
        url: { type: string, format: uri, description: hosted checkout URL (unused for embedded and elements sessions). }
        client_secret: { type: string, description: mount Stripe Embedded Checkout or the elements checkout with this. }
        ui_mode:
          type: string
          enum: [embedded, elements]
          description: How the session was really created. An `elements` request answers `embedded` when Stripe could not create an Elements session. A domain payment has no redirect flow, so it is never `hosted`.
    SellOrderView:
      type: object
      description: The stable, documented projection of a domain-purchase order.
      required: [orderId, domain, status]
      properties:
        orderId: { type: string, examples: [ord_1a2b3c] }
        domain: { type: string }
        registrar: { type: string }
        status: { type: string, enum: [quoted, purchased, transferred, failed, expired] }
        createdAt: { type: string, format: date-time }
        regOrderId: { type: string, description: "the registrar's order reference, once purchased." }
        jobId: { type: string }
        link: { type: string, description: "sharing-rail checkout URL, if any." }
        freeDomain: { type: boolean, description: promo (first-domain-free) registration. }
    SellOrder:
      type: object
      description: >-
        The finalized order record returned by fulfillment. Its stable,
        documented projection is available via `GET /v1/sell/orders/{id}`
        (`SellOrderView`); additional internal fields may be present here.
      additionalProperties: true
      properties:
        Domain: { type: string }
        Registrar: { type: string }
        RegOrderID: { type: string }
    ManagedDNSAvailability:
      type: object
      description: >-
        Whether CustomDomain™ can host this domain's zone (managed DNS). Always
        present on the domains:check response.
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason:
          type: string
          enum: ['', disabled, platform_subdomain, unsupported_tld, reserved]
          description: >-
            Empty when available. `disabled`: managed DNS is off on this
            deployment. `platform_subdomain`: the name belongs to a hosting
            platform (someone.github.io), so its nameservers can't be changed.
            `unsupported_tld`: there is no registrable domain whose
            nameservers a registrar can change. `reserved`: CustomDomain™'s
            own domain.
    ManagedDNSRecord:
      type: object
      required: [id, type, name, value, ttl, priority, source]
      properties:
        id: { type: string, description: 'Stable id derived from the record content.', examples: [mdr_1f3a9c0b7d2e5a4c6b8d] }
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS] }
        name: { type: string, description: 'Fully qualified owner name, lower case ("acme.com" is the apex, "*.acme.com" a wildcard).' }
        value:
          type: string
          description: >-
            A/AAAA: the address. CNAME/NS/MX: the target host ("." for a null
            MX). TXT: the text. SRV: "<weight> <port> <target>". CAA:
            `<flags> <tag> "<value>"`.
        ttl: { type: integer, description: Seconds. }
        priority: { type: [integer, 'null'], description: MX preference or SRV priority; null for other types. }
        source:
          type: string
          enum: [discovered, imported, customdomain, manual]
          description: >-
            Where the record came from. `customdomain` records are the ones
            CustomDomain™ needs for connected domains; they win every conflict
            and can't be removed here.
    ManagedDNSRecordInput:
      type: object
      required: [type, name, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS] }
        name: { type: string, description: 'Relative to the zone ("@", "www", "_dmarc") or fully qualified inside it.' }
        value: { type: string, description: Same forms as ManagedDNSRecord.value. }
        ttl: { type: integer, description: 'Seconds; default 3600, clamped to 60 to 604800.' }
        priority: { type: [integer, 'null'], description: 'MX preference (default 10) or SRV priority (default 0).' }
    ManagedDNSRecordsRequest:
      type: object
      additionalProperties: false
      description: Exactly one of zone_file or records.
      properties:
        zone_file: { type: string, maxLength: 262144, description: A BIND zone file (RFC 1035 master format). }
        records:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ManagedDNSRecordInput' }
    ManagedDNSView:
      type: object
      required: [zone, status, nameservers, observed_nameservers, registrar, records, warnings, checked_at, activated_at]
      properties:
        zone: { type: string, description: 'The hosted zone: the registrable domain.', examples: [acme.com] }
        status:
          type: string
          enum: [awaiting_delegation, active, failed]
          description: >-
            `awaiting_delegation`: the zone holds the records; set the
            nameservers below at the registrar. `active`: every nameserver the
            registry lists is ours. `failed`: the switch never happened within
            14 days, or the nameservers moved away again (the first warning
            says which); a failed zone keeps being checked and turns active
            once the delegation appears.
        nameservers:
          type: array
          items: { type: string }
          description: The nameservers to set at the registrar.
        observed_nameservers:
          type: array
          items: { type: string }
          description: The nameservers the registry listed at the last check.
        registrar:
          description: The domain's registrar from RDAP, or null when unknown.
          oneOf:
            - type: object
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string, description: "The registrar's website, or an empty string." }
            - { type: 'null' }
        records:
          type: array
          items: { $ref: '#/components/schemas/ManagedDNSRecord' }
        warnings:
          type: array
          items: { type: string }
          description: Plain-language notes for the user (a partial delegation, records a zone file import skipped, records replaced).
        checked_at: { type: string, format: date-time, description: When the delegation was last checked. }
        activated_at: { type: [string, 'null'], format: date-time }
    AgentScope:
      type: string
      enum: ['domains:read', 'domains:connect', 'domains:disconnect', 'domains:purchase']
      description: >-
        What an agent grant may do. `domains:read` looks: availability,
        connections, records, certificates, diagnoses, orders and the billing
        standing. `domains:connect` changes: connect a domain, recheck it,
        reapply its records, start a one click setup. `domains:disconnect`
        removes a connected domain, and the call must name the domain.
        `domains:purchase` spends, up to the grant's monthly cap.
    AgentClientRegistration:
      type: object
      required: [client_name, redirect_uris]
      description: >-
        RFC 7591 client metadata. Anything else a client sends (`client_uri`,
        `logo_uri`, `scope`, `contacts` and so on) is accepted and ignored.
      properties:
        client_name:
          type: string
          maxLength: 100
          description: >-
            Shown to the person who approves the agent. At most 100 characters,
            with no control or invisible characters and no Latin letters mixed
            with look-alike letters from another alphabet. A name that claims a
            well known brand is refused unless every redirect host belongs to
            that brand or is a loopback address.
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2000 }
          description: >-
            Where the authorization code may be sent. `https`, or `http` on a
            loopback host (`localhost`, `127.0.0.1`, `::1`) for a program on the
            person's own computer. No fragment and no user information. A
            redirect URI is matched exactly later, except for the port of a
            loopback one.
        grant_types:
          type: array
          items: { type: string }
          description: >-
            Optional. When sent it must include `authorization_code`; other
            values are ignored. The client is registered for `authorization_code`
            and `refresh_token`.
        response_types:
          type: array
          items: { type: string }
          description: Optional. When sent it must include `code`.
        token_endpoint_auth_method:
          type: string
          description: Ignored. Every agent client is a public client (`none`) and PKCE protects its code.
    AgentClient:
      type: object
      required: [client_id, client_id_issued_at, client_name, redirect_uris, token_endpoint_auth_method, grant_types, response_types]
      properties:
        client_id: { type: string, description: "Starts with `agc_`." }
        client_id_issued_at: { type: integer, format: int64, description: Unix time of the registration. }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string }, description: "The registered URIs, normalized." }
        token_endpoint_auth_method: { type: string, enum: [none] }
        grant_types: { type: array, items: { type: string }, examples: [[authorization_code, refresh_token]] }
        response_types: { type: array, items: { type: string }, examples: [[code]] }
    OAuthError:
      type: object
      required: [error]
      description: >-
        The RFC 6749 and RFC 7591 error envelope the token, revoke and register
        endpoints answer with (the `{code, title, details}` envelope of the rest
        of the API is not used there).
      properties:
        error:
          type: string
          description: >-
            `invalid_request`, `invalid_grant`, `invalid_target`,
            `unsupported_grant_type`, `invalid_client_metadata`,
            `invalid_redirect_uri`, `server_error` or `temporarily_unavailable`.
        error_description: { type: string }
    AgentTokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string, description: "With `authorization_code`: the single use code from the redirect. It lives 5 minutes." }
        code_verifier: { type: string, description: "With `authorization_code`: the PKCE verifier for the `code_challenge` sent to authorize." }
        redirect_uri: { type: string, format: uri, description: "With `authorization_code`: exactly the `redirect_uri` sent to authorize." }
        refresh_token: { type: string, description: "With `refresh_token`: the latest refresh token. It is good for one exchange." }
        resource:
          description: >-
            RFC 8707. The resource the token is for. With `authorization_code`
            it must be the one the person approved; with `refresh_token` it
            picks the audience of the new access token (the MCP endpoint when
            omitted). In a form body repeat the field; in JSON send a string or
            a list.
          oneOf:
            - { type: string, format: uri }
            - { type: array, items: { type: string, format: uri } }
    AgentTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: "An ES256 JWT. Verify it against `/.well-known/jwks.json`." }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds the access token lives (900). }
        refresh_token: { type: string, description: A new refresh token. The one just used no longer works. }
        scope: { type: string, description: "The scopes the grant carries, separated by spaces." }
    AgentConsentRequest:
      type: object
      required: [client_id, client_name, redirect_uri, scopes, redirect_host, verified, local, registration]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        redirect_uri: { type: string, description: Where the authorization code goes if the person approves. }
        scopes: { type: array, items: { $ref: '#/components/schemas/AgentScope' }, description: What the agent asked for. }
        state: { type: string, description: "The agent's own state value, echoed back to it." }
        redirect_host: { type: string, description: "The host of `redirect_uri`. The client cannot choose it freely the way it chooses its name, so show it." }
        verified: { type: boolean, description: "True when `redirect_host` is a known assistant's own callback host or a loopback address, and the name imitates no brand." }
        verified_as: { type: string, description: The known assistant `redirect_host` belongs to. }
        local: { type: boolean, description: True when the code goes to a program on the approver's own computer (a loopback redirect). }
        imitates: { type: string, description: The brand the name claims without owning the redirect host. Such a request cannot be approved. }
        registration:
          type: string
          enum: [dynamic, metadata_document]
          description: How the client identified itself, by RFC 7591 registration or by a Client ID Metadata Document.
        registered_at: { type: string, format: date-time, description: When a dynamically registered client registered. }
        client_id_host: { type: string, description: The host that publishes a metadata document client's document. }
    AgentConsentApproval:
      type: object
      required: [request, member_id, application_id, scopes]
      description: The body is decoded with unknown fields rejected.
      properties:
        request: { type: string, description: "The consent request id the browser arrived with (`aqr_...`)." }
        member_id: { type: string, description: The member who approves. It must belong to the workspace. }
        application_id: { type: string, description: The one application of the workspace the agent will act within. }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AgentScope' }
          description: What is approved, a subset of what the agent asked for.
        can_purchase: { type: boolean, deprecated: true, description: "Ignored. Purchase is allowed exactly when `domains:purchase` is among the scopes." }
        spend_cap_cents:
          type: integer
          minimum: 0
          description: >-
            The monthly spend cap in US cents. Required, and above 0, with
            `domains:purchase`, which also needs a saved card (`409` without
            one).
        persist: { type: boolean, default: true, description: "True (the default) keeps the access until it is revoked. False ends it after `expires_days`." }
        expires_days: { type: integer, minimum: 0, default: 30, description: "With `persist: false`, days until the grant expires." }
    AgentConsentResult:
      type: object
      required: [redirect_uri, code, grant_id]
      properties:
        redirect_uri: { type: string, description: "Where to send the person: the agent's redirect URI with `code` and `state` added." }
        code: { type: string, description: The single use authorization code. It lives 5 minutes. }
        state: { type: string }
        grant_id: { type: string }
    AgentGrant:
      type: object
      required: [id, tenant_id, agent_client_id, agent_name, scopes, can_purchase, spend_cap_cents, created_at, spend_this_period_cents, period]
      properties:
        id: { type: string, description: "Starts with `grt_`." }
        tenant_id: { type: string }
        agent_client_id: { type: string }
        application_id: { type: string, description: The application the grant is bound to. }
        authorized_by: { type: string, description: The member who approved it. }
        agent_name: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/AgentScope' } }
        can_purchase: { type: boolean, description: True when the grant carries `domains:purchase`. }
        spend_cap_cents: { type: integer, description: The monthly spend cap in US cents (0 without purchase access). }
        expires_at: { type: string, format: date-time, description: Absent for persistent access. }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, description: Present once the access was ended. }
        spend_this_period_cents: { type: integer, description: Spent against the cap this month. }
        period: { type: string, description: 'The month `spend_this_period_cents` counts, `YYYY-MM` (UTC).' }
    AgentGrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: '#/components/schemas/AgentGrant' }
